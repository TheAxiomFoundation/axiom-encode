# Axiom Encode model pricing rates.
#
# Rates are per 1,000,000 tokens in USD, sourced from vendor public pricing.
# When vendor pricing changes, bump `version` and update `effective_date`.
# Every model carries `source_url` (the vendor page the numbers were read from)
# and `captured_at` (the day it was read), so a rate traces to a document.

version = 3
effective_date = "2026-09-10"

[models.claude-opus-4-6]
input_per_million = 5.0
output_per_million = 25.0
cache_read_per_million = 0.50
cache_create_per_million = 6.25

[models.opus]
input_per_million = 5.0
output_per_million = 25.0
cache_read_per_million = 0.50
cache_create_per_million = 6.25

[models."gpt-5.4"]
input_per_million = 2.5
output_per_million = 15.0
cache_read_per_million = 0.25
cache_create_per_million = 0.0

[models."gpt-5.6-terra"]
input_per_million = 2.0
output_per_million = 12.0
cache_read_per_million = 0.20
cache_create_per_million = 2.50
max_input_tokens = 272000
source_url = "https://developers.openai.com/api/docs/models/gpt-5.6-terra"
captured_at = "2026-09-10"

# Vendor lists these as promotional, "available at least through November 21, 2026".
# Cache writes are 1.25x the uncached input rate per the same page.
[models."gpt-5.6-sol"]
input_per_million = 4.0
output_per_million = 20.0
cache_read_per_million = 0.40
cache_create_per_million = 5.0
max_input_tokens = 272000
source_url = "https://developers.openai.com/api/docs/models/gpt-5.6-sol"
captured_at = "2026-09-10"
promotional_until = "2026-11-21"
