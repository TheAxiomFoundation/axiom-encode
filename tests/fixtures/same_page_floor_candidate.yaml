  source: 'Tuition amount:

    Enter the federal amount designated to you from their forms T2202, TL11A, or TL11C.
    (2)


    36000 +


    5

    (2) The maximum tuition amount your spouse or common-law partner can transfer
    to you is $5,000 minus the current year


    amounts they use, even if there is still an unused part for the year.

    Your spouse or common-law partner cannot transfer to you their tuition amounts
    carried forward from a previous year.'
