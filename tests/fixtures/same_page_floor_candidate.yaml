- name: source_relationship_allows_transfer
  kind: derived
  dtype: Judgment
  period: Year
  entity: Person
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: spouse_or_common_law_partner and not source_separation_blocks_transfer
  source: 'Complete this schedule to claim a transfer of the unused part of your spouse''s
    or common-law partner''s federal amounts below.

    You may be able to claim all or part of certain amounts that your spouse or common-law
    partner qualifies for if they do not need

    to use them to reduce their federal tax to zero.

    Complete the provincial or territorial schedule (S2) to calculate your provincial
    or territorial amounts.

    If your spouse or common-law partner is filing a return, use the amounts entered
    on their return.

    If your spouse or common-law partner is not filing a return, use the amounts they
    would have entered on their return, schedules,

    and worksheets as if they were filing a return, and attach their information slips.

    If you were separated because of a breakdown in your relationship for a period
    of 90 days or more including December 31, 2025,

    your spouse or common-law partner cannot transfer any unused amounts to you.'
  metadata:
