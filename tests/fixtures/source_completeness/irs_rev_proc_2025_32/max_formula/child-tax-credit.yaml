- name: earned_income_credit_maximum_amount_allowed
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: Rev. Proc. 2025-32 section 3.06(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
          excerpt: earned income at or above which the maximum amount of the earned
            income credit is allowed
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
          excerpt: For taxable years beginning in 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: earned_income >= earned_income_amount
- name: earned_income_credit_maximum_amount_begins_to_phase_out
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: Rev. Proc. 2025-32 section 3.06(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
          excerpt: adjusted gross income (or, if greater, earned income) above which
            the maximum amount of the credit begins to phase out
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
          excerpt: For taxable years beginning in 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: max(adjusted_gross_income, earned_income) > threshold_phaseout_amount
- name: earned_income_credit_is_fully_phased_out
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: Rev. Proc. 2025-32 section 3.06(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
          excerpt: adjusted gross income (or, if greater, earned income) at or above
            which no credit is allowed
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
          excerpt: For taxable years beginning in 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: max(adjusted_gross_income, earned_income) >= completed_phaseout_amount
- name: applicable_taxable_year
  kind: parameter
  dtype: Integer
  source: Rev. Proc. 2025-32 sections 3.04(3), 3.05, and 3.06(1)
  metadata:
