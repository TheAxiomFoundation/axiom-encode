      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
          excerpt: amount used in § 23(a)(4) to determine the amount of the credit
            under § 23 that may be refundable is $5,120
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
          excerpt: For taxable years beginning in 2026
