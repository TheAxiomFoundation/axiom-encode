    required: true
  source_verification:
    corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
    source_sha256: 4837f08e036c830b44f43b0bbb064929b060efcc6349427fbc503ac13fd0b903
  summary: 'For taxable years beginning in 2026, section 3.04(3) sets the amount used

    to determine the refundable adoption credit at $5,120; section 3.05 sets

    the maximum child tax credit at $2,200 and its refundable portion at

    $1,700. Section 3.06 defines the earned income amount, threshold phaseout

    amount, and completed phaseout amount used for the earned income credit.'
