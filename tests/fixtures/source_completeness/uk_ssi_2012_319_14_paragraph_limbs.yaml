# Test data for tests/test_uk_reg14_false_demands.py, not an encoding.
# The final candidate of signed re-encode run 41745442025, with one rule for
# each limb of paragraph (8) and one for each paragraph that a limb names, so
# the complete-source gate can find a case pair for each condition it reads.
format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk/regulation/ssi/2012/319/14
    source_sha256: 96c3e74c64fca582480560eab6f48e2580f60bab59524053cde80e3c8941f29f
  summary: 'A relevant person is entitled in respect of a day if the common conditions

    and either reduction route are satisfied, entitlement has commenced, and

    the reduction is not less than that calculated under regulation 14A.

    Amount B is 2 6/7 per cent of excess weekly income. Where both routes

    apply, the greater reduction is awarded.'
