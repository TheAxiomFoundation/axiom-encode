format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/statute/43-1072
    source_sha256: 30d1dc61d45b77e7820e088fdeed82cf9b20b6c2b85923dff17f8440f0d0680f
  summary: “Household income” means income received by all household persons while
    household members. “Income” includes adjusted gross income, capital gains excluded
    from adjusted gross income, specified receipts, and the gross amount of a pension
    or annuity not otherwise exempted under subsection I. For a claimant living with
    a spouse or other persons, combined income must be less than $5,501. The shared-household
    table ranges from $502 at $0–$2,500 to $56 at $5,351–$5,500; the credit is limited
    to property taxes actually paid.
  deferred_outputs:
  - output: us-az:statutes/43-1072#a_subdivision_a_credit_amount
    reason: Subsection A, paragraph 3, subdivision (a) and subsection B, paragraph
      1 use a separate single-person income table, which is outside the encoded shared-household
      table path.
  - output: us-az:statutes/43-1072#property_tax_or_rent_credit_refund_and_setoff
    reason: Subsections C-F and G state landlord-statement, refund, setoff, filing,
      audit, deadline, extension, and one-claimant administration; these procedures
      are not computed by the encoded amount rules.
  - output: us-az:statutes/43-1072/b#shared_household_income_path
    reason: A.R.S. § 43-1072(b) requires combined income of all persons residing in
      the residence. The available encoding has no structural household-member relation
      to identify and sum an arbitrary number of members; the supplied other-member
      amount is only an aggregate boundary.
  - output: us-az:statutes/43-1072#single_household_property_tax_or_rent_credit
    reason: Subsection B(1)'s single-person household credit table and the related
      A(3)(a) path are outside the encoded shared-household table branch.
  - output: us-az:statutes/43-1072/g#deferred_g
    reason: Generated module encodes the supported rules from this source, but this
      source subparagraph depends on policy surfaces or entities that are not available
      in the current RuleSpec context. It is deferred instead of being modeled as
      a caller-supplied input or an unsupported local entity.
