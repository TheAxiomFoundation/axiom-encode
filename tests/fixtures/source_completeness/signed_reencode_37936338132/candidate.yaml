      household_income <= shared_household_credit_band_upper_bound[9]: 9 else: if
      household_income >= shared_household_credit_band_lower_bound[10] and household_income
      <= shared_household_credit_band_upper_bound[10]: 10 else: if household_income
      >= shared_household_credit_band_lower_bound[11] and household_income <= shared_household_credit_band_upper_bound[11]:
      11 else: if household_income >= shared_household_credit_band_lower_bound[12]
      and household_income <= shared_household_credit_band_upper_bound[12]: 12 else:
      if household_income >= shared_household_credit_band_lower_bound[13] and household_income
      <= shared_household_credit_band_upper_bound[13]: 13 else: if household_income
      >= shared_household_credit_band_lower_bound[14] and household_income <= shared_household_credit_band_upper_bound[14]:
      14 else: if household_income >= shared_household_credit_band_lower_bound[15]
      and household_income <= shared_household_credit_band_upper_bound[15]: 15 else:
      if household_income >= shared_household_credit_band_lower_bound[16] and household_income
      <= shared_household_credit_band_upper_bound[16]: 16 else: if household_income
