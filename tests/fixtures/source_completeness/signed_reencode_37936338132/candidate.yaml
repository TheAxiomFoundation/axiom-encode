- name: eligible_under_shared_household_income_path
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: 43-1072(b)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-az/statute/43-1072
          excerpt: Lived with a spouse or one or more persons and the combined income
            from all sources in the taxable year of all persons residing in the residence
            was less than five thousand five hundred one dollars.
  versions:
  - effective_from: '0001-01-01'
    formula: claimant_lived_with_spouse_or_one_or_more_persons and household_income
      < shared_household_income_limit
- name: claimant_meets_age_or_public_money_condition
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: 43-1072(A)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-az/statute/43-1072
          excerpt: Such resident attained the age of sixty-five years prior to or
            during the taxable year or such resident is a recipient of public monies
            under title 16 of the social security act
  versions:
  - effective_from: '0001-01-01'
    formula: claimant_age >= claimant_minimum_age or claimant_is_recipient_of_public_monies_under_title_16_social_security_act
- name: shared_household_claimant_credit_eligible
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: 43-1072(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-az/statute/43-1072
          excerpt: if all of the following apply
  versions:
  - effective_from: '0001-01-01'
    formula: claimant_meets_age_or_public_money_condition and claimant_paid_property_taxes_or_rent_during_taxable_year
      and eligible_under_shared_household_income_path
- name: shared_household_table_credit_amount
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: 43-1072(B)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-az/statute/43-1072
          excerpt: according to the following table
  versions:
  - effective_from: '0001-01-01'
    formula: 'if shared_household_credit_band < 0: 0 else: shared_household_credit_table_amount[shared_household_credit_band]'
- name: shared_household_property_tax_or_rent_credit
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: 43-1072(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-az/statute/43-1072
          excerpt: the amount of property taxes actually paid during the taxable year
            or the amount computed as follows, whichever is less
  versions:
  - effective_from: '0001-01-01'
    formula: 'if shared_household_claimant_credit_eligible: min(property_taxes_or_rent_amount_paid_for_credit,
      shared_household_table_credit_amount) else: 0'
- name: member_income
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: 43-1072(H)(6)(a)-(g), (I)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-az/statute/43-1072
          excerpt: '"Income" means the sum of the following:'
  versions:
  - effective_from: '0001-01-01'
    formula: department_adjusted_gross_income + capital_gains_excluded_from_adjusted_gross_income
      + nontaxable_strike_benefits + nontaxable_federal_interest + state_or_political_subdivision_retirement_payments
      + max(0, federal_retirement_program_payments - subsection_i_exempt_federal_retirement_program_payments)
      + gross_pension_or_annuity_income
- name: gross_pension_or_annuity_income
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: 43-1072(g)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-az/statute/43-1072
          excerpt: (g) The gross amount of any pension or annuity not otherwise exempted
            except as provided in subsection I of this section.
  versions:
  - effective_from: '0001-01-01'
    formula: max(0, gross_pension_or_annuity_amount - pension_or_annuity_amount_exempt_under_subsection_i)
- name: household_income
  kind: derived
  entity: Household
  dtype: Money
  unit: USD
  period: Year
  source: 43-1072(H)(5)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-az/statute/43-1072
          excerpt: '"Household income" means all income received by all persons of
            a household in a taxable year while members of the household.'
  versions:
  - effective_from: '0001-01-01'
    formula: member_income + other_household_members_income_received_while_members
