- name: account contribution limited and eligible excess carried forward
  period:
    period_kind: tax_year
    start: '2024-01-01'
    end: '2024-12-31'
  input:
    us-va:statutes/58.1/58/1-322/03#input.account_owner_age: 45
    us-va:statutes/58.1/58/1-322/03#input.account_contribution: 6000
    us-va:statutes/58.1/58/1-322/03#input.eligible_opening_carryforward: 0
    us-va:statutes/58.1/58/1-322/03#input.contribution_claimed_as_federal_deduction: false
  output:
    us-va:statutes/58.1/58/1-322/03#college_savings_account_deduction: 4000
    us-va:statutes/58.1/58/1-322/03#college_savings_account_carryforward: 2000
- name: opening carryforward is deductible without a new contribution
  period:
