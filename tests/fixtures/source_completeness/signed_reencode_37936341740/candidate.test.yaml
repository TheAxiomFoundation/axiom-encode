    start: '2024-01-01'
    end: '2024-12-31'
  input:
    us-va:statutes/58.1/58/1-322/03#input.account_owner_age: 45
    us-va:statutes/58.1/58/1-322/03#input.account_contribution: 0
    us-va:statutes/58.1/58/1-322/03#input.eligible_opening_carryforward: 2000
    us-va:statutes/58.1/58/1-322/03#input.contribution_claimed_as_federal_deduction: false
  output:
    us-va:statutes/58.1/58/1-322/03#college_savings_account_deduction: 2000
    us-va:statutes/58.1/58/1-322/03#college_savings_account_carryforward: 0
- name: age seventy exception permits deduction above account limit
  period:
    period_kind: tax_year
    start: '2024-01-01'
    end: '2024-12-31'
  input:
    us-va:statutes/58.1/58/1-322/03#input.account_owner_age: 70
    us-va:statutes/58.1/58/1-322/03#input.account_contribution: 10000
    us-va:statutes/58.1/58/1-322/03#input.eligible_opening_carryforward: 2000
    us-va:statutes/58.1/58/1-322/03#input.contribution_claimed_as_federal_deduction: false
  output:
