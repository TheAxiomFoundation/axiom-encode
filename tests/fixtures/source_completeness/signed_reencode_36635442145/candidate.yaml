  summary: 'Paragraph (a) identifies the statutory basis and the State-plan description
    requirement. Paragraph (b) identifies the subpart''s scope. Paragraph (c) states:
    “The requirements of this subpart apply to separate child health programs.”'
  deferred_outputs:
  - output: us:regulations/42-cfr/457/800/a#state_plan_substitution_procedure_description
    reason: 42 CFR 457.800(a) requires a State-plan description of procedures ensuring
      that State-plan health benefits coverage does not substitute for group health
      plan coverage; the State-plan description and procedures needed to assess that
      requirement are not supplied.
  - output: us:regulations/42-cfr/457/800/b#substitution_requirements
    reason: 42 CFR 457.800(b) identifies the scope of requirements concerning substitution
      of coverage generally and under premium assistance programs; it does not supply
      the substantive subpart requirements needed to assess either category.
