format: rulespec/v1
module:
  summary: |-
    The cost of transportation to obtain medical treatment or services, such as doctor or dental visits and supplies, are allowable.
    The mileage standard when private vehicles are used. (See mileage standard for the current amount)
    The actual cost of fare when public transportation or common carrier is used.
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
    source_sha256: b1962a12aa206718e60284eeea8ac59f513cc867db1dd3ec70d1a3381a006cba
  proof_validation:
    required: true
  deferred_outputs:
    - output: us-az:manuals/des/faa5/na-medical-expenses-and-deduction/block-10/private-vehicles#snap_medical_private_vehicle_transportation_amount
      reason: >-
        Cannot be computed until the referenced mileage standard is encoded.
        The private-vehicles branch of
        us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
        requires the current standard mileage rate referenced by
        “The mileage standard when private vehicles are used. (See mileage
        standard for the current amount)”; that standard mileage rate is
        not supplied in authenticated context.
inputs:
  - name: component_is_transportation_cost
    entity: Payment
    dtype: Boolean
    period: Month
  - name: transportation_purpose
    entity: Payment
    dtype: String
    period: Month
  - name: transportation_obtains_other_medical_treatment_or_services
    entity: Payment
    dtype: Boolean
    period: Month
  - name: transportation_mode
    entity: Payment
    dtype: String
    period: Month
  - name: actual_fare_cost
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
rules:
  - name: snap_medical_transportation_component_allowable
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 10, transportation allowance and examples
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: The cost of transportation to obtain medical treatment or services, such as doctor or dental visits and supplies, are allowable.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: "Examples of medical treatments or services include, and are not limited to, any of the following:"
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: |-
                ● Prescriptions

                ● Eyeglasses

                ● Dentures

                ● Hearing aids

                ● Sickroom equipment
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          component_is_transportation_cost
          and (
            transportation_purpose == "doctor_visit"
            or transportation_purpose == "dental_visit"
            or transportation_purpose == "medical_supplies"
            or transportation_purpose == "prescriptions"
            or transportation_purpose == "eyeglasses"
            or transportation_purpose == "dentures"
            or transportation_purpose == "hearing_aids"
            or transportation_purpose == "sickroom_equipment"
            or transportation_obtains_other_medical_treatment_or_services
          )
  - name: snap_medical_public_transportation_amount
    kind: derived
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 10, actual public transportation or common-carrier fare
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: The cost of transportation to obtain medical treatment or services, such as doctor or dental visits and supplies, are allowable.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: The actual cost of fare when public transportation or common carrier is used.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if snap_medical_transportation_component_allowable
          and (
            transportation_mode == "public_transportation"
            or transportation_mode == "common_carrier"
          ):
            actual_fare_cost
          else: 0
