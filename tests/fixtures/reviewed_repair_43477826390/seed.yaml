        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nl479-credits
          excerpt: "2025"
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: 'if newfoundland_and_labrador_credits_line_47900 > taxes_to_pay_for_nl479_comparison:
      newfoundland_and_labrador_credits_line_47900 - taxes_to_pay_for_nl479_comparison
      else: 0'
