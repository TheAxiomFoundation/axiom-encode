- name: nl479_credit_excess_over_taxes_to_pay
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: 'CRA Form NL479 2025: if credits exceed taxes to pay, the difference may
    be refunded.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nl479-credits
          excerpt: If the total of this credit is more than the amount of taxes you
            have to pay, you may get a refund for the difference.
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nl479-credits
          excerpt: "2025"
      - path: versions[0].effective_to
