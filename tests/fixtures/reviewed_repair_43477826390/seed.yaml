    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nl479-credits
          excerpt: 'Line 3: Line 1 minus line 2 (maximum $2,000) = ^'
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nl479-credits
          excerpt: "2025"
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nl479-credits
          excerpt: "2025"
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: "2000"
- name: nl479_2025_physical_activity_rate
  kind: parameter
  dtype: Rate
  source: 'CRA Form NL479 2025, line 6: applicable rate 17.4%.'
