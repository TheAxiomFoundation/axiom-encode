- name: nl479_physical_activity_net_expenses_line_3
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: 'CRA Form NL479 2025, line 3: line 1 minus line 2, maximum $2,000.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nl479-credits
          excerpt: 'Line 3: Line 1 minus line 2 (maximum $2,000) = ^'
      - path: versions[0].effective_from
