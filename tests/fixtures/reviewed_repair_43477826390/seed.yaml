          excerpt: "2025"
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: min(nl479_2025_physical_activity_expense_cap, nl479_entered_total_eligible_expenses_line_1
      - nl479_entered_assistance_line_2)
