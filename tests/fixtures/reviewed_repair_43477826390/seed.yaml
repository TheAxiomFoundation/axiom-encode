format: rulespec/v1
module:
  summary: 'CRA Form NL479 2025 calculates the physical activity tax credit and adds

    the amount entered from Form T1129 line 6. Receipts are kept rather than

    submitted; an additional sheet is attached if more space is needed, and

    a copy of the form is attached to a paper return.'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/nl479-credits
    source_sha256: 653f16603a51e3120b0ab0d76978b5bdc254a7b61a95c9eae33c48aa12210cef
units:
- name: CAD
  kind: currency
  minor_units: 2
inputs:
- name: nl479_physical_activity_total_eligible_expenses_line_1
  dtype: Money
  unit: CAD
  entity: Person
  period: Year
- name: nl479_physical_activity_assistance_line_2
  dtype: Money
  unit: CAD
  entity: Person
  period: Year
- name: nl479_physical_activity_amount_claimed_by_other_individuals_line_4
  dtype: Money
  unit: CAD
  entity: Person
  period: Year
- name: nl479_research_and_development_tax_credit_t1129_line_6
  dtype: Money
  unit: CAD
  entity: Person
  period: Year
- name: needs_additional_space
  dtype: Boolean
  entity: Person
  period: Year
- name: is_claiming_physical_activity_tax_credit
  dtype: Boolean
  entity: Person
  period: Year
- name: taxes_to_pay_for_nl479_comparison
