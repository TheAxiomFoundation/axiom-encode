format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-4
    source_sha256: acdd452f1b956a0ad51c1ac3df42dad0217a27dd698180904be4fae69b774008
  summary: |-
    A utility allowance is allowed regardless of the percentage of the utilities paid.
    See Shelter Cost Sharing for information on how money for shelter costs exchanged between participants in the same budgetary unit or different budgetary units, or nonparticipants, is treated as unearned income.
# Structural inventory: shared-residence bullet, nonrecipient bullet, monthly
# exchange paragraph, and separate-housing/shared-meter paragraph are encoded.
# The percentage paragraph governs the sharing outputs without a percentage gate.
# Shelter Cost Sharing is a referral only; no income treatment is calculated here.
# The NOTE supplies examples, including a separate apartment within a residence;
# same-property location and ownership are not eligibility requirements.
# Household represents the evaluated budgetary unit. Every expense fact in a
# scenario concerns the same identified utility expense and counterpart.
# Outputs establish only the named sharing path. A negative result does not
# deny another allowance path, and no output determines an allowance amount.
# 2026-08-01 is the first full Month evidence coverage floor following the
# authenticated snapshot, not a legal commencement date. Earlier coverage is
# unproven.
inputs:
  - name: evaluated_unit_utility_expense_verified
    entity: Household
    dtype: Boolean
    period: Month
  - name: another_budgetary_unit_lives_in_same_residence
    entity: Household
    dtype: Boolean
    period: Month
  - name: evaluated_unit_shares_that_utility_expense_with_other_unit
    entity: Household
    dtype: Boolean
    period: Month
  - name: evaluated_unit_shares_housing_with_other_people
    entity: Household
    dtype: Boolean
    period: Month
  - name: those_other_people_do_not_receive_na
    entity: Household
    dtype: Boolean
    period: Month
  - name: evaluated_unit_pays_that_utility_expense
    entity: Household
    dtype: Boolean
    period: Month
  - name: evaluated_unit_receives_monthly_contribution_for_that_expense_from_other_unit
    entity: Household
    dtype: Boolean
    period: Month
  - name: other_budgetary_unit_pays_that_utility_expense
    entity: Household
    dtype: Boolean
    period: Month
  - name: evaluated_unit_contributes_monthly_to_that_other_unit_for_that_expense
    entity: Household
    dtype: Boolean
    period: Month
  - name: evaluated_and_other_budgetary_units_live_in_separate_housing_units
    entity: Household
    dtype: Boolean
    period: Month
