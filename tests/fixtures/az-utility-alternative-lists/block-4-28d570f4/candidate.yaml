    entity: Household
    dtype: Rate
    period: Month
rules:
  - name: shared_residence_utility_allowance_path
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 4, opening paragraph and first bullet
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-4
              excerpt: "The budgetary unit is entitled to a utility allowance based on utility expenses verified when either situation occurs:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-4
              excerpt: More than one budgetary unit lives in the same residence and shares utility expenses.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-4
              excerpt: A utility allowance is allowed regardless of the percentage of the utilities paid.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          evaluated_unit_utility_expense_verified
          and another_budgetary_unit_lives_in_same_residence
          and evaluated_unit_shares_that_utility_expense_with_other_unit
  - name: nonrecipient_cooccupancy_utility_allowance_path
    kind: derived
    entity: Household
    dtype: Judgment
