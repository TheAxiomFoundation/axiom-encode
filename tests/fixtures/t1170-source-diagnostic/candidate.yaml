- name: t1170_prior_exchange_within_zero_inclusion_scope
  kind: derived
  dtype: Boolean
  period: Year
  source: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: 'The inclusion rate of zero is extended to any capital gain realized on the exchange of shares
            of the capital stock of a

            corporation for securities listed in the first five bullets above that are donated within 30 days of
            the exchange if certain

            conditions are met.

            '
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-donations-and-gifts/p113
          excerpt: 'The inclusion rate of zero is extended to any capital gain realized on the exchange of shares
            of the capital stock of a corporation for securities listed in the first five bullets above that are
            then donated if the capital stock shares meet all of the following conditions:


            at the time they were issued and at the time of disposition, the shares included a condition allowing
            the holder to exchange them for the securities

            the securities are the only consideration received from the exchange

            the securities are donated within 30 days of the exchange


            If the exchanged property is a partnership interest (other than prescribed interests in a partnership),
            the capital gain will generally be whichever of the following amounts is less :


            the capital gain otherwise determined

            the amount, if any, by which the cost to the donor of the exchanged interests, plus any contributions
            to partnership capital by the donor, exceeds the ACB of those interests (determined without reference
            to distributions of partnership profits or capital)


            '
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: "if t1170_exchange_route_used and t1170_exchanged_asset_kind == \"corporate_capital_stock_share\" and\
      \ t1170_gift_is_of_securities_received_in_exchange and t1170_gift_within_form_scope == true and (t1170_shares_units_classification_matches\
      \ == true or t1170_bonds_other_classification_matches == true) and t1170_exchange_right_at_issue and t1170_exchange_right_at_disposition\
      \ and t1170_securities_only_exchange_consideration and days_between(t1170_exchange_date, t1170_disposition_date)\
      \ >= 0 and days_between(t1170_exchange_date, t1170_disposition_date) <= t1170_exchange_gift_deadline_days:\n\
      \    true\nelse:\n    false"
  entity: SourceEntry
