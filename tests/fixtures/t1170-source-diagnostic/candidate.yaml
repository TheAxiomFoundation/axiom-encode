- name: federal_2025_t1170_gift_capital_gain_column_5
  kind: derived
  entity: SourceEntry
  dtype: Money
  period: Year
  source: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: 'Use this form if you donated any of the following types of properties to a registered charity
            or other qualified donee in 2025:

            (cid:129) a share, debt obligation, or right listed on a designated stock exchange

            (cid:129) a share of the capital stock of a mutual fund corporation

            (cid:129) a unit of a mutual fund trust

            (cid:129) a prescribed debt obligation

            (cid:129) an interest in a related segregated fund trust

            (cid:129) ecologically sensitive land (including a covenant, an easement or, for land in Quebec, a real
            servitude or, under certain

            conditions, a personal servitude) where it is gifted to certain qualified donees

            '
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-donations-and-gifts/p113
          excerpt: 'You may be entitled to an inclusion rate of zero on any capital gain realized on such gifts
            if you donate:


            a share of the capital stock of a mutual fund corporation

            a unit of a mutual fund trust

            an interest in a related segregated fund trust

            a prescribed debt obligation

            a share, debt obligation, or right listed on a designated stock exchange

            certified ecologically sensitive land, including a covenant or an easement to which land is subject
            or, in the case of land in Quebec, a personal servitude where certain conditions are met or real servitude
            gifted to a qualified donee other than a private foundation. For more details, see&nbsp; Ecological
            gifts


            '
