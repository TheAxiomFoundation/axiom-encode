      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-donations-and-gifts/p113
          excerpt: 'If you donate property to a qualified donee that is, at the time of the donation, included in
            a flow-through share (FTS) class of property, you are deemed to have a capital gain from the disposition
            of another capital property. In addition to any capital gain that would otherwise be subject to the
            zero inclusion rate discussed earlier in this section, you are deemed to have a capital gain from the
            disposition of another capital property equal to the whichever of the following amounts is less :


            the amount of your exemption threshold, at the time of the donation, in respect of the FTS class of
            property

            the total capital gains from the actual disposition


            If there is no advantage received in respect of the gift, the full amount of the capital gain is eligible
            for the inclusion rate of zero. However, if you receive an advantage in respect of the gift, only a
            portion of the capital gain is eligible for the inclusion rate of zero. The rest is subject to the inclusion
            rate calculated on&nbsp; Schedule 3, Capital Gains or Losses .

            The amount subject to the inclusion rate of zero is calculated using the following formula:

            A × (B ÷ C)

            Where A = the capital gain B = the eligible amount of the gift C = the proceeds of disposition

            '
