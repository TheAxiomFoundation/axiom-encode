  kind: derived
  entity: Person
  dtype: Money
  period: Year
  source: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: 'If the exchanged property is a partnership interest (other than prescribed interests in a partnership),
            a special calculation is

            required to determine what the capital gain will be. This amount should be reported directly on line
            17400 in Part 4 of

            Schedule 3, Capital Gains or Losses.

            '
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
