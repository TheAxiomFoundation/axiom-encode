      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-donations-and-gifts/p113
          excerpt: 'If the exchanged property is a partnership interest (other than prescribed interests in a partnership),
            the capital gain will generally be whichever of the following amounts is less :


            the capital gain otherwise determined

            the amount, if any, by which the cost to the donor of the exchanged interests, plus any contributions
            to partnership capital by the donor, exceeds the ACB of those interests (determined without reference
            to distributions of partnership profits or capital)'
