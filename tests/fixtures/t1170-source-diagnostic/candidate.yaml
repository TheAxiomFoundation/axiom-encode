format: rulespec/v1
imports: []
module:
  summary: 'Complete-parent T1170 diagnostic: three per-gift table memberships, distinct qualifying prior-exchange
    zero inclusion, locally calculated per-entry partnership capital gain, explicit ecological property/donee scope
    and document/reporting duties. No native/publication claim.'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
    source_sha256: 26bca8d19acdc5f045f1d8317cf8e7a504b07c3496cfffcec34a82232f72b8b0
units:
- name: CAD
  kind: currency
  minor_units: 2
inputs:
- name: t1170_proceeds_of_disposition_column_2
  entity: SourceEntry
  dtype: Money
  period: Year
  unit: CAD
  description: Exact entered per-gift column amount; externally determined tax/factual value, not inferred from
    table totals or legal eligibility.
- name: t1170_adjusted_cost_base_column_3
  entity: SourceEntry
  dtype: Money
  period: Year
  unit: CAD
  description: Exact entered per-gift column amount; externally determined tax/factual value, not inferred from
    table totals or legal eligibility.
- name: t1170_outlays_and_expenses_column_4
  entity: SourceEntry
  dtype: Money
  period: Year
  unit: CAD
  description: Exact entered per-gift column amount; externally determined tax/factual value, not inferred from
    table totals or legal eligibility.
- name: t1170_eligible_amount_of_gift_column_6
  entity: SourceEntry
  dtype: Money
  period: Year
  unit: CAD
  description: Exact entered per-gift column amount; externally determined tax/factual value, not inferred from
    table totals or legal eligibility.
- name: t1170_year_acquired_column_1
  entity: SourceEntry
  dtype: Integer
  period: Year
  description: Printed acquisition year; not a cutoff used to infer gift eligibility.
- name: t1170_disposition_date
  entity: SourceEntry
  dtype: Date
  period: Year
  description: Actual gift/disposition date used for explicit2025 form applicability.
- name: t1170_qualified_donee
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: Externally established qualified-donee status, not aggregate gift eligibility.
- name: t1170_property_source_class
  entity: SourceEntry
  dtype: Text
  period: Year
  description: Explicit selected source category from six page1 classes, not generic eligible=True.
- name: t1170_shares_number
  entity: SourceEntry
  dtype: Integer
  period: Year
  description: Number field in shares table.
- name: t1170_fund_corporation_share_class
  entity: SourceEntry
  dtype: Text
  period: Year
  description: Name of fund/corporation and class of shares.
- name: t1170_bond_face_value
  entity: SourceEntry
  dtype: Money
  period: Year
  unit: CAD
  description: Printed face value, not proceeds.
- name: t1170_bond_maturity_date
  entity: SourceEntry
  dtype: Date
  period: Year
  description: Printed maturity date, not disposition date.
- name: t1170_bond_issuer
  entity: SourceEntry
  dtype: Text
  period: Year
  description: Printed issuer.
- name: t1170_land_address_or_legal_description
  entity: SourceEntry
  dtype: Text
  period: Year
  description: Printed land identification; no title/ownership inference.
- name: t1170_exchange_route_used
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: Whether source exchange-extension route is invoked for this transaction.
- name: t1170_exchange_right_at_issue
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: P113 exchange condition in original shares at issuance.
- name: t1170_exchange_right_at_disposition
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: P113 exchange condition still present at disposition.
- name: t1170_securities_only_exchange_consideration
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: P113 securities-only consideration condition.
- name: t1170_exchange_date
  entity: SourceEntry
  dtype: Date
  period: Year
  description: Actual exchange date, not period_start-derived.
- name: completing_t1170
  entity: Person
  dtype: Boolean
  period: Year
  description: Explicit use of this form, not completed filing.
- name: needs_t1170_additional_space
  entity: Person
  dtype: Boolean
  period: Year
  description: Actual additional-space need, not inferred from number of rows.
- name: t1170_fts_schedule3_additional_gain_applies
  entity: Person
  dtype: Boolean
  period: Year
  description: Source FTS additional-gain reporting circumstance; does not calculate threshold.
- name: t1170_completed_schedule3_fts_gain_line68231
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  description: Completed upstream Schedule3 deemed gain already included there.
- name: t1170_nonprescribed_partnership_exchange_applies
  entity: Person
  dtype: Boolean
  period: Year
  description: 'Specific source branch: exchanged partnership interest other than prescribed interests.'
- name: t1170_advantage_in_respect_of_gift
  entity: SourceEntry
  dtype: Money
  period: Year
  unit: CAD
  description: Explicit advantage received for this new diagnostic row. Does not replace entered eligible amount
    or infer gift eligibility; new values are labelled new facts.
- name: t1170_property_instrument_kind
  entity: SourceEntry
  dtype: Text
  period: Year
  description: Explicit instrument discriminator for designated-exchange source class, not inferred from amount
    or owner.
- name: t1170_ecological_donee_not_private_foundation
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: Explicit P113 ecological-donee restriction, independent of generic qualified_donee. Only applicable
    ecological rows supply it.
- name: t1170_exchanged_asset_kind
  entity: SourceEntry
  dtype: Text
  period: Year
  description: Explicit kind of the property surrendered in this selected prior exchange; corporate_capital_stock_share
    identifies capital-stock shares of a corporation, never inferred from the donated security.
- name: t1170_gift_is_of_securities_received_in_exchange
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: Explicit selected-transaction fact that the donated securities in this row are the securities received
    in the prior exchange; no ownership or factual-truth inference.
- name: t1170_land_interest_subtype
  entity: SourceEntry
  dtype: Text
  period: Year
  description: 'Explicit newly stated ecological property/donee attribute: t1170_land_interest_subtype. No inference
    from the class label.'
- name: t1170_land_location_jurisdiction
  entity: SourceEntry
  dtype: Text
  period: Year
  description: Actual jurisdiction of land; Quebec required for both servitude forms, not donor residence.
- name: t1170_personal_servitude_term_years
  entity: SourceEntry
  dtype: Integer
  period: Year
  description: Actual term of personal-servitude rights; reached only for Quebec personal subtype.
- name: t1170_ecological_land_certified_by_eccc
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: Minister or designated person has actually certified ecological sensitivity for this land, not caller
    self-assessment.
- name: t1170_ecological_donee_category
  entity: SourceEntry
  dtype: Text
  period: Year
  description: 'Explicit newly stated ecological property/donee attribute: t1170_ecological_donee_category. No inference
    from the class label.'
- name: t1170_ecological_donee_approved_in_respect_of_gift
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: Minister/designate approval for this gift; required for municipality/public body/registered charity
    branch, not government branch.
- name: t1170_prior_exchange_capital_gain
  entity: SourceEntry
  dtype: Money
  period: Year
  description: Actual capital gain on this earlier corporation-share exchange, separately determined from the later
    donated-property column5. Explicit hypothetical transaction amount, no gift-ratio inference.
  unit: CAD
- name: t1170_partnership_exchange_gain_otherwise_determined
  entity: SourceEntry
  dtype: Money
  period: Year
  description: Capital gain on this exchanged non-prescribed interest determined before this special calculation;
    not ordinary gift gain.
  unit: CAD
- name: t1170_exchanged_partnership_interest_cost
  entity: SourceEntry
  dtype: Money
  period: Year
  description: Cost to this donor of this exchanged interest.
  unit: CAD
- name: t1170_donor_partnership_capital_contributions
  entity: SourceEntry
  dtype: Money
  period: Year
  description: Contributions to partnership capital by this donor for this interest; source-attributed amount, not
    arbitrary all partnership cashflows.
  unit: CAD
- name: t1170_partnership_adjusted_basis_without_distributions
  entity: SourceEntry
  dtype: Money
  period: Year
  description: Adjusted cost base of this interest determined without distributions of partnership profits or capital;
    externally determined basis fact.
  unit: CAD
- name: t1170_partnership_exchange_right_at_issue
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: Actual exchange right in the selected non-prescribed partnership interest at issuance; partnership-specific
    counterfactual condition, not a corporation-share fact.
- name: t1170_partnership_exchange_right_at_disposition
  entity: SourceEntry
  dtype: Boolean
  period: Year
  description: Actual exchange right in the selected non-prescribed partnership interest at disposition; partnership-specific
    counterfactual condition, not a corporation-share fact.
rules:
- name: federal_2025_t1170_taxable_inclusion_rate
  kind: parameter
  dtype: Rate
  source: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: 'If there is no advantage in respect of the gift, the full amount of the capital gain realized
            on the gift is eligible for an inclusion

            rate of zero. However, if there is an advantage, only a portion of the capital gain is eligible for
            the inclusion rate of zero. The

            rest is subject to the inclusion rate of 50%.

            '
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: '0.50'
