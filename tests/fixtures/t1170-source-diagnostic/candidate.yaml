- name: t1170_gift_within_form_scope
  entity: SourceEntry
  dtype: Boolean
  kind: derived
  period: Year
  source: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: 'Use this form if you donated any of the following types of properties to a registered charity
            or other qualified donee in 2025:

            (cid:129) a share, debt obligation, or right listed on a designated stock exchange

            (cid:129) a share of the capital stock of a mutual fund corporation

            (cid:129) a unit of a mutual fund trust

            (cid:129) a prescribed debt obligation

            (cid:129) an interest in a related segregated fund trust

            (cid:129) ecologically sensitive land (including a covenant, an easement or, for land in Quebec, a real
            servitude or, under certain

            conditions, a personal servitude) where it is gifted to certain qualified donees

            '
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-donations-and-gifts/p113
          excerpt: 'You may be entitled to an inclusion rate of zero on any capital gain realized on such gifts
            if you donate:


            a share of the capital stock of a mutual fund corporation

            a unit of a mutual fund trust

            an interest in a related segregated fund trust

            a prescribed debt obligation

            a share, debt obligation, or right listed on a designated stock exchange

            certified ecologically sensitive land, including a covenant or an easement to which land is subject
            or, in the case of land in Quebec, a personal servitude where certain conditions are met or real servitude
            gifted to a qualified donee other than a private foundation. For more details, see&nbsp; Ecological
            gifts


            '
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/capital-gains-on-gifts
          excerpt: CRA Form T1170 2025 Capital Gains on Gifts of Certain Capital Property
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-donations-and-gifts/p113
          excerpt: 'You may be able to claim a tax credit based on the eligible amount of a gift of ecologically
            sensitive land, including a covenant, an easement, or in the case of land in Quebec, a real servitude
            or a personal servitude (the rights to which the land is subject and which has a term of not less than
            100 years)&nbsp;you made to any of the following:&nbsp;


            the Government&nbsp;of Canada, a province or a territory

            a municipality in Canada, or a municipal or public body performing a function of government in Canada,
            that is approved by the Minister of Environment and Climate Change Canada (ECCC) or a person designated
            by that Minister in respect of the gift

            a registered charity approved by the Minister of ECCC or the designated person in respect of the gift'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-donations-and-gifts/p113
          excerpt: 'A&nbsp;gift of ecologically sensitive land cannot be made to a private foundation.

            The Minister of ECCC , or a person designated by that Minister, has to certify that the land is ecologically
            sensitive land, the conservation and protection of which is important to the preservation of Canada''s
            environmental heritage. The Minister also determines the FMV of the gift.'
