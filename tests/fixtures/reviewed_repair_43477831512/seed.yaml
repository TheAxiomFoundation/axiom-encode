format: rulespec/v1
module:
  summary: 'Schedule NB(S12) 2025: line 3 is line 1 minus line 2, to a

    maximum of $10,000; line 5 subtracts line 4; line 7 applies 10%.

    The schedule also gives reporting and medical-separation instructions.'
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/nb-s12-seniors-home-renovation-credit
    source_sha256: 379be48dbb691c24d89f966c85bb3facd095ad59850f945bbf71e3dc9a92ffbe
  proof_validation:
    required: true
rules:
- name: nb_s12_schedule_tax_year
  kind: parameter
  dtype: Integer
  source: CRA Schedule NB(S12) 2025.
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: "2025"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nb-s12-seniors-home-renovation-credit
          excerpt: CRA Schedule NB(S12) 2025 New Brunswick Seniors' Home Renovation
            Tax Credit
- name: nb_s12_net_home_renovation_expenses_line_3
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: 'Line 3: Line 1 minus line 2 (maximum $10,000) = ^'
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: min(nb_s12_2025_home_renovation_expense_cap, entered_total_eligible_home_renovation_expenses
      - entered_home_renovation_assistance)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nb-s12-seniors-home-renovation-credit
          excerpt: 'Line 3: Line 1 minus line 2 (maximum $10,000) = ^'
- name: nb_s12_home_renovation_expenses_line_60360
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: 'Line 5 and line 60360: Line 3 minus line 4 Home renovation expenses = ^'
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: nb_s12_net_home_renovation_expenses_line_3 - entered_home_renovation_other_claims
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nb-s12-seniors-home-renovation-credit
          excerpt: 'Line 5 and line 60360: Line 3 minus line 4 Home renovation expenses
            = ^'
- name: new_brunswick_seniors_home_renovation_tax_credit_line_47900
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: Line 7, New Brunswick seniors' home renovation tax credit.
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: nb_s12_home_renovation_expenses_line_60360 * nb_s12_2025_home_renovation_rate
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nb-s12-seniors-home-renovation-credit
          excerpt: 'Line 7: Line 5 multiplied by the percentage from line 6 Enter
            this amount on'
- name: nb_s12_2025_home_renovation_expense_cap
  kind: parameter
  dtype: Money
  unit: CAD
  source: Line 3 maximum $10,000.
  versions:
  - effective_from: '2025-01-01'
    formula: 10000
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/nb-s12-seniors-home-renovation-credit
          excerpt: 'Line 3: Line 1 minus line 2 (maximum $10,000) ='
- name: nb_s12_2025_home_renovation_rate
  kind: parameter
  dtype: Rate
  source: Line 6 applicable rate 10%.
  versions:
