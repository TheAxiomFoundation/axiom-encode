format: rulespec/v1
module:
  summary: '“Complete this schedule if interest was paid in 2025 on a student loan

    granted to you.” Add lines 46 and 48; subtract the amount carried to

    line 385 from line 52.'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
    source_sha256: e8a905d1a3e9dd708c46ffc0090fafeeeb5c840a0c708a8c80dff2674b78c90a
rules:
- name: schedule_m_unused_student_loan_interest_for_2025_line_46
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: Revenu Quebec Schedule M 2025 instructions for line 46.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: 'Also complete this schedule if, for 2024, you calculated an amount
            for interest paid on a student loan and decided to carry the amount forward

            to a future year.'
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: or the amount shown in this respect on your 2024 notice of assessment
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: 'If interest was paid on your student loan after 1997, but in 2024
            you did not calculate the amount that could be carried forward, enter
            the result

            of the following calculation on line 46: interest paid for 1998 through
            2024 minus the interest already used to calculate a credit for interest
            paid

            on a student loan for previous years.'
      - path: versions[0].formula
        kind: unit
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: a student loan granted to you
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: Interest paid in 2025 on a student loan
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: Revenu Quebec Schedule M 2025 - Interest Paid on a Student Loan
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: 'if schedule_m_carryforward_calculated_for_2024: schedule_m_unused_student_loan_interest_line_46
      else: schedule_m_student_loan_interest_paid_1998_through_2024 - schedule_m_student_loan_interest_used_for_previous_year_credits'
- name: student_loan_interest_schedule_completion_required
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: Revenu Quebec Schedule M 2025 completion instructions.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: Complete this schedule if interest was paid in 2025 on a student
            loan granted to you.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: 'Also complete this schedule if, for 2024, you calculated an amount
            for interest paid on a student loan and decided to carry the amount forward

            to a future year.'
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: Revenu Quebec Schedule M 2025 - Interest Paid on a Student Loan
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: Revenu Quebec Schedule M 2025 - Interest Paid on a Student Loan
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: "(schedule_m_student_loan_interest_paid_2025_line_48 > 0)\nor (schedule_m_carryforward_calculated_for_2024\n\
      \    and schedule_m_decided_to_carry_2024_student_loan_interest_to_future_year)"
- name: schedule_m_historical_interest_start_year
  kind: parameter
  dtype: Integer
  source: Schedule M historical reconstruction instruction, “interest paid for 1998
    through 2024”
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: interest paid for 1998 through 2024
  versions:
  - effective_from: '2025-01-01'
    formula: "1998"
- name: schedule_m_previous_interest_start_year
  kind: parameter
  dtype: Integer
  source: Schedule M historical reconstruction instruction, “after 1997”
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: If interest was paid on your student loan after 1997
  versions:
  - effective_from: '2025-01-01'
    formula: "1997"
- name: schedule_m_prior_calculation_year
  kind: parameter
  dtype: Integer
  source: Schedule M prior-year carryforward instruction, “for 2024”
  metadata:
    proof:
      atoms:
