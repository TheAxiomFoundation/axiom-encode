        kind: amount
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: for 2024
  versions:
  - effective_from: '2025-01-01'
    formula: "2024"
- name: schedule_m_current_interest_year
  kind: parameter
  dtype: Integer
  source: Schedule M current-year interest instruction, “Interest paid in 2025”
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-m-student-loan-interest
          excerpt: Interest paid in 2025 on a student loan
  versions:
