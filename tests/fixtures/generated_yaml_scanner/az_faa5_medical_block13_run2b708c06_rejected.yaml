format: rulespec/v1
module:
  summary: |-
    The costs to secure and maintain professionally trained service animals that assist elderly participants or participants with a disability in performing normal living activities are allowable as NA medical expenses.
    NOTE Breeding and whelping fees are not allowable.
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
    source_sha256: bc48156babc06f83300ac9e3b612f608edd864b61d8d41c44e7968d945376f82
  proof_validation:
    required: true
  # No numbered structural markers occur in this source.
  # ENCODE: securing and maintenance costs; elderly and disability alternatives;
  # medical need; professional and specific task training; prescription waiver;
  # food, veterinary services, kennel fees, training; breeding and whelping.
  # Seeing-eye and hearing-ear animals are nonexclusive examples, not extra gates.
  # Discussion and case-file documentation govern the qualification determination.
  # August 2026 is an evidence-coverage scaffold, not legal commencement.
  # Evaluate expense outputs per participant and separately identified component.
inputs:
  - name: participant_is_elderly_under_na_requirements
    entity: Person
    dtype: Boolean
    period: Month
  - name: participant_has_disability_under_na_requirements
    entity: Person
    dtype: Boolean
    period: Month
  - name: animal_is_professionally_trained
    entity: Person
    dtype: Boolean
    period: Month
  - name: animal_is_required_because_of_medical_issue
    entity: Person
    dtype: Boolean
    period: Month
  - name: animal_is_specifically_trained_for_participant_normal_living_tasks
    entity: Person
    dtype: Boolean
    period: Month
  - name: service_animal_expense_component_category
    entity: Person
    dtype: String
    period: Month
rules:
  - name: snap_service_animal_medical_prescription_not_required
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 13, prescription requirement
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: It is not a requirement that a physician or medical professional prescribe the need for the animal when the participant is elderly or has a disability in accordance with NA requirements.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          participant_is_elderly_under_na_requirements
          or participant_has_disability_under_na_requirements
  - name: snap_service_animal_qualifies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 13, service-animal definition and documented requirements
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: The costs to secure and maintain professionally trained service animals that assist elderly participants or participants with a disability in performing normal living activities are allowable as NA medical expenses.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: The service animal is required because of a medical issue.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: The service animal is specifically trained to perform work or tasks for the participant.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                Service animals, including any of the following:

                ● Seeing-eye animals

                ● Hearing-ear animals
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Discuss and document the case file(g) whether the service animal meets all of the following requirements:
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (
            participant_is_elderly_under_na_requirements
            or participant_has_disability_under_na_requirements
          )
          and animal_is_professionally_trained
          and animal_is_required_because_of_medical_issue
          and animal_is_specifically_trained_for_participant_normal_living_tasks
  - name: snap_service_animal_expense_component_allowable
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 13, securing and maintenance expenses and exclusions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: The costs to secure and maintain professionally trained service animals that assist elderly participants or participants with a disability in performing normal living activities are allowable as NA medical expenses.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                Allowable maintenance costs include any of the following:

                ● Purchase of animal food

                ● Veterinary services

                ● Kennel fees

                ● Training
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: NOTE Breeding and whelping fees are not allowable.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          snap_service_animal_qualifies
          and (
            service_animal_expense_component_category == "securing"
            or service_animal_expense_component_category == "other_maintenance"
            or service_animal_expense_component_category == "animal_food"
            or service_animal_expense_component_category == "veterinary_services"
            or service_animal_expense_component_category == "kennel_fees"
            or service_animal_expense_component_category == "training"
          )
          and not (service_animal_expense_component_category == "breeding")
          and not (service_animal_expense_component_category == "whelping")
