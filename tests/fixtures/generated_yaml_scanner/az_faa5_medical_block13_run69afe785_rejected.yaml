format: rulespec/v1
module:
  summary: |-
    The costs to secure and maintain professionally trained service animals that assist elderly participants or participants with a disability in performing normal living activities are allowable as NA medical expenses.
    NOTE Breeding and whelping fees are not allowable.
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
    source_sha256: bc48156babc06f83300ac9e3b612f608edd864b61d8d41c44e7968d945376f82
  proof_validation:
    required: true
# Branch inventory:
# Opening allowance and service-animal definition: ENCODE.
# Seeing-eye and hearing-ear examples: ENCODE within the general allowance;
# neither example is a necessary condition or an exhaustive classification.
# Medical necessity and participant-specific training requirements: ENCODE.
# Discussion and case-file documentation: cited administrative instruction.
# Prescription not required: ENCODE by imposing no prescription gate.
# Food, veterinary services, kennel fees, and training: ENCODE as maintenance.
# Breeding and whelping exclusions: ENCODE separately in the final judgment.
# The evidence floor is not a finding of legal commencement.
inputs:
  - name: participant_is_elderly_under_na_requirements
    entity: Person
    dtype: Boolean
    period: Month
  - name: participant_has_disability_under_na_requirements
    entity: Person
    dtype: Boolean
    period: Month
  - name: animal_is_professionally_trained
    entity: Person
    dtype: Boolean
    period: Month
  - name: animal_is_required_because_of_medical_issue
    entity: Person
    dtype: Boolean
    period: Month
  - name: animal_is_specifically_trained_for_participant_tasks
    entity: Person
    dtype: Boolean
    period: Month
  - name: animal_assists_participant_in_normal_living_activities
    entity: Person
    dtype: Boolean
    period: Month
  - name: component_is_cost_to_secure_or_maintain_animal
    entity: Person
    dtype: Boolean
    period: Month
  - name: animal_expense_component_category
    entity: Person
    dtype: String
    period: Month
rules:
  - name: snap_service_animal_expense_component_allowable
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 13
    metadata:
      component_scope: Evaluate separately for each participant, animal, and identified expense component.
      category_scope: Food, veterinary services, kennel fees, and training are maintenance costs. The maintenance examples are not exhaustive. Breeding and whelping fees must be separately identified.
      status_scope: Elderly and disability statuses are boundary determinations under Elderly or Have a Disability - NA Special Considerations; this rule does not compute those external definitions.
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: The costs to secure and maintain professionally trained service animals that assist elderly participants or participants with a disability in performing normal living activities are allowable as NA medical expenses.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Seeing-eye animals
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Hearing-ear animals
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: The service animal is required because of a medical issue.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: The service animal is specifically trained to perform work or tasks for the participant.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Discuss and document the case file(g) whether the service animal meets all of the following requirements:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: It is not a requirement that a physician or medical professional prescribe the need for the animal when the participant is elderly or has a disability in accordance with NA requirements.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Allowable maintenance costs include any of the following:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Purchase of animal food
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Veterinary services
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Kennel fees
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Training
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: Breeding and whelping fees are not allowable.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (
            participant_is_elderly_under_na_requirements
            or participant_has_disability_under_na_requirements
          )
          and component_is_cost_to_secure_or_maintain_animal
          and animal_is_professionally_trained
          and animal_is_required_because_of_medical_issue
          and animal_is_specifically_trained_for_participant_tasks
          and animal_assists_participant_in_normal_living_activities
          and not (animal_expense_component_category == "breeding")
          and not (animal_expense_component_category == "whelping")
