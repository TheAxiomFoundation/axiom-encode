format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/7/2015/f
    source_sha256: 239cc65999d115055d13b7b3a72ef1a4c83da4fdbab9ab71d0ea33536d2b96c2
  summary: No otherwise eligible household member may participate unless the individual
    is a resident of the United States and is a citizen or national, a lawfully admitted
    permanent resident, a Cuban and Haitian entrant, or an individual lawfully residing
    under a Compact of Free Association. Income, less at State option a pro rata share,
    and financial resources of an individual rendered ineligible are considered for
    household eligibility and allotment. The four-category status rule reflects the
    July 4, 2025 boundary.
inputs:
- name: person_is_member_of_household_otherwise_eligible_to_participate_under_this_section
  entity: Person
  dtype: Boolean
  period: Month
- name: person_is_resident_of_united_states
  entity: Person
  dtype: Boolean
  period: Month
- name: person_is_citizen_or_national_of_united_states
  entity: Person
  dtype: Boolean
  period: Month
- name: person_is_alien_lawfully_admitted_for_permanent_residence_as_immigrant
  entity: Person
  dtype: Boolean
  period: Month
- name: person_has_been_granted_status_of_cuban_and_haitian_entrant
  entity: Person
  dtype: Boolean
  period: Month
- name: person_lawfully_resides_in_united_states_under_compact_of_free_association
  entity: Person
  dtype: Boolean
  period: Month
- name: individual_income
  entity: Person
  dtype: Money
  unit: USD
  period: Month
- name: individual_financial_resources
  entity: Person
  dtype: Money
  unit: USD
  period: Month
- name: state_applies_pro_rata_income_share_option
  entity: Person
  dtype: Boolean
  period: Month
- name: pro_rata_income_share
  entity: Person
  dtype: Money
  unit: USD
  period: Month
rules:
- name: person_meets_snap_residency_requirement
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 U.S.C. 2015(f)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: a resident of the United States
  versions:
  - effective_from: '2025-07-01'
    formula: person_is_resident_of_united_states
- name: person_has_qualifying_snap_status
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 U.S.C. 2015(f)(2)(A)-(D)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: either— (A) a citizen or national of the United States
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: (B) an alien lawfully admitted for permanent residence as an immigrant
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: (C) an alien who has been granted the status of Cuban and Haitian
            entrant
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: (D) an individual who lawfully resides in the United States in
            accordance with a Compact of Free Association
  versions:
  - effective_from: '2025-07-01'
    formula: 'person_is_citizen_or_national_of_united_states

      or person_is_alien_lawfully_admitted_for_permanent_residence_as_immigrant

      or person_has_been_granted_status_of_cuban_and_haitian_entrant

      or person_lawfully_resides_in_united_states_under_compact_of_free_association'
- name: residency_or_status_ineligible_for_snap_participation
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 U.S.C. 2015(f) chapeau and paragraphs (1)-(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: No individual who is a member of a household otherwise eligible
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: unless he or she is— (1) a resident of the United States; and (2)
            either
  versions:
  - effective_from: '2025-07-01'
    formula: 'person_is_member_of_household_otherwise_eligible_to_participate_under_this_section

      and

      (not person_meets_snap_residency_requirement

      or not person_has_qualifying_snap_status)'
- name: ineligible_individual_income_considered
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: 7 U.S.C. 2015(f), final unnumbered paragraph
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: The income (less, at State option, a pro rata share)
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: of the individual rendered ineligible to participate
  versions:
  - effective_from: '2025-07-01'
    formula: "if residency_or_status_ineligible_for_snap_participation:\n  if state_applies_pro_rata_income_share_option:\n\
      \    max(0, individual_income - pro_rata_income_share)\n  else: max(0, individual_income)\n\
      else: 0"
- name: ineligible_individual_financial_resources_considered
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: 7 U.S.C. 2015(f), final unnumbered paragraph
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: financial resources of the individual rendered ineligible
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: shall be considered in determining the eligibility and the value
            of the allotment
  versions:
  - effective_from: '2025-07-01'
    formula: "if residency_or_status_ineligible_for_snap_participation:\n  max(0,\
      \ individual_financial_resources)\nelse: 0"
