format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-md/guidance/dhs/fia/snap-manual-214/page-5
    source_sha256: a5ef1766f3edd9b8f82191b8cfbef6cb1da36f8e8eb7501531da63380e4a3c96
  summary: “When two or more households live in separate housing units ... and share
    one utility meter, each household gets a full allowance.” “Give the household
    the full allowance regardless of the amount paid on the bill or if the bill is
    shared among several households.”
  deferred_outputs:
  - output: us-md:policies/dhs/fia/snap-manual-214/page-5#telephone_allowance_amount
    reason: SNAP Manual 214.3.A–B requires the flat telephone-allowance rate referenced
      in section 600.3, which is not supplied in the available source or context.
  - output: us-md:policies/dhs/fia/snap-manual-214/page-5#shared_meter_sua_amount
    reason: SNAP Manual 214.2.E requires the monetary value of the full standard utility
      allowance, which is not supplied in the available source or context.
