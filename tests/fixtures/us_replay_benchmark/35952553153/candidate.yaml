rules:
- name: minimum_parole_period_years
  kind: parameter
  dtype: Count
  source: 7 CFR 273.4(a)(6)(i)(D)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: for a period of at least 1 year
  versions:
  - effective_from: '0001-01-01'
    formula: '1'
- name: indigence_income_limit_rate
  kind: parameter
  dtype: Rate
  source: 7 CFR 273.4(c)(3)(iv)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: does not exceed 130 percent of the poverty income guideline
  versions:
  - effective_from: '0001-01-01'
    formula: '1.30'
- name: indigent_sponsored_alien_unable_to_obtain_food_and_shelter
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(c)(3)(iv)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: For purposes of this paragraph (c)(3)(iv), the phrase “is unable
            to obtain food and shelter” means that the sum of the eligible sponsored
            alien's household's own income, the cash contributions of the sponsor
            and others, and the value of any in-kind assistance the sponsor and others
            provide, does not exceed 130 percent of the poverty income guideline for
            the household's size.
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#indigence_income_limit_rate
          output: indigence_income_limit_rate
          hash: sha256:local
  versions:
  - effective_from: '0001-01-01'
    formula: 'eligible_sponsored_alien_household_own_monthly_income

      + monthly_cash_contributions_from_sponsor_and_others

      + monthly_value_of_in_kind_assistance_from_sponsor_and_others

      <= poverty_income_guideline_for_household_size * indigence_income_limit_rate'
- name: alien_is_indigent
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(c)(3)(iv)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: (iv) An indigent alien that the State agency has determined is
            unable to obtain food and shelter taking into account the alien's own
            income plus any cash, food, housing, or other assistance provided by other
            individuals, including the sponsor(s).
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#indigent_sponsored_alien_unable_to_obtain_food_and_shelter
          output: indigent_sponsored_alien_unable_to_obtain_food_and_shelter
          hash: sha256:local
  versions:
  - effective_from: '0001-01-01'
    formula: 'indigence_determination_has_been_made

      and indigent_sponsored_alien_unable_to_obtain_food_and_shelter'
- name: american_indian_blood_fraction_threshold
  kind: parameter
  dtype: Rate
  source: 7 CFR 273.4(a)(3)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: possesses at least 50 per centum of blood of the American Indian
            race
  versions:
  - effective_from: '0001-01-01'
    formula: '0.5'
- name: sponsored_alien_monthly_deemed_income
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: USD
  source: 7 CFR 273.4(c)(2)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: 'The monthly income of the sponsor and sponsor''s spouse (if he
            or she has executed USCIS Form I-864 or I-864A) deemed as that of the
            eligible sponsored alien must be the total monthly earned and unearned
            income, as defined in § 273.9(b) with the exclusions provided in § 273.9(c)
            of the sponsor and sponsor''s spouse at the time the household containing
            the sponsored alien member applies or is recertified for participation,
            reduced by:'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: A 20 percent earned income amount for that portion of the income
            determined as earned income of the sponsor and the sponsor's spouse
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: An amount equal to the Program's monthly gross income eligibility
            limit for a household equal in size to the sponsor, the sponsor's spouse,
            and any other person who is claimed or could be claimed by the sponsor
            or the sponsor's spouse as a dependent for Federal income tax purposes.
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#sponsor_earned_income_reduction_rate
          output: sponsor_earned_income_reduction_rate
          hash: sha256:local
  versions:
  - effective_from: '0001-01-01'
    formula: "sponsor_monthly_earned_income\n+ sponsor_monthly_unearned_income\n+\
      \ (if sponsor_spouse_executed_uscis_form_i_864_or_i_864a:\n    sponsor_spouse_monthly_earned_income\n\
      \    + sponsor_spouse_monthly_unearned_income\n  else: 0)\n- (\n    (\n    \
      \  sponsor_monthly_earned_income\n      + (if sponsor_spouse_executed_uscis_form_i_864_or_i_864a:\n\
      \          sponsor_spouse_monthly_earned_income\n        else: 0)\n    )\n \
      \   * sponsor_earned_income_reduction_rate\n  )\n- sponsor_household_monthly_gross_income_eligibility_limit"
- name: sponsor_earned_income_reduction_rate
  kind: parameter
  dtype: Rate
  source: 7 CFR 273.4(c)(2)(i)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: A 20 percent earned income amount
  versions:
  - effective_from: '0001-01-01'
    formula: '0.2'
- name: sponsor_earned_income_reduction
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: USD
  source: 7 CFR 273.4(c)(2)(i)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: A 20 percent earned income amount for that portion of the income
            determined as earned income
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/7-cfr/273/4#sponsor_earned_income_reduction_rate
          output: sponsor_earned_income_reduction_rate
          hash: sha256:local
  versions:
  - effective_from: '0001-01-01'
    formula: sponsor_monthly_earned_income * sponsor_earned_income_reduction_rate
- name: eligibility_based_on_earlier_less_rigorous_alien_status_preserved
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(a)(6)(iv)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: Subsequent adjustment to a more limited status does not override
            eligibility based on an earlier less rigorous status.
  versions:
  - effective_from: '0001-01-01'
    formula: 'member_has_eligibility_based_on_earlier_less_rigorous_alien_status

      and member_subsequently_adjusted_to_more_limited_alien_status'
- name: snap_member_citizenship_or_alien_status_eligible
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: No person is eligible to participate in the Program unless that
            person is
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: must be in a qualified status for 5 years before being eligible
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: Subsequent adjustment to a more limited status does not override
            eligibility based on an earlier less rigorous status.
  versions:
  - effective_from: '0001-01-01'
    formula: "not alien_status_documentation_missing_or_unwilling\nand (\n  member_is_us_citizen\n\
      \  or member_is_us_noncitizen_national\n  or member_is_american_indian_born_in_canada_or_recognized_indian_tribe_member\n\
      \  or member_is_hmong_or_highland_laotian_qualifying_person_or_family_member\n\
      \  or member_is_trafficking_victim_or_qualifying_family_member\n  or eligibility_based_on_earlier_less_rigorous_alien_status_preserved\n\
      \  or (\n    member_is_qualified_alien\n    and (\n      member_is_qualified_alien_with_forty_qualifying_quarters\n\
      \      or member_is_refugee\n      or member_is_asylee\n      or member_has_deportation_or_removal_withheld\n\
      \      or member_is_cuban_or_haitian_entrant\n      or member_is_amerasian_immigrant\n\
      \      or member_has_eligible_military_connection\n      or member_receives_blindness_or_disability_benefits\n\
      \      or member_was_lawfully_residing_on_1996_08_22_and_born_on_or_before_1931_08_22\n\
      \      or member_is_under_age_eighteen\n      or (\n        member_is_qualified_alien_subject_to_five_year_wait\n\
      \        and qualified_alien_five_year_status_period_met\n      )\n    )\n \
      \ )\n)"
