format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/4
    source_sha256: 846140bd0e210be0f69a81dc1006c3914c81b0dd7faebedcdd978be7526601b3
  summary: 'No person is eligible to participate in the Program unless that person
    meets

    a listed citizenship or alien-status category. State agencies must classify

    persons lacking required alien-status documentation as ineligible. For an

    eligible sponsored alien, sponsor income and resources are generally deemed

    available, subject to the stated exemptions, reductions, allocations,

    verification duties, and indigence rules.'
  deferred_outputs:
  - output: us:regulations/7-cfr/273/4/a/1#citizen_status_determination
    reason: 7 CFR 273.4(a)(1) requires a United States citizenship determination;
      the source-stated citizenship evidence and adjudication record are not represented
      beyond the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/2#noncitizen_national_status_determination
    reason: 7 CFR 273.4(a)(2) requires a United States non-citizen-national determination;
      the source-stated nationality evidence and adjudication record are not represented
      beyond the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/3#american_indian_status_determination
    reason: 7 CFR 273.4(a)(3) requires either the 7 CFR 273.4(a)(3)(i) Canadian-birth,
      blood-quantum, and INA section 289 determination or the 7 CFR 273.4(a)(3)(ii)
      recognized-tribe-membership determination; those distinct adjudicative facts
      are not represented by the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/3/i#american_indian_born_in_canada_status_determination
    reason: 7 CFR 273.4(a)(3)(i) requires Canadian birth, at least 50 per centum American-Indian
      blood, and INA section 289 applicability; the required distinct adjudicative
      facts are not represented by the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/3/ii#recognized_indian_tribe_member_status_determination
    reason: 7 CFR 273.4(a)(3)(ii) requires membership in an Indian tribe recognized
      as eligible for United States special programs and services because of Indian
      status; the required tribal-recognition determination is not represented by
      the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/4#hmong_or_highland_laotian_status_determination
    reason: 7 CFR 273.4(a)(4) requires the 7 CFR 273.4(a)(4)(i) tribal-service determination
      or the relationship and child determinations in clauses (ii) and (iii); those
      distinct adjudicative facts are not represented by the preserved aggregate status
      input.
  - output: us:regulations/7-cfr/273/4/a/4/i#qualifying_hmong_or_highland_laotian_tribal_member_determination
    reason: 7 CFR 273.4(a)(4)(i) requires lawful United States residence, Hmong-or-Highland-Laotian
      tribal membership, and Vietnam-era assistance in a military or rescue operation;
      the required distinct residence, tribal, service, and historical-operation facts
      are not represented by the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/4/ii#qualifying_hmong_or_highland_laotian_spouse_or_surviving_spouse_determination
    reason: 7 CFR 273.4(a)(4)(ii) requires determining whether the individual is the
      spouse or surviving spouse of a deceased Hmong or Highland Laotian described
      in 7 CFR 273.4(a)(4)(i); the required relationship, death, lawful-residence,
      tribal-membership, and Vietnam-era assistance facts are not represented by the
      preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/4/iii#qualifying_hmong_or_highland_laotian_child_determination
    reason: 7 CFR 273.4(a)(4)(iii) requires determining whether the individual is
      a legally adopted or biological unmarried dependent child under age 18, a full-time
      student under age 22, a child dependent upon a deceased qualifying person at
      death, or an unmarried disabled adult child who was disabled and dependent before
      the child's 18th birthday; the required relationship, dependency, death, student,
      disability, and event-timing facts are not represented by the preserved aggregate
      status input.
  - output: us:regulations/7-cfr/273/4/a/5#trafficking_status_determination
    reason: 7 CFR 273.4(a)(5) requires severe-trafficking-victim status, HHS certification
      where applicable, victim age, specified family relationships, and derivative-T-visa
      determinations; those distinct adjudicative facts are not represented by the
      preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/5/i#certified_severe_trafficking_victim_determination
    reason: 7 CFR 273.4(a)(5)(i) requires determining whether an alien was subjected
      to a severe form of trafficking in persons and was certified by the Department
      of Health and Human Services; the separate trafficking and certification facts
      are not represented by the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/5/ii#minor_severe_trafficking_victim_determination
    reason: 7 CFR 273.4(a)(5)(ii) requires determining whether an alien under age
      18 was subjected to a severe form of trafficking in persons; the separate trafficking
      and age facts are not represented by the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/5/iii#derivative_t_visa_family_member_of_victim_under_twenty_one_determination
    reason: 7 CFR 273.4(a)(5)(iii) requires a spouse, child, parent, or unmarried
      minor sibling relationship to a trafficking victim under age 21 and receipt
      of a derivative T visa; the required relationship, victim-age, and visa facts
      are not represented by the preserved aggregate status input.
  - output: us:regulations/7-cfr/273/4/a/5/iv#derivative_t_visa_spouse_or_child_of_older_victim_determination
    reason: 7 CFR 273.4(a)(5)(iv) requires a spouse-or-child relationship to a trafficking
      victim age 21 or older and receipt of a derivative T visa; the required relationship,
      victim-age, and visa facts are not represented by the preserved aggregate status
      input.
  - output: us:regulations/7-cfr/273/4/b#state_agency_illegal_alien_reporting_and_documentation_administration
    reason: 7 CFR 273.4(b)(1)-(2) requires StateAgency certification or recertification
      event processing, local USCIS routing, notification timing, and administrative
      documentation workflow not represented by this Person-status artifact.
  - output: us:regulations/7-cfr/273/4/c#sponsored_alien_income_resource_deeming_and_administration
    reason: 7 CFR 273.4(c)(1)-(6) requires sponsor-to-alien and sponsor-spouse relations,
      household membership, affidavit, income and resource allocation, notices and
      consent, verification, recertification, reported-change, and restitution workflow
      relations not represented by this Person-status artifact.
