          excerpt: upon the taxable income of every corporation
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-dc/statute/47/47-1807.02
          excerpt: separate from and in addition to, the surtax imposed by paragraph
            (3A)
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-dc/statute/47/47-1807.02
          excerpt: If District gross receipts are greater than $1 million, the minimum
            tax payable shall be $1,000.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-dc/statute/47/47-1807.02
          excerpt: shall not be exempt from the minimum tax payable under this section
  versions:
  - effective_from: '1975-01-01'
    formula: "if corporation_exempt_under_subchapter_ii: 0 else:\n  max(\n    corporation_tax_rate\
      \ * taxable_income * (1 + first_surtax_rate + second_surtax_rate),\n    if district_gross_receipts\
      \ > district_gross_receipts_threshold:\n      high_receipts_minimum_corporation_tax\n\
      \    else: minimum_corporation_tax\n  )"
