format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-dc/statute/47/47-1807.02
    source_sha256: 50bedd5792c29e7c43c32151a09508c781ca1aa73819d56ecbe646813f150e14
  summary: “Except as exempted under subchapter II of this chapter,” a tax is levied
    on the taxable income of every corporation. Paragraphs (3A) and (3B) impose separate
    surtaxes. “The minimum tax payable under this section shall be $250”; it is $1,000
    if District gross receipts exceed $1 million. Subsection (c) subjects taxes during
    the stated three tax years to § 47-2507 transition rules.
  deferred_outputs:
  - output: us-dc:statutes/47/47-1807/02/a/6#corporation_tax_under_paragraph_6
    reason: us-dc/statute/47/47-1807.02(a)(6) requires the applicable funded rate
      to be determined in accordance with § 47-181; that cited rate determination
      is not supplied in the available context.
    source_values:
    - us-dc:statutes/47/47-1807/02#paragraph_6_rate_9_percent
    - us-dc:statutes/47/47-1807/02#paragraph_6_rate_8_75_percent
    - us-dc:statutes/47/47-1807/02#paragraph_6_rate_8_5_percent
    - us-dc:statutes/47/47-1807/02#paragraph_6_rate_8_25_percent
  - output: us-dc:statutes/47/47-1807/02/c#transition_adjusted_corporation_tax
    reason: us-dc/statute/47/47-1807.02(c) requires the transition rules provided
      in § 47-2507; that section's transition computation is not supplied in the available
      context.
  - output: us-dc:statutes/47/47-1807/02#corporation_tax_under_paragraph_6
    reason: D.C. Official Code § 47-1807.02(a)(6) makes the rate subject to availability
      of funding and requires application in accordance with § 47-181; the exact funding
      availability and the rate determined in accordance with § 47-181 are not supplied
      in the available context.
    source_values:
    - us-dc:statutes/47/47-1807/02#corporation_tax_rate_under_paragraph_6
