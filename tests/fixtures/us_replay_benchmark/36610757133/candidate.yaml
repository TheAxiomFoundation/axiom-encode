- name: corporation_tax
  kind: derived
  entity: Corporation
  dtype: Money
  unit: USD
  period: Year
  source: D.C. Official Code § 47-1807.02(a), (b)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-dc/statute/47/47-1807.02
          excerpt: Except as exempted under subchapter II of this chapter
      - path: versions[0].formula
        kind: formula
        source:
