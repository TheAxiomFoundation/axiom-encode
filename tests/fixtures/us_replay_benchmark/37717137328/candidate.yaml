- name: snap_household_has_elderly_or_disabled_member
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: 7 USC 2012(j)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/statute/7/2012/j
          excerpt: “Elderly or disabled member” means a member of a household who—
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2012/j
  versions:
  - effective_from: '2008-10-01'
    formula: count_where(member_of_household, member_meets_elderly_or_disabled_definition)
      > 0
