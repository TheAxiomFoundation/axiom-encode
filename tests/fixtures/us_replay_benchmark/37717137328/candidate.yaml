format: rulespec/v1
module:
  summary: '“Elderly or disabled member” means a member of a household who satisfies

    one of the conditions in paragraphs (1) through (7).'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/7/2012/j
    source_sha256: 61cef01bea2c1fb5152b7c979640b953ed8f5577a7f946fdeae118124c0b20ee
rules:
- name: elderly_or_disabled_member_under_paragraph_2_A
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 USC 2012(j)(2)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2012/j
          excerpt: receives supplemental security income benefits under title XVI
  versions:
  - effective_from: '2008-10-01'
    formula: 'receives_title_xvi_supplemental_security_income

      or receives_public_law_93_66_type_supplemental_benefits'
- name: elderly_or_disabled_member_under_paragraph_2_B
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 USC 2012(j)(2)(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2012/j
          excerpt: if the Secretary determines that such benefits are conditioned
            on meeting disability or blindness criteria
  versions:
  - effective_from: '2008-10-01'
    formula: "benefits_conditioned_on_disability_or_blindness_criteria_at_least_as_stringent_as_title_xvi\n\
      and (\n  receives_social_security_act_section_1616_a_type_supplemental_assistance\n\
      \  or receives_interim_assistance_pending_supplemental_security_income\n  or\
      \ receives_title_xix_disability_related_medical_assistance\n  or receives_disability_based_state_general_assistance\n\
      )"
- name: elderly_or_disabled_member_under_paragraph_2
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 USC 2012(j)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2012/j
          excerpt: (2) (A) receives supplemental security income benefits
  versions:
  - effective_from: '2008-10-01'
    formula: 'elderly_or_disabled_member_under_paragraph_2_A

      or elderly_or_disabled_member_under_paragraph_2_B'
- name: elderly_or_disabled_member_under_paragraph_5_B
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 USC 2012(j)(5)(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2012/j
          excerpt: is entitled to compensation for a service-connected death or pension
            benefits for a non-service-connected death under title 38
  versions:
  - effective_from: '2008-10-01'
    formula: "is_surviving_spouse_of_veteran\nand survivor_has_permanent_disability_under_social_security_act_section_221_i\n\
      and (\n  survivor_receives_title_38_service_connected_death_compensation\n \
      \ or survivor_receives_title_38_non_service_connected_death_pension\n)"
- name: member_of_household
  kind: data_relation
