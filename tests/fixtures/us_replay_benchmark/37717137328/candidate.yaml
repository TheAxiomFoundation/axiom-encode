            disability which is rated as total under title 38; or (B) is considered
            in need of regular aid and attendance or permanently housebound under
            such title;
  versions:
  - effective_from: '2008-10-01'
    formula: "is_veteran\nand (\n  veteran_needs_regular_aid_and_attendance_under_title_38\n\
      \  or veteran_is_permanently_housebound_under_title_38\n)"
