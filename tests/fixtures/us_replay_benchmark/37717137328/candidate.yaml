      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/statute/7/2012/j
          excerpt: “Elderly or disabled member” means a member of a household who—
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/7/2012/j
          excerpt: (1) is sixty years of age or older;
  versions:
  - effective_from: '2008-10-01'
    formula: "member_age >= elderly_or_disabled_member_age_threshold\nor receives_title_xvi_supplemental_security_income\n\
      or receives_public_law_93_66_type_supplemental_benefits\nor (\n  benefits_conditioned_on_disability_or_blindness_criteria_at_least_as_stringent_as_title_xvi\n\
      \  and (\n    receives_social_security_act_section_1616_a_type_supplemental_assistance\n\
      \    or receives_interim_assistance_pending_supplemental_security_income\n \
      \   or receives_title_xix_disability_related_medical_assistance\n    or receives_disability_based_state_general_assistance\n\
      \  )\n)\nor receives_disability_or_blindness_payments_under_social_security_act_title_i_ii_x_xiv_or_xvi\n\
      or receives_governmental_disability_retirement_benefits_for_permanent_disability\n\
      or (\n  is_veteran\n  and (\n    veteran_has_total_disability_rating_under_title_38\n\
      \    or veteran_needs_regular_aid_and_attendance_under_title_38\n    or veteran_is_permanently_housebound_under_title_38\n\
      \  )\n)\nor (\n  is_surviving_spouse_of_veteran\n  and (\n    survivor_needs_regular_aid_and_attendance_under_title_38\n\
      \    or survivor_is_permanently_housebound_under_title_38\n    or (\n      survivor_has_permanent_disability_under_social_security_act_section_221_i\n\
      \      and (\n        survivor_receives_title_38_service_connected_death_compensation\n\
      \        or survivor_receives_title_38_non_service_connected_death_pension\n\
      \      )\n    )\n  )\n)\nor (\n  is_child_of_veteran\n  and (\n    child_is_permanently_incapable_of_self_support_under_title_38_section_1314\n\
      \    or (\n      child_has_permanent_disability_under_social_security_act_section_221_i\n\
      \      and (\n        child_receives_title_38_service_connected_death_compensation\n\
      \        or child_receives_title_38_non_service_connected_death_pension\n  \
      \    )\n    )\n  )\n)\nor (\n  receives_railroad_retirement_act_section_2_a_1_iv_or_v_annuity\n\
      \  and railroad_service_after_1936_would_be_social_security_act_employment\n\
      \  and filed_application_for_disability_benefits\n)"
