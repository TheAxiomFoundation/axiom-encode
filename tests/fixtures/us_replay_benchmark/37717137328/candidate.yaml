    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/7/2012/j
          excerpt: (3) receives disability or blindness payments under title I, II,
            X, XIV, or XVI of the Social Security Act [ 42 U.S.C. 301 et seq., 401
            et seq., 1201 et seq., 1351 et seq., 1381 et seq.] or receives disability
            retirement benefits from a governmental agency because of a disability
            considered permanent under section 221(i) of the Social Security Act (
            42 U.S.C. 421(i) );
  versions:
