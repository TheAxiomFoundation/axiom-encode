format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-3
    source_sha256: ed5675f21d4c8beda2a0c1b75a358bc8ea488f85f99c32952ad59074690b6e55
  summary: |-
    Any of the following utility expenses are considered heating sources when used to provide heat for the home:
    The cost for any of the following supplemental sources of heating or cooling do not qualify for the SUA:
# Scope: classification of one UtilityExpenseComponent, not complete household
# SUA eligibility or an allowance amount. All facts describe that same component.
# A negative component classification does not deny other household SUA paths.
# 2026-08-01 is the first full Month evidence coverage floor following the
# authenticated snapshot, not a legal commencement date. Earlier coverage
# is unproven.
# Branch inventory: heating chapeau and electricity, gas, propane, coal, wood,
# oil; cooling chapeau and central air conditioners, evaporative coolers,
# room air conditioners; exclusion chapeau and electric blankets, fans,
# heat lamps, evaporative-cooler water, heating/cooling equipment maintenance,
# chimney maintenance, wood-cutting equipment (including chainsaws,
# chainsaw maintenance, and axes). All branches are encoded.
inputs:
  - name: component_is_electricity
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: component_is_gas
    entity: UtilityExpenseComponent
