- name: snap_eligible
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: FAA5 NA Eligibility and Benefit Determination, block 9
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-9
          excerpt: When the NA budgetary unit is eligible, AZTECS performs the allotment
            test.
  versions:
  - effective_from: '2025-10-01'
    formula: na_budgetary_unit_is_eligible
- name: initial_month_eligible_no_pay
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: FAA5 NA Eligibility and Benefit Determination, block 9
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-9
          excerpt: The budgetary unit is in an eligible no pay status when the benefit
            is less than $10.
      - path: versions[0].formula
        kind: import
        import:
          target: us-az:policies/des/faa5/na-eligibility-and-benefit-determination/benefit-amount#initial_month_no_pay_threshold
          output: initial_month_no_pay_threshold
          hash: sha256:10ced7e709c05e5d06c4053e602d95fb8ba147ed161f245eeab5729e60b4dd91
  versions:
  - effective_from: '2025-10-01'
    formula: 'na_budgetary_unit_is_eligible

      and initial_month_proration_applies

      and prorated_initial_month_na_benefit < minimum_na_allotment

      and prorated_initial_month_na_benefit < initial_month_no_pay_threshold'
- name: initial_month_actual_benefit_paid
  kind: derived
  entity: Household
  dtype: Money
  period: Month
  unit: USD
  source: FAA5 NA Eligibility and Benefit Determination, block 9
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-9
          excerpt: The actual benefit must be paid when the benefit is $10 or more.
      - path: versions[0].formula
        kind: import
        import:
          target: us-az:policies/des/faa5/na-eligibility-and-benefit-determination/benefit-amount#initial_month_no_pay_threshold
          output: initial_month_no_pay_threshold
          hash: sha256:10ced7e709c05e5d06c4053e602d95fb8ba147ed161f245eeab5729e60b4dd91
  versions:
  - effective_from: '2025-10-01'
    formula: 'if na_budgetary_unit_is_eligible and initial_month_proration_applies
      and prorated_initial_month_na_benefit < minimum_na_allotment and prorated_initial_month_na_benefit
      >= initial_month_no_pay_threshold: max(0, prorated_initial_month_na_benefit)
      else: 0'
