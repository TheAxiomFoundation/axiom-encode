format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-9
    source_sha256: 8c6be9a385937493796a80db196d04ad53a54eb5437e383d6e6115f5ec46e15e
  summary: 'AZTECS subtracts 30% of NA net income from the Thrifty Food Plan amount.

    Eligible one- or two-participant units below the minimum allotment are

    rounded up; eligible larger units receive the actual benefit. Initial-month

    proration below $10 results in eligible no-pay status.'
  deferred_outputs:
  - output: us-az:policies/des/faa5/na-eligibility-and-benefit-determination/fy-2026-benefit-calculation#allotment_test_benefit
    reason: Generated rule depends on an output that validation deferred because it
      flattened thresholded, capped, base-limited, or cross-referenced mechanics,
      or borrowed an unrelated same-named section term.
  - output: us-az:policies/des/faa5/na-eligibility-and-benefit-determination/fy-2026-benefit-calculation#calculated_benefit_before_recoupment_or_proration
    reason: Generated rule used a thresholded, capped, base-limited, or excess-amount
      imported rate as a flat percentage. This output is deferred until the cited
      mechanics can be composed without flattening the imported rate.
  - output: us-az:policies/des/faa5/na-eligibility-and-benefit-determination/fy-2026-benefit-calculation#na_regular_month_allotment
    reason: Generated rule depends on an output that validation deferred because it
      flattened thresholded, capped, base-limited, or cross-referenced mechanics,
      or borrowed an unrelated same-named section term.
