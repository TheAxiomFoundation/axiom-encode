rules:
- name: provincial_or_territorial_tax_otherwise_payable
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: CRA T2036 2025 note (4), provincial or territorial tax otherwise payable.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: The result from line 81 is your provincial or territorial tax otherwise
            payable.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: The amount from line 58 is your provincial or territorial tax otherwise
            payable.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: adding the amount from line 63 to the amount on line 68 of Form
            AB428
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: adding the amount from line 20 to the amount from line 36 in Part
            4 of Section AB428MJ of Form T2203.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: excluding the provincial and territorial foreign tax credit and
            any British Columbia additional tax for minimum tax purposes
  versions:
  - effective_from: '2025-01-01'
    formula: "if resident_of_ontario_at_year_end:\n  if jurisdictions_tax_paid_count\
      \ > 1:\n    on428mj_line_58_after_entering_zero_on_lines_43_and_45\n  else:\n\
      \    on428_line_81_after_entering_zero_on_lines_70_and_72\nelse:\n  if resident_of_alberta_at_year_end:\n\
      \    if alberta_applicable_form_is_428mj:\n      alberta_428mj_line_20 + alberta_428mj_line_36\n\
      \    else:\n      alberta_tax_line_63 + alberta_tax_line_68\n  else:\n    if\
      \ resident_of_british_columbia_at_year_end:\n      british_columbia_tax_excluding_foreign_tax_credit_and_additional_minimum_tax\n\
      \    else:\n      form_428_tax_before_provincial_or_territorial_foreign_tax_credit"
- name: separate_country_forms_required
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: CRA T2036 2025 instructions concerning more than one foreign country.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: If you paid tax to more than one foreign country, and the total
            of the non-business income taxes that you paid to all foreign countries
            was more than $200
  versions:
  - effective_from: '2025-01-01'
    formula: "foreign_countries_taxed_count > 1\nand total_non_business_income_taxes_paid_to_all_foreign_countries\n\
      \    > total_non_business_income_taxes_paid_to_all_foreign_countries_ceiling"
- name: provincial_territorial_2025_t2036_federal_credit_line_2
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: CRA T2036 2025 line 2 and note (1).
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Enter the amount from line 3 of Form T2209, unless you have to
            pay minimum tax.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: If you were a resident of British Columbia at the end of the year,
            enter the amount from line 3 of Form T2209 on line 2.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: If the total non-business income taxes you paid to all foreign
            countries is $200 or less
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: If the total non-business income taxes you paid to all foreign
            countries is more than $200
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: enter the part of special foreign tax credit
  versions:
  - effective_from: '2025-01-01'
    formula: "if not minimum_tax_is_payable or resident_of_british_columbia_at_year_end:\n\
      \  t2209_federal_non_business_foreign_tax_credit_line_3\nelse:\n  if resident_of_ontario_at_year_end:\n\
      \    if total_non_business_income_taxes_paid_to_all_foreign_countries\n    \
      \    <= total_non_business_income_taxes_paid_to_all_foreign_countries_ceiling:\n\
      \      ontario_minimum_tax_single_country_special_credit\n    else:\n      ontario_minimum_tax_country_special_credit\n\
      \  else:\n    special_foreign_tax_credit_related_to_non_business_income"
