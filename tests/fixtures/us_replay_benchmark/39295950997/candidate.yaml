module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
    source_sha256: 7637ab494fc385b938e9e3ce4d5f3b1af8bc331ad644fe3cedefaee8434028ee
  summary: 'CRA Form T2036 2025 calculates a provincial or territorial foreign

    non-business income tax credit. It does not apply to Quebec residents;

    Manitoba residents who must pay minimum tax cannot claim the credit.

    Line 5 is the lesser of lines 3 and 4 and must not exceed provincial

    or territorial tax otherwise payable.'
