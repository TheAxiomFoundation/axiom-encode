format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ok/statute/68-2906
    source_sha256: f52351ec888d2a131c77819abf5917d005a17b9bbc6123f22d62c8a9881633c2
  summary: “Any person sixty-five (65) years of age or older or any totally disabled
    person” who is head of household, a resident of and domiciled in this state during
    the entire preceding calendar year, and whose preceding-year gross household income
    does not exceed $12,000 may file a property tax relief claim. “Each head of household
    shall be allowed to file only one claim per year.”
