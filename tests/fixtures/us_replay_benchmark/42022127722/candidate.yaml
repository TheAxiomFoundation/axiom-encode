    formula: 'if birth_year < birth_year_1939: 0 else:

      if birth_year == birth_year_1939 and birth_month <= birth_month_ceiling: 0 else:

      if birth_year == birth_year_1939: 1 else:

      if birth_year == birth_year_1940 and birth_month <= month_april: 2 else:

      if birth_year == birth_year_1940: 3 else:

      if birth_year == birth_year_1941 and birth_month <= month_august: 4 else:

      if birth_year == birth_year_1941: 5 else:

      if birth_year == birth_year_1942 and birth_month <= month_april: 5 else:

      if birth_year <= birth_year_1944: 6 else:

      if birth_year == birth_year_1945 and birth_month <= month_august: 7 else:

      if birth_year == birth_year_1945: 8 else:

      if birth_year == birth_year_1946 and birth_month <= month_april: 8 else:

      if birth_year == birth_year_1946: 9 else:

      if birth_year == birth_year_1947 and birth_month <= month_august: 10 else:

      if birth_year == birth_year_1947: 11 else:

      if birth_year == birth_year_1948 and birth_month <= month_april: 11 else:

      if birth_year == birth_year_1948: 12 else:

      if birth_year == birth_year_1949 and birth_month <= month_august: 13 else:

      if birth_year == birth_year_1949: 14 else:

      if birth_year == birth_year_1950 and birth_month <= month_april: 14 else: 15'
