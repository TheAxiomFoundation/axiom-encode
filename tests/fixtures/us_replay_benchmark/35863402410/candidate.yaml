format: rulespec/v1
imports: null
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/irs/notice-2025-67/page-4
    source_sha256: a6f556f7c314ad5fa09e243656441b641471d825fcd12a7a2abecfe3f91d7a5f
  summary: 'For tax year 2026, page 4 states the section 25B limits for heads of

    household and all other taxpayers; increases the section 219 deductible

    contribution limit from $7,000 to $7,500 and the age-50 additional amount

    from $1,000 to $1,100; and states the section 219 applicable amounts and

    traditional-IRA deduction phase-out ranges.'
  deferred_outputs:
  - output: us:policies/irs/notice-2025-67/page-4#active_participant_single_or_head_of_household_ira_deduction_phaseout_applies
    reason: 'IRS Notice 2025-67 page 4, the branch for single individuals and heads

      of household who are active participants with adjusted gross income

      between $81,000 and $91,000, cannot be computed until source-backed

      shared US filing-status classifications for single and head-of-household

      returns are supplied.'
    source_values:
    - us:policies/irs/notice-2025-67/page-4#other_active_participant_agi_limit
    - us:policies/irs/notice-2025-67/page-4#active_participant_single_or_head_of_household_phaseout_upper_limit
    - us:policies/irs/notice-2025-67/page-4#age_50_additional_ira_contribution_deduction_limit
    - us:policies/irs/notice-2025-67/page-4#ira_contribution_deduction_limit
  - output: us:policies/irs/notice-2025-67/page-4#joint_active_participant_ira_deduction_phaseout_applies
    reason: 'IRS Notice 2025-67 page 4, the branch for married couples filing jointly

      when the contributing spouse is an active participant and income is

      between $129,000 and $149,000, cannot be computed until a source-backed

      shared US filing-status classification for a joint return is supplied.'
    source_values:
    - us:policies/irs/notice-2025-67/page-4#joint_or_qualifying_widow_active_participant_agi_limit
    - us:policies/irs/notice-2025-67/page-4#joint_active_participant_phaseout_upper_limit
    - us:policies/irs/notice-2025-67/page-4#age_50_additional_ira_contribution_deduction_limit
    - us:policies/irs/notice-2025-67/page-4#ira_contribution_deduction_limit
  - output: us:policies/irs/notice-2025-67/page-4#inactive_contributor_active_spouse_ira_deduction_phaseout_applies
    reason: 'IRS Notice 2025-67 page 4, the branch for an IRA contributor who is not

      an active participant and is married to an active participant, with

      couple income between $242,000 and $252,000, cannot be computed until

      the source-backed shared US filing-status classification for the

      contributor''s married return is supplied.'
    source_values:
    - us:policies/irs/notice-2025-67/page-4#inactive_contributor_active_spouse_agi_limit
    - us:policies/irs/notice-2025-67/page-4#inactive_contributor_active_spouse_phaseout_upper_limit
    - us:policies/irs/notice-2025-67/page-4#age_50_additional_ira_contribution_deduction_limit
    - us:policies/irs/notice-2025-67/page-4#ira_contribution_deduction_limit
  - output: us:policies/irs/notice-2025-67/page-4#separate_active_participant_ira_deduction_phaseout_applies
    reason: 'IRS Notice 2025-67 page 4, the branch for a married individual filing
      a

      separate return who is an active participant, with a phase-out range of

      $0 to $10,000, cannot be computed until a source-backed shared US

      filing-status classification for a married-separate return is supplied.'
    source_values:
    - us:policies/irs/notice-2025-67/page-4#separate_active_participant_phaseout_lower_limit
    - us:policies/irs/notice-2025-67/page-4#separate_active_participant_phaseout_upper_limit
    - us:policies/irs/notice-2025-67/page-4#age_50_additional_ira_contribution_deduction_limit
    - us:policies/irs/notice-2025-67/page-4#ira_contribution_deduction_limit
  - output: us:policies/irs/notice-2025-67/page-4#married_taxpayer_roth_ira_contribution_agi_limit
    reason: 'IRS Notice 2025-67 page 4, the section 408A(c)(3)(B)(ii)(I) branch

      ending “for married taxpayers filing a” cannot be computed because this

      source unit omits the completed filing category and the adjusted-gross-

      income limitation stated on the following page.'
    source_values:
    - us:policies/irs/notice-2025-67/page-4#age_50_additional_ira_contribution_deduction_limit
    - us:policies/irs/notice-2025-67/page-4#ira_contribution_deduction_limit
  - output: us:policies/irs/notice-2025-67/page-4#deductible_qualified_retirement_contributions
    reason: Generated rule ignored a source-stated substitution, modification, or
      limitation parameter. This output is deferred until the upstream cross-referenced
      mechanics can be imported or composed without stranding the modifier.
