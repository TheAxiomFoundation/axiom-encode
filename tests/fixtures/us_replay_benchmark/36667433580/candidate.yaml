format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-wa/manual/dshs/eaz/esa-applications-assistance-expedited-service-basic-food/block-5
    source_sha256: 57cedd89b8f52cfe56c2a993f0c944b84010b55b74102d6847e5271d7f837557
  summary: '“gross monthly income” as income before taxes less excluded income.

    “We must consider countable liquid resources ... even if the client is categorically
    eligible.”

    “Households entitled to expedited services must be interviewed and receive benefits
    within seven calendar days of filing an application.”

    “When the expedited approval process and regular verification rules are in conflict,
    the expedited approval process supersedes regular verification rules.”'
  deferred_outputs:
  - output: us-wa:policies/dshs/eaz/esa-applications-assistance-expedited-service-basic-food/block-5#expedited_criteria_under_wac_388_406_0015
    reason: The source directs screening against WAC 388-406-0015(2), but does not
      state that provision's expedited-service criteria.
  - output: us-wa:policies/dshs/eaz/esa-applications-assistance-expedited-service-basic-food/block-5#destitute_farm_worker_determination
    reason: The “Destitute migrant or seasonal farm workers” branch directs the determination
      to WAC 388-406-0021 and income budgeting to WAC 388-450-0230; neither determination
      is supplied here.
  - output: us-wa:policies/dshs/eaz/esa-applications-assistance-expedited-service-basic-food/block-5#postponed_verification_reconsideration_date
    reason: The “Postponed Verification” branch directs the reconsideration date for
      verification received after the deadline but before the 60th day to WAC 388-406-0055(4)(c);
      that date computation is not supplied here.
