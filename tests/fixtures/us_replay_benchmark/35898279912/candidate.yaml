- name: snap_allotment_before_minimum
  kind: derived
  entity: Household
  dtype: Money
  period: Month
  unit: USD
  source: 7 USC 2017(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2017/a
          excerpt: equal to the cost to such households of the thrifty food plan reduced
            by an amount equal to 30 per centum of the household’s income, as determined
            in accordance with section 2014(d) and (e) of this title, rounded to the
            nearest lower whole dollar
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/usda/snap/fy-2026-cola/maximum-allotments#snap_maximum_allotment
          output: snap_maximum_allotment
          hash: sha256:7361c2b8a7ac6a8e7483327c0fa2b39892939530f1c92703c43e3e5fad9e6940
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/7/2017/a#snap_household_food_contribution
          output: snap_household_food_contribution
          hash: sha256:local
  versions:
  - effective_from: '2008-10-01'
    formula: floor(max(0, snap_maximum_allotment - snap_household_food_contribution))
- name: snap_minimum_monthly_allotment
  kind: derived
  entity: Household
  dtype: Money
  period: Month
  unit: USD
  source: 7 USC 2017(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2017/a
          excerpt: for households of one and two persons the minimum allotment shall
            be 8 percent of the cost of the thrifty food plan for a household containing
            1 member, as determined by the Secretary under section 2012 of this title
            , rounded to the nearest whole dollar increment
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/usda/snap/fy-2026-cola/maximum-allotments#snap_one_person_thrifty_food_plan_cost
          output: snap_one_person_thrifty_food_plan_cost
          hash: sha256:7361c2b8a7ac6a8e7483327c0fa2b39892939530f1c92703c43e3e5fad9e6940
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/7/2017/a#snap_minimum_allotment_rate
          output: snap_minimum_allotment_rate
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/7/2017/a#snap_minimum_allotment_household_size_limit
          output: snap_minimum_allotment_household_size_limit
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/7/2017/a#snap_minimum_allotment_dollar_increment
          output: snap_minimum_allotment_dollar_increment
          hash: sha256:local
  versions:
  - effective_from: '2008-10-01'
    formula: "if household_size <= snap_minimum_allotment_household_size_limit:\n\
      \  floor(\n    ((snap_one_person_thrifty_food_plan_cost * snap_minimum_allotment_rate)\n\
      \    / snap_minimum_allotment_dollar_increment) + 0.5\n  ) * snap_minimum_allotment_dollar_increment\n\
      else: 0"
- name: snap_regular_month_allotment
  kind: derived
  entity: Household
  dtype: Money
  period: Month
  unit: USD
  source: 7 USC 2017(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2017/a
          excerpt: allotment which State agencies shall be authorized to issue to
            any households certified as eligible to participate
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/7/2017/a#snap_allotment_before_minimum
          output: snap_allotment_before_minimum
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/7/2017/a#snap_minimum_monthly_allotment
          output: snap_minimum_monthly_allotment
          hash: sha256:local
  versions:
  - effective_from: '2008-10-01'
    formula: "if snap_eligible:\n  max(snap_allotment_before_minimum, snap_minimum_monthly_allotment)\n\
      else: 0"
