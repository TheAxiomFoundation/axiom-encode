  kind: derived
  entity: Household
  dtype: Money
  period: Month
  unit: USD
  source: 7 USC 2017(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2017/a
