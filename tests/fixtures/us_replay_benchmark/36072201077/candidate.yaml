module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-18
    source_sha256: d1c89e5b0c0c35d49d16a245a15f126c267fcd8903610e64f4cc65343a31e18f
  summary: 'Page 18 states that, when an employer provides fuel or reimburses fuel

    expenses, up to $14 per hour is deemed substantiated if paid in accordance

    with Rev. Proc. 2002-41. Section .14 publishes the standard-deduction,

    dependent-limit, and aged-or-blind amounts for taxable years beginning in

    2026. The page ends during the opening sentence of section .15 concerning

    the section 125(i) cafeteria-plan limitation.'
  deferred_outputs:
  - output: us:policies/irs/rev-proc-2025-32/page-18#cafeteria_plan_voluntary_employee_salary_reduction_limitation
    reason: Rev. Proc. 2025-32 section .15 on page 18 ends after “the dollar limitation
      under § 125(i) on voluntary employee salary reductions for contributions to
      health flexible” and omits the source-stated limitation amount and the remainder
      of the operative sentence needed to compute the cafeteria-plan limitation.
  - output: us:policies/irs/rev-proc-2025-32/page-18#fuel_substantiation_amount_per_hour
    reason: Rev. Proc. 2025-32 section .13 states that an amount up to $14 per hour
      is deemed substantiated when paid in accordance with Rev. Proc. 2002-41, but
      RuleSpec supports no hourly cadence or money-per-hour dtype for the stated hourly
      computation.
    source_values:
    - us:policies/irs/rev-proc-2025-32/standard-deduction#fuel_substantiation_hourly_limit
  - output: us:policies/irs/rev-proc-2025-32/standard-deduction#additional_standard_deduction_for_aged_or_blind
    reason: Generated rule depends on an output that validation deferred because it
      flattened thresholded, capped, base-limited, or cross-referenced mechanics,
      or borrowed an unrelated same-named section term.
  - output: us:policies/irs/rev-proc-2025-32/standard-deduction#basic_standard_deduction_after_dependent_limit
    reason: Generated rule depends on an output that validation deferred because it
      flattened thresholded, capped, base-limited, or cross-referenced mechanics,
      or borrowed an unrelated same-named section term.
  - output: us:policies/irs/rev-proc-2025-32/standard-deduction#basic_standard_deduction_by_filing_status
    reason: Generated rule treated a filing-status or marital-status legal classification
      as a local fact. This output is deferred until the upstream status source can
      be encoded or imported without inventing local tax-status component inputs.
  - output: us:policies/irs/rev-proc-2025-32/standard-deduction#individual_is_unmarried_and_not_surviving_spouse
    reason: Generated rule treated a filing-status or marital-status legal classification
      as a local fact. This output is deferred until the upstream status source can
      be encoded or imported without inventing local tax-status component inputs.
  - output: us:policies/irs/rev-proc-2025-32/standard-deduction#standard_deduction
    reason: Generated rule depends on an output that validation deferred because it
      flattened thresholded, capped, base-limited, or cross-referenced mechanics,
