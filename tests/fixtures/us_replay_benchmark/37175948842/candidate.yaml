format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/42/416/l
    source_sha256: ee15c76186b3533e280082826ffae74cdb24481ca30ae9e4fa7610410dd723f1
  summary: “Retirement age” depends on the calendar year in which an individual attains
    early retirement age. Paragraph (3) specifies the age-increase factor for the
    2000–2004 and 2017–2021 transition periods.
rules:
- name: retirement_age_year_component
  kind: derived
  entity: Person
  dtype: Integer
  period: Year
  source: 42 USC 416(l)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/416/l/1
          excerpt: 65 years of age
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/416/l/1
          excerpt: 66 years of age
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/416/l/1
          excerpt: 67 years of age
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/416/l
          excerpt: (A) With respect to an individual who attains early retirement
            age in the 5-year period consisting of the calendar years 2000 through
            2004, the age increase factor shall be equal to two-twelfths of the number
            of months in the period beginning with January 2000 and ending with December
            of the year in which the individual attains early retirement age.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/416/l
          excerpt: (B) With respect to an individual who attains early retirement
            age in the 5-year period consisting of the calendar years 2017 through
            2021, the age increase factor shall be equal to two-twelfths of the number
            of months in the period beginning with January 2017 and ending with December
            of the year in which the individual attains early retirement age.
  versions:
  - effective_from: '1983-04-20'
    formula: floor(retirement_age_total_months / months_per_retirement_age_year)
- name: retirement_age_month_component
  kind: derived
  entity: Person
  dtype: Integer
  period: Year
  source: 42 USC 416(l)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/416/l/1
          excerpt: the number of months in the age increase factor
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/42/416/l#months_per_retirement_age_year
          output: months_per_retirement_age_year
          hash: sha256:local
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/416/l
          excerpt: (A) With respect to an individual who attains early retirement
            age in the 5-year period consisting of the calendar years 2000 through
            2004, the age increase factor shall be equal to two-twelfths of the number
            of months in the period beginning with January 2000 and ending with December
            of the year in which the individual attains early retirement age.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/416/l
          excerpt: (B) With respect to an individual who attains early retirement
            age in the 5-year period consisting of the calendar years 2017 through
