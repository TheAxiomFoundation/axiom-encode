            of the year in which the individual attains early retirement age
  versions:
  - effective_from: '1983-04-20'
    formula: "if benefit_early_retirement_age_calendar_year < retirement_age_tier_two_start_year:\n\
      \  retirement_age_tier_one_years * months_per_retirement_age_year\nelse:\n \
      \ if benefit_early_retirement_age_calendar_year <= retirement_age_tier_two_end_year:\n\
      \    retirement_age_tier_one_years * months_per_retirement_age_year + retirement_age_increase_months_per_transition_year\
      \ * min(retirement_age_transition_period_years, benefit_early_retirement_age_calendar_year\
      \ - retirement_age_tier_two_start_year + 1)\n  else:\n    if benefit_early_retirement_age_calendar_year\
      \ < retirement_age_tier_four_start_year:\n      retirement_age_tier_three_years\
      \ * months_per_retirement_age_year\n    else:\n      if benefit_early_retirement_age_calendar_year\
      \ <= retirement_age_tier_four_end_year:\n        retirement_age_tier_three_years\
      \ * months_per_retirement_age_year + retirement_age_increase_months_per_transition_year\
      \ * min(retirement_age_transition_period_years, benefit_early_retirement_age_calendar_year\
      \ - retirement_age_tier_four_start_year + 1)\n      else:\n        retirement_age_tier_five_years\
      \ * months_per_retirement_age_year"
