format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-13
    source_sha256: 5032b89b8b046e596b76b9d9d3d5aee62c926870c9ec9573c8a4210d402ed62e
  summary: 'For taxable years beginning in 2026, section 1(j)(5) publishes maximum

    zero-rate and 15-percent-rate capital-gains amounts by filing status.

    Section 23 sets the special-needs adoption credit and other-adoption

    expense cap at $17,670, with phaseout beginning above $265,080 MAGI and

    complete phaseout at $305,080 or more.'
  deferred_outputs:
  - output: us:policies/irs/rev-proc-2025-32/capital-gains#capital_gains_fifteen_percent_threshold
    reason: Generated rule treated a filing-status or marital-status legal classification
      as a local fact. This output is deferred until the upstream status source can
      be encoded or imported without inventing local tax-status component inputs.
  - output: us:policies/irs/rev-proc-2025-32/capital-gains#capital_gains_zero_rate_threshold
    reason: Generated rule treated a filing-status or marital-status legal classification
      as a local fact. This output is deferred until the upstream status source can
      be encoded or imported without inventing local tax-status component inputs.
