- name: adoption_credit_for_special_needs_child
  kind: derived
  entity: TaxUnit
  dtype: Money
  period: Year
  unit: USD
  source: Rev. Proc. 2025-32 section 4.04(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-13
          excerpt: the credit allowed for an adoption of a child with special needs
            is $17,670
      - path: versions[0].formula
        kind: parameter
        import:
          target: us:policies/irs/rev-proc-2025-32/capital-gains#adoption_credit_special_needs_amount
          output: adoption_credit_special_needs_amount
          hash: sha256:local
  versions:
  - effective_from: '2026-01-01'
    formula: 'if adoption_has_special_needs: adoption_credit_special_needs_amount
      else: 0'
- name: adoption_credit_for_other_adoption
  kind: derived
  entity: TaxUnit
  dtype: Money
  period: Year
  unit: USD
  source: Rev. Proc. 2025-32 section 4.04(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-13
          excerpt: maximum credit allowed for other adoptions is the amount of qualified
            adoption expenses up to $17,670
      - path: versions[0].formula
        kind: parameter
        import:
          target: us:policies/irs/rev-proc-2025-32/capital-gains#adoption_credit_other_adoptions_cap
          output: adoption_credit_other_adoptions_cap
          hash: sha256:local
  versions:
  - effective_from: '2026-01-01'
    formula: min(qualified_adoption_expenses, adoption_credit_other_adoptions_cap)
- name: adoption_credit_phaseout_begins
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: Rev. Proc. 2025-32 section 4.04(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-13
          excerpt: The available adoption credit begins to phase out under § 23(b)(2)(A)
            for taxpayers with modified adjusted gross income in excess of $265,080
            and is completely phased out for taxpayers with modified adjusted gross
            income of $305,080 or more.
      - path: versions[0].formula
        kind: parameter
        import:
          target: us:policies/irs/rev-proc-2025-32/capital-gains#adoption_credit_phaseout_start
          output: adoption_credit_phaseout_start
          hash: sha256:local
  versions:
  - effective_from: '2026-01-01'
    formula: modified_adjusted_gross_income > adoption_credit_phaseout_start
- name: adoption_credit_is_completely_phased_out
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: Rev. Proc. 2025-32 section 4.04(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-13
          excerpt: completely phased out for taxpayers with modified adjusted gross
            income of $305,080 or more
      - path: versions[0].formula
        kind: parameter
        import:
          target: us:policies/irs/rev-proc-2025-32/capital-gains#adoption_credit_complete_phaseout_start
          output: adoption_credit_complete_phaseout_start
          hash: sha256:local
  versions:
  - effective_from: '2026-01-01'
    formula: modified_adjusted_gross_income >= adoption_credit_complete_phaseout_start
