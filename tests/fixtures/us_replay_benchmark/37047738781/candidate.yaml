    formula: '2696'
- name: inflation_reference_cpi
  kind: parameter
  dtype: Decimal
  source: Mo. Rev. Stat. § 143.011(6)(4), reference period beginning September 1,
    2014, and ending August 31, 2015.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us-mo/statute/143.011
          excerpt: CPI for the year beginning September 1, 2014, and ending August
            31, 2015
  versions:
  - effective_from: '2017-01-01'
    formula: cpi_for_reference_period
- name: percent_increase_in_inflation
  kind: derived
  entity: TaxUnit
  dtype: Rate
  period: Year
  source: Mo. Rev. Stat. § 143.011(6)(4).
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-mo/statute/143.011
          excerpt: the percentage, if any, by which the CPI for the preceding calendar
            year exceeds the CPI for the year beginning September 1, 2014, and ending
            August 31, 2015
  versions:
  - effective_from: '2017-01-01'
    formula: max(0, (cpi_for_preceding_calendar_year - inflation_reference_cpi) /
      inflation_reference_cpi)
- name: subsection_4_five_year_revenue_comparison_met
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: Mo. Rev. Stat. § 143.011(4)(2)(a)b.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-mo/statute/143.011
          excerpt: exceeds the amount of net general revenue collected in the fiscal
            year five years prior, adjusted annually by the percentage increase in
            inflation
  versions:
  - effective_from: '2024-01-01'
    formula: previous_fiscal_year_net_general_revenue_collected > five_year_prior_net_general_revenue_adjusted_annually_for_inflation
- name: subsection_4_revenue_conditions_met
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: Mo. Rev. Stat. § 143.011(4)(2)(a)a.–b.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-mo/statute/143.011
          excerpt: A reduction in the rate of tax shall only occur if
  versions:
  - effective_from: '2024-01-01'
    formula: 'net_revenue_threshold_for_subsection_4_reduction_met

      and subsection_4_five_year_revenue_comparison_met'
