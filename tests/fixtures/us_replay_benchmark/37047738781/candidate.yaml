- name: second_bracket_upper_limit
  kind: parameter
  dtype: Money
  unit: USD
  source: Mo. Rev. Stat. § 143.011(1), second income bracket.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
