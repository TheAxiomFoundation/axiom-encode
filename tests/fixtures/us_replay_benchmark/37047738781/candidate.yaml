- name: net_revenue_threshold_for_subsection_3_reduction_met
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: Mo. Rev. Stat. § 143.011(3)(2).
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-mo/statute/143.011
          excerpt: A reduction in the rate of tax shall only occur if the amount of
            net general revenue collected in the previous fiscal year exceeds the
            highest amount of net general revenue collected in any of the three fiscal
            years prior to such fiscal year by at least one hundred seventy-five million
            dollars.
  versions:
  - effective_from: '2024-01-01'
    formula: previous_fiscal_year_net_general_revenue_collected - highest_net_general_revenue_collected_in_three_prior_fiscal_years
      >= subsection_3_revenue_margin
