format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-mo/statute/143.011
    source_sha256: d6a513119ce60337364a65fd1fa5bf8c316829275be17fa22ced89023a141db3
  summary: “A tax is hereby imposed for every taxable year on the Missouri taxable
    income of every resident.” Subsection 1 states the income brackets and rates;
    subsection 2 sets a top rate beginning with tax years starting in 2023; subsections
    3 and 4 condition further reductions on net general revenue; subsection 5 adjusts
    brackets annually for inflation. The tax is determined by applying the tax table
    or rate provided in section 143.021.
  deferred_outputs:
  - output: us-mo:statutes/143/011#missouri_resident_income_tax
    reason: Mo. Rev. Stat. § 143.011(1) directs that tax be determined by applying
      the tax table or rate provided in section 143.021; no executable RuleSpec output
      for that cited tax table or rate is supplied in the available context.
  - output: us-mo:statutes/143/011/2/3#adjusted_tax_table
    reason: Mo. Rev. Stat. § 143.011(2)(3) directs the director to adjust the tax
      table to apply the top remaining rate above the subsection 5-adjusted threshold;
      the table or rate provided in section 143.021 is not available as an executable
      RuleSpec output.
  - output: us-mo:statutes/143/011/3/4#adjusted_tax_tables
    reason: Mo. Rev. Stat. § 143.011(3)(4) directs the director to adjust the subsection
      1 tax tables; the tax table or rate provided in section 143.021 is not available
      as an executable RuleSpec output.
  - output: us-mo:statutes/143/011/4/4#adjusted_tax_tables_and_remaining_top_bracket
    reason: Mo. Rev. Stat. § 143.011(4)(4) directs adjustment of the subsection 1
      tax tables and elimination of the top bracket when its rate falls below the
      rate applicable to that bracket; the operative table or rate provided in section
      143.021 is not available as an executable RuleSpec output.
  - output: us-mo:statutes/143/011/6/3#net_general_revenue_collected
    reason: Mo. Rev. Stat. § 143.011(6)(3) defines net general revenue collected from
      general-revenue-fund deposits less refunds and revenues designated for distribution
      or transfer; the amounts in those source-stated deposit, refund, and designated-revenue
      categories must be supplied to compute it.
  - output: us-mo:statutes/143/011#inflation_adjusted_income_brackets
    reason: Mo. Rev. Stat. § 143.011(5) requires annual bracket adjustment by the
      percent increase in inflation; computing those adjusted brackets requires the
      CPI for the preceding calendar year and the resulting operative annual brackets,
      which are not supplied as inputs or outputs in the available context.
    source_values:
    - us-mo:statutes/143/011#subsection_3_rate_reduction
  - output: us-mo:statutes/143/011#top_tax_rate_after_subsection_2
    reason: Mo. Rev. Stat. § 143.011(2)(1)–(3) requires adjustment of the tax table
      to effectuate the four and ninety-five hundredths percent top rate and application
      of that rate above the adjusted seven-thousand-dollar threshold; no executable
      RuleSpec output for the adjusted table or rate is supplied in the available
      context.
    source_values:
    - us-mo:statutes/143/011#subsection_3_rate_reduction
  - output: us-mo:statutes/143/011#top_tax_rate_reduction_under_subsection_3
    reason: Mo. Rev. Stat. § 143.011(3)(1)–(4) requires the operative top rate and
      an annual net-general-revenue comparison to determine and implement a reduction;
      the operative rate/table provided in section 143.021 is not supplied as an executable
      RuleSpec output in the available context.
    source_values:
    - us-mo:statutes/143/011#subsection_3_rate_reduction
  - output: us-mo:statutes/143/011#top_tax_rate_reductions_under_subsection_4
    reason: Mo. Rev. Stat. § 143.011(4)(1)–(4) requires the operative top rate, annual
      net-general-revenue comparisons, and inflation adjustment to determine and implement
      reductions; no executable RuleSpec output for the adjusted table or rate is
      supplied in the available context.
    source_values:
    - us-mo:statutes/143/011#subsection_3_rate_reduction
