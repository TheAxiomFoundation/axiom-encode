format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-3
    source_sha256: ed5675f21d4c8beda2a0c1b75a358bc8ea488f85f99c32952ad59074690b6e55
  summary: |-
    Any of the following utility expenses are considered heating sources when used to provide heat for the home:
    Any of the following are considered cooling sources:
    The cost for any of the following supplemental sources of heating or cooling do not qualify for the SUA:
# Each entity represents one expense component. All facts concern that component.
# Outputs classify the component only; they do not determine household eligibility.
# 2026-08-01 is the first full Month evidence coverage floor following the
# authenticated snapshot, not a legal commencement date. Earlier coverage is unproven.
# Branch inventory: ENCODE electricity; gas; propane; coal; wood; oil;
# central air conditioners; evaporative coolers; room air conditioners;
# electric blankets; fans; heat lamps; water for evaporative coolers;
# heating or cooling equipment maintenance; chimney maintenance;
# wood-cutting equipment, including chainsaws, chainsaw maintenance, and axe.
inputs:
  - name: component_type
    entity: UtilityExpenseComponent
    dtype: String
    period: Month
  - name: component_used_to_provide_heat_for_home
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
rules:
  - name: component_is_heating_source
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 3, heating sources
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-3
              excerpt: "Any of the following utility expenses are considered heating sources when used to provide heat for the home:"
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-3
              excerpt: |-
                ● Electricity

                ● Gas or propane

                ● Coal, wood, or oil
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          component_used_to_provide_heat_for_home
          and (
            component_type == "electricity"
            or component_type == "gas"
            or component_type == "propane"
            or component_type == "coal"
            or component_type == "wood"
            or component_type == "oil"
          )
  - name: component_is_cooling_source
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 3, cooling sources
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-3
              excerpt: |-
                Any of the following are considered cooling sources:

                ● Central air conditioners

                ● Evaporative coolers

                ● Room air conditioners
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          component_type == "central_air_conditioner"
          or component_type == "evaporative_cooler"
          or component_type == "room_air_conditioner"
  - name: supplemental_component_disallowed_for_sua
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 3, supplemental-source exclusions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-3
              excerpt: "The cost for any of the following supplemental sources of heating or cooling do not qualify for the SUA:"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-3
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          component_type == "electric_blanket"
          or component_type == "fan"
          or component_type == "heat_lamp"
          or component_type == "water_for_evaporative_cooler"
          or component_type == "heating_equipment_maintenance"
          or component_type == "cooling_equipment_maintenance"
          or component_type == "chimney_maintenance"
          or component_type == "wood_cutting_equipment"
          or component_type == "chainsaw"
          or component_type == "chainsaw_maintenance"
          or component_type == "axe"
