format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
    source_sha256: 9bab68c4c8c38bbe78d9bcfdd0c94c28c249c4298b1af43d7e8145e3ceb8fade
  summary: |-
    The expense for basic service fees of landlines or cell phones are allowable when the budgetary unit is obligated to pay any portion of the telephone expense.
    When the budgetary unit participates in the Lifeline Assistance Program, a telephone expense is allowable when one or more of the following apply:
# Coverage inventory:
# Opening paragraph: ENCODE basic telephone service and payment obligation.
# First bullet: ENCODE separate billing and itemization as included billing forms,
# without imposing an additional billing restriction.
# Second bullet: ENCODE participant responsibility within payment obligation,
# including charges billed to another person.
# Lifeline chapeau: ENCODE participation and alternative qualifying expenses.
# Lifeline first bullet: ENCODE discount not paying the same expense in full.
# Lifeline second bullet: ENCODE extra airtime purchased after free minutes run out.
#
# Each UtilityExpenseComponent represents one identified expense of the
# budgetary unit. Every component fact below concerns that same expense.
# Obligation includes participant responsibility even when someone else is billed.
# Separate billing and itemization with rent or mortgage do not disqualify it.
# This output determines only this component's allowability under this source.
# A negative result does not deny eligibility through other utility sources.
#
# 2026-08-01 is the first full Month evidence coverage floor following the
# authenticated 2026-07-17 snapshot, not a legal commencement date.
# Earlier coverage is unproven.
inputs:
  - name: component_is_telephone_expense
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: component_is_basic_landline_or_cell_phone_service_fee
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: budgetary_unit_obligated_to_pay_any_portion_of_component
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: budgetary_unit_participates_in_lifeline
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: lifeline_discount_does_not_pay_component_in_full
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: component_is_extra_airtime_purchased_after_exhausting_free_minutes
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
rules:
  - name: snap_telephone_expense_component_allowable
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, D NA Utility Expenses and Allowances, block 14
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: The expense for basic service fees of landlines or cell phones are allowable when the budgetary unit is obligated to pay any portion of the telephone expense.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: When the expense is billed separate from or itemized with rent or mortgage.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: When the participant is responsible for the charges (even when it is billed to another person).
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: "When the budgetary unit participates in the Lifeline Assistance Program, a telephone expense is allowable when one or more of the following apply:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: The discount program does not pay the expense in full
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: Extra airtime is purchased after exhausting free minutes
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          component_is_telephone_expense
          and budgetary_unit_obligated_to_pay_any_portion_of_component
          and (
            (
              component_is_basic_landline_or_cell_phone_service_fee
              and not budgetary_unit_participates_in_lifeline
            )
            or (
              budgetary_unit_participates_in_lifeline
              and (
                lifeline_discount_does_not_pay_component_in_full
                or component_is_extra_airtime_purchased_after_exhausting_free_minutes
              )
            )
          )
