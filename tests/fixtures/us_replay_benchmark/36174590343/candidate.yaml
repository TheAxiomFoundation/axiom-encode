format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-14
    source_sha256: 4837f08e036c830b44f43b0bbb064929b060efcc6349427fbc503ac13fd0b903
  summary: 'For taxable years beginning in 2026, the refundable adoption-credit

    determination amount is $5,120. The maximum child tax credit is $2,200,

    and its refundable determination amount is $1,700. Section 3.06(1)

    defines terms applied by 26 USC 32 to the earned income credit table

    on page 15.'
  deferred_outputs:
  - output: us:policies/irs/rev-proc-2025-32/child-tax-credit#earned_income_amount_definition
    blocked_by:
    - us:statutes/26/32#eitc_phased_in
    - us:policies/irs/rev-proc-2025-32/page-15#earned_income_credit_earned_income_amount
    reason: Section 3.06(1) defines the earned income amount term applied by 26 USC
      32 to the page-15 table; both are encoded in those modules.
  - output: us:policies/irs/rev-proc-2025-32/child-tax-credit#threshold_phaseout_amount_definition
    blocked_by:
    - us:statutes/26/32#eitc_phase_out_income
    - us:statutes/26/32#eitc_phase_out_start
    reason: Section 3.06(1) defines the threshold phaseout amount term applied by
      26 USC 32 to the page-15 table; both are encoded in those modules.
  - output: us:policies/irs/rev-proc-2025-32/child-tax-credit#completed_phaseout_amount_definition
    blocked_by:
    - us:statutes/26/32#eitc_phase_out_income
    - us:statutes/26/32#eitc_reduction
    reason: Section 3.06(1) defines the completed phaseout amount term applied by
      26 USC 32 to the page-15 table; both are encoded in those modules.
  - output: us:policies/irs/rev-proc-2025-32/child-tax-credit#joint_and_other_filing_status_phaseout_amount_definitions
    blocked_by:
    - us:policies/irs/rev-proc-2025-32/page-15#earned_income_credit_phaseout_threshold_joint_amount
    - us:policies/irs/rev-proc-2025-32/page-15#earned_income_credit_phaseout_threshold_other_amount
    reason: Section 3.06(1) states the joint-return increase and separated-spouse
      applicability of other-filing-status amounts; these terms are applied by 26
      USC 32 to the page-15 table, and both are encoded in those modules.
  - output: us:policies/irs/rev-proc-2025-32/child-tax-credit#phaseout_amounts_joint_and_other_filing_status_definitions
    blocked_by:
    - us:policies/irs/rev-proc-2025-32/page-15#earned_income_credit_phaseout_threshold_joint_amount
    - us:policies/irs/rev-proc-2025-32/page-15#earned_income_credit_phaseout_threshold_other_amount
    reason: Section 3.06(1) states the joint-return increase and the applicability
      of other-filing-status amounts to specified separated spouses; these terms are
      applied by 26 USC 32 to the page-15 table, and both are encoded in that module.
