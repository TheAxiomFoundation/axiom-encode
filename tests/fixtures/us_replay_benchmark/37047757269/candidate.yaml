- name: personal_income_tax_2026
  kind: derived
  entity: TaxUnit
  dtype: Money
  period: Year
  unit: USD
  source: Uniform tax rate schedule for Tax Year 2026 (Personal Income Tax).
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ri/guidance/tax/adv-2025-22/page-2
          excerpt: 'RHODE ISLAND DIVISION OF TAXATION - PAGE 2 OF 4 Personal Income
            Tax: uniform rate schedule The Division of Taxation has recalculated tax
            bracket ranges for Tax Year 2026, as required by statute.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ri/guidance/tax/adv-2025-22/page-2
          excerpt: Uniform tax rate schedule for Tax Year 2026 (Personal Income Tax)
  versions:
  - effective_from: '2026-01-01'
    formula: 'if personal_taxable_income_2026 <= personal_2026_first_bracket_upper:
      personal_2026_first_rate * personal_taxable_income_2026 else: if personal_taxable_income_2026
      <= personal_2026_second_bracket_upper: personal_2026_second_bracket_base_tax
      + personal_2026_second_rate * (personal_taxable_income_2026 - personal_2026_second_bracket_lower)
      else: personal_2026_third_bracket_base_tax + personal_2026_third_rate * (personal_taxable_income_2026
      - personal_2026_third_bracket_lower)'
