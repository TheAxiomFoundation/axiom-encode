rules:
- name: rehabilitation_expenditure_qualified_basis_per_low_income_unit
  kind: parameter
  dtype: Money
  unit: USD
  source: Rev. Proc. 2025-32 section 3.07
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: per low-income unit qualified basis amount under § 42(e)(3)(A)(ii)(II)
            is $8,700
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: For calendar year 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: '8700'
- name: low_income_housing_credit_ceiling_per_state_resident
  kind: parameter
  dtype: Money
  unit: USD
  source: Rev. Proc. 2025-32 section 3.08
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: $3.416 multiplied by the State population
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: For calendar year 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: '3.416'
- name: low_income_housing_credit_minimum_state_ceiling
  kind: parameter
  dtype: Money
  unit: USD
  source: Rev. Proc. 2025-32 section 3.08
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: $3,953,600
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: For calendar year 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: '3953600'
- name: eitc_qualifying_child_table_index
  kind: derived
  entity: TaxUnit
  dtype: Count
  period: Year
  source: Rev. Proc. 2025-32 section 3.06(1), earned income credit table
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: Number of Qualifying Children Item One Two Three or More None
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: taxable years beginning in 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: 'if qualifying_child_count >= 3: 3 else: qualifying_child_count'
- name: rehabilitation_expenditure_qualified_basis
  kind: derived
  entity: StateAgency
  dtype: Money
  period: Year
  unit: USD
  source: Rev. Proc. 2025-32 section 3.07
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: per low-income unit qualified basis amount under § 42(e)(3)(A)(ii)(II)
            is $8,700
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/irs/rev-proc-2025-32/page-15#rehabilitation_expenditure_qualified_basis_per_low_income_unit
          output: rehabilitation_expenditure_qualified_basis_per_low_income_unit
          hash: sha256:local
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: For calendar year 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: rehabilitation_expenditure_qualified_basis_per_low_income_unit * low_income_unit_count
- name: state_low_income_housing_credit_ceiling
  kind: derived
  entity: StateAgency
  dtype: Money
  period: Year
  unit: USD
  source: Rev. Proc. 2025-32 section 3.08
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: greater of (1) $3.416 multiplied by the State population, or (2)
            $3,953,600
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/irs/rev-proc-2025-32/page-15#low_income_housing_credit_ceiling_per_state_resident
          output: low_income_housing_credit_ceiling_per_state_resident
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/irs/rev-proc-2025-32/page-15#low_income_housing_credit_minimum_state_ceiling
          output: low_income_housing_credit_minimum_state_ceiling
          hash: sha256:local
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: For calendar year 2026
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: "max(\n    low_income_housing_credit_ceiling_per_state_resident * state_population,\n\
      \    low_income_housing_credit_minimum_state_ceiling\n)"
