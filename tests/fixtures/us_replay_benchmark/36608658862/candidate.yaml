format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ks/guidance/department-of-revenue/forms/2026/k-40es/document-1
    source_sha256: 9f23ae506a89ced93943948c7093ec06cc9a3878a8a3665fd6d1559770b47550
  summary: “You must make estimated tax payments if your estimated Kansas income tax
    after withholding and credits is $500 or more” and withholding and credits may
    be less than the smaller stated percentage of current- or prior-year tax. The
    worksheet subtracts deductions and exemptions from expected adjusted gross income,
    applies the filing-status tax schedule, and divides estimated income tax among
    payments. The form states due dates and exceptions to the estimated-tax penalty.
  deferred_outputs:
  - output: us-ks:policies/department-of-revenue/forms/2026/k-40es/document-1#tax_liability_for_filing_status
    reason: The K-40ES Tax Computation Schedules require selection by filing status,
      but no executable filing-status classification is supplied in the available
      context.
  - output: us-ks:policies/department-of-revenue/forms/2026/k-40es/document-1#standard_deduction_for_filing_status
    reason: The K-40ES Standard Deduction Chart supplies four amounts, but no executable
      filing-status classification is supplied in the available context.
  - output: us-ks:policies/department-of-revenue/forms/2026/k-40es/document-1#electronic_payment_portal_choice
    reason: K-40ES, “Visit the Kansas Department of Revenue Payment portal at www.kansas.gov/payment-portal/
      or visit ksrevenue.gov and log in to the Kansas Customer Service Center.” This
      is a choice of payment channels, not a tax computation; the runtime has no payment-channel
      navigation output.
rules:
- name: farmer_fisher_return_filing_exception
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: K-40ES, When to File Your Estimated Tax Vouchers, Farmers and Fishers
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ks/guidance/department-of-revenue/forms/2026/k-40es/document-1
          excerpt: Farmers and Fishers – Payment is due on or before January 15, 2027
            unless your return for the 2026 tax year is filed and tax fully paid on
            or before March 1, 2027.
  versions:
  - effective_from: '2026-01-01'
    formula: 'taxpayer_is_farmer_or_fisher

      and return_filed_by_farmer_fisher_exception_deadline

      and tax_fully_paid_by_farmer_fisher_exception_deadline'
- name: farmer_fisher_estimated_payment_due
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Year
  source: K-40ES, When to File Your Estimated Tax Vouchers, Farmers and Fishers
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ks/guidance/department-of-revenue/forms/2026/k-40es/document-1
          excerpt: Farmers and Fishers – Payment is due on or before January 15, 2027
            unless your return for the 2026 tax year is filed and tax fully paid on
            or before March 1, 2027.
  versions:
  - effective_from: '2026-01-01'
    formula: 'taxpayer_is_farmer_or_fisher

      and not farmer_fisher_return_filing_exception'
- name: fiscal_year_estimated_payment_due
  kind: derived
  entity: TaxUnit
  dtype: Judgment
  period: Day
  source: K-40ES, When to File Your Estimated Tax Vouchers, Fiscal Year Taxpayers
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ks/guidance/department-of-revenue/forms/2026/k-40es/document-1
          excerpt: Fiscal Year Taxpayers – Payments are due on or before the 15th
            day of the 4th, 6th and 9th months of the current fiscal year and the
            1st month of the following fiscal year.
  versions:
  - effective_from: '2026-01-01'
    formula: 'taxpayer_uses_fiscal_year

      and day_is_applicable_fiscal_year_estimated_payment_deadline'
- name: other_status_schedule_estimated_tax
  kind: derived
  entity: TaxUnit
  dtype: Money
  period: Year
  unit: USD
  source: K-40ES, Estimated Tax Worksheet line 6 and Tax Computation Schedule II
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ks/guidance/department-of-revenue/forms/2026/k-40es/document-1
          excerpt: Estimated Kansas tax liability (use the Tax Computation Schedules
            below) 7.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ks/guidance/department-of-revenue/forms/2026/k-40es/document-1
          excerpt: 5.2% of line 5 $23,000 .................................................
            $1,196 plus 5.58% of excess over $23,000
  versions:
  - effective_from: '2026-01-01'
    formula: 'if kansas_taxable_income <= other_lower_bracket_ceiling: lower_bracket_rate
      * kansas_taxable_income else: other_lower_bracket_tax + upper_bracket_rate *
      (kansas_taxable_income - other_lower_bracket_ceiling)'
- name: farmer_fisher_current_year_safe_harbor_rate
  kind: parameter
  dtype: Rate
  period: Year
  source: K-40ES, Estimated Tax Penalty, farmers and fishers
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-ks/guidance/department-of-revenue/forms/2026/k-40es/document-1
          excerpt: 'However, the penalty will not apply if each payment is timely
            and your total payments and credits: • are at least 90% (66 2/3% for farmers
            and fishers) of the tax shown on your return for tax year 2026, OR • equal
            or exceed 100% of the tax shown on your 2025 return, (the return must
            cover a 12-month period with a tax liability), OR • equal or exceed 90%
            of the tax shown on your annualized income for the periods January 1,
            2026 to March 31, May 31, August 31 and December 31, 2026.'
  versions:
  - effective_from: '2026-01-01'
    formula: 2 / 3
- name: estimated_tax_payment_threshold
  kind: parameter
  dtype: Money
  period: Year
  unit: USD
  source: K-40ES, “if ... estimated Kansas income tax after withholding and credits
    is $500 or more”
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/guidance/department-of-revenue/forms/2026/k-40es/document-1
          excerpt: 'You must make estimated tax payments if your estimated Kansas
            income tax after withholding and credits is $500 or more and your withholding
            and credits may be less than the smaller of: a) 90% of the tax on your
            tax return for tax year 2026; or b) 100% of the tax shown on your 2025
            tax return.'
