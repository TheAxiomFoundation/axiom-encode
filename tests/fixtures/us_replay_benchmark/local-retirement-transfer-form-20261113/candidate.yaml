          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-q-retirement-income-transfer
          excerpt: 'Retirement income you are transferring to your spouse on December
            31, 2025 (maximum: 50% of the amount on line 20).

            Carry this amount to line 245 of your return.

            Your spouse must enter the same amount on line 123 of their return.'
