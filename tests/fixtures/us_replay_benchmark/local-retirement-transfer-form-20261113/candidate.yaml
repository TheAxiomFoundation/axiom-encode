          excerpt: 'Amount from line 10 used to purchase an annuity or transferred
            to an RRSP, a RRIF

            or a PRPP/VRSP (included in the amount on line 250 [point 4])

            12

            Deduction claimed on line 250 (point 6) for a refund of unused PRPP/VRSP

            contributions included in the amount on line 10 above

            + 13

            Deduction claimed on line 293 of your return for the amount on line 10

            + 14

            Deduction claimed on line 297 (point 12) of your return for the amount
            on line 10

            + 16

            Add lines 12 through 16.

            =

            '
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-q-retirement-income-transfer
