- name: net_income_for_multiple_jurisdictions
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: CRA T2036 2025 note (3), multiple-jurisdiction residence-allocation substitution.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you paid tax to more than one jurisdiction in 2025, calculate
            this amount according to note (3) of Form T2209. However,

            instead of using "line 23600 of your return plus the amount on line 68360
            of Form T1206" as stated in that note, use the

            amount allocated to your province or territory of residence in column
            4 of Part 1 of Form T2203 to do the calculation.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-foreign-tax-credits
          excerpt: '(3) Net income

            Amount from line 23600 of your return (or the amount you would have entered
            if the instructions said "if negative, show in

            brackets") plus the amount on line 68360 of Form T1206, Total split income,
            minus any:

            (cid:129) amount deductible as a Canadian Forces personnel and police
            deduction (line 24400 of your return)

            (cid:129) amount deductible as security options deductions (line 24900
            of your return)

            (cid:129) amount deductible as an other payments deduction (line 25000
            of your return)

            (cid:129) net capital losses of other years you claimed (line 25300 of
            your return)

            (cid:129) capital gains deduction for qualifying business transfer or
            qualifying cooperative conversion you claimed (line 25395 of

            your return)

            (cid:129) capital gains deduction you claimed (line 25400 of your return)

            (cid:129) amounts deductible as net employment income from a prescribed
            international organization, as foreign income exempt

            under a tax treaty, or as adult basic education tuition assistance (included
            on line 25600 of your return)'
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: 'amount_allocated_to_province_or_territory_of_residence_t2203_part_1_column_4

      - deductible_canadian_forces_police_24400

      - deductible_security_options_24900

      - deductible_other_payments_25000

      - claimed_net_capital_losses_25300

      - claimed_qualifying_transfer_capital_gains_25395

      - claimed_capital_gains_25400

      - deductible_prescribed_organization_employment_25600

      - deductible_treaty_exempt_foreign_income_25600

      - deductible_adult_basic_education_tuition_25600'
    effective_to: '2025-12-31'
- name: t2036_net_income_for_credit
  kind: derived
