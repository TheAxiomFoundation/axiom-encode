          excerpt: 'If you were a resident of Canada for part of the year, include
            the income for the part of the year you were a resident of

            Canada plus any income and losses referred to in paragraphs 115(1)(a)
            to (c) of the Income Tax Act as reported on your

            Canadian tax return, for the part of the year you were not a resident
            of Canada.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you paid tax to more than one jurisdiction in 2025, calculate
            this amount according to note (3) of Form T2209. However,

            instead of using "line 23600 of your return plus the amount on line 68360
            of Form T1206" as stated in that note, use the

            amount allocated to your province or territory of residence in column
            4 of Part 1 of Form T2203 to do the calculation.'
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: "if jurisdictions_tax_paid_count > 1:\n  net_income_for_multiple_jurisdictions\n\
      else:\n  if resident_of_canada_for_part_of_year:\n    income_for_part_of_year_resident_in_canada\n\
      \    + income_and_losses_under_paragraphs_115_1_a_to_c_for_nonresident_part\n\
      \  else:\n    t2209_net_income_line_2"
    effective_to: '2025-12-31'
