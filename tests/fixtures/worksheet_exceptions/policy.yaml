- name: provincial_territorial_foreign_tax_credit_line_5
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: CRA T2036 2025 line 5 and introductory exceptions.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: "Enter the amount from line 1 of Form T2209. 1\nEnter the amount\
            \ from line 3 of Form T2209, unless you have to pay minimum tax.(1) \u2013\
            \ 2\nLine 1 minus line 2 = 3\nNet foreign\nnon-business income (2) Provincial\
            \ or territorial\n\xD7 = 4\nNet income (3) tax otherwise payable (4)\n\
            Enter whichever amount is less: line 3 or line 4.\nThe amount on line\
            \ 5 should not be more than the amount entered Provincial or territorial\n\
            on the line for provincial or territorial tax otherwise payable. foreign\
            \ tax credit 5"
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'Before you complete this form, calculate your federal foreign
            tax credit by using Form T2209, Federal Foreign Tax Credits. If

            the amount of the federal foreign non-business income tax credit you are
            entitled to deduct is equal to the foreign non-business

            tax you paid, your provincial or territorial foreign tax credit would
            be zero. As a result, you do not have to complete this form.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: This form does not apply to residents of Quebec.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: If you must pay minimum tax and you were a resident of Manitoba,
            you cannot claim a provincial foreign tax credit.
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: "if resident_of_quebec_at_year_end or (resident_of_manitoba_at_year_end\
      \ and minimum_tax_is_payable):\n  0\nelse:\n  if provincial_territorial_2025_t2036_foreign_non_business_tax_line_1\
      \ == t2209_federal_non_business_foreign_tax_credit_line_3:\n    0\n  else:\n\
      \    min(\n      provincial_territorial_2025_t2036_excess_foreign_tax_line_3,\n\
      \      provincial_territorial_2025_t2036_tax_otherwise_payable_line_4,\n   \
      \   provincial_or_territorial_tax_otherwise_payable\n    )"
    effective_to: '2025-12-31'
