rules:
- name: provincial_or_territorial_tax_otherwise_payable
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: CRA T2036 2025 note (4), provincial or territorial tax otherwise payable.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: The result from line 81 is your provincial or territorial tax otherwise
            payable.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: The amount from line 58 is your provincial or territorial tax otherwise
            payable.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: adding the amount from line 63 to the amount on line 68 of Form
            AB428
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: adding the amount from line 20 to the amount from line 36 in Part
            4 of Section AB428MJ of Form T2203.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: excluding the provincial and territorial foreign tax credit and
            any British Columbia additional tax for minimum tax purposes
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of a province or territory other than Ontario,
            Alberta, or British Columbia, enter the amount of tax

            calculated before determining the provincial or territorial foreign tax
            credit by using the appropriate Form 428. However, if

            you have to pay tax to more than one jurisdiction, complete the applicable
            part of Section 428MJ of Form T2203 for the

            province or territory in which you resided at the end of the year.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of Ontario, calculate this amount by entering
            "0" on lines 70 and 72 of Form ON428 and continue the

            calculation. The result from line 81 is your provincial or territorial
            tax otherwise payable. If you paid tax to more than one

            jurisdiction in 2025, calculate this amount by entering "0" on lines 43
            and 45 in Part 4 of Section ON428MJ of Form T2203

            and continue the calculation. The amount from line 58 is your provincial
            or territorial tax otherwise payable.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of Alberta, calculate your provincial or
            territorial tax otherwise payable by adding the amount from

            line 63 to the amount on line 68 of Form AB428 or by adding the amount
            from line 20 to the amount from line 36 in Part 4 of

            Section AB428MJ of Form T2203.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of British Columbia at the end of the tax
            year, your provincial or territorial tax otherwise payable is

            the amount of tax excluding the provincial and territorial foreign tax
            credit and any British Columbia additional tax for

            minimum tax purposes from Form BC428 or Section BC428MJ of Form T2203.'
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: "if resident_of_ontario_at_year_end:\n  if jurisdictions_tax_paid_count\
      \ > 1:\n    on428mj_line_58_after_entering_zero_on_lines_43_and_45\n  else:\n\
      \    on428_line_81_after_entering_zero_on_lines_70_and_72\nelse:\n  if resident_of_alberta_at_year_end:\n\
      \    if alberta_applicable_form_is_428mj:\n      alberta_428mj_line_20 + alberta_428mj_line_36\n\
      \    else:\n      alberta_tax_line_63 + alberta_tax_line_68\n  else:\n    if\
      \ resident_of_british_columbia_at_year_end:\n      british_columbia_tax_excluding_foreign_tax_credit_and_additional_minimum_tax\n\
      \    else:\n      if jurisdictions_tax_payable_count > 1:\n        section_428mj_tax_before_foreign_tax_credit_for_residence_jurisdiction\n\
      \      else:\n        form_428_tax_before_provincial_or_territorial_foreign_tax_credit"
    effective_to: '2025-12-31'
- name: separate_country_forms_required
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: CRA T2036 2025 instructions concerning more than one foreign country.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you paid tax to more than one foreign country, and the total
            of the non-business income taxes that you paid to all foreign

            countries was more than $200, do the calculation on a separate form for
            each country in Canadian dollars.'
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: "foreign_countries_taxed_count > 1\nand total_non_business_income_taxes_paid_to_all_foreign_countries\n\
      \    > total_non_business_income_taxes_paid_to_all_foreign_countries_ceiling"
    effective_to: '2025-12-31'
- name: provincial_territorial_2025_t2036_federal_credit_line_2
  kind: derived
  entity: Person
  dtype: Money
  unit: CAD
  period: Year
  source: CRA T2036 2025 line 2 and note (1).
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: '(1) If you must pay minimum tax, follow the instructions below:

            (cid:129) If you were a resident of British Columbia at the end of the
            year, enter the amount from line 3 of Form T2209 on line 2.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: "(cid:129) If you were a resident of Ontario at the end of the\
            \ year, follow the instructions that apply to your situation:\n\u2013\
            \ If the total non-business income taxes you paid to all foreign countries\
            \ is $200 or less:\n1. Take the amount from line 1 of this form.\n2. Divide\
            \ it by the sum of line 1 of this form and the amount on line 8 of Part\
            \ 4 of Form T691, Alternative\nMinimum Tax.\n3. Multiply that result by\
            \ the special foreign tax credit on line 11 of Part 4 of Form T691.\n\
            4. Enter the result on line 2."
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: "\u2013 If the total non-business income taxes you paid to all\
            \ foreign countries is more than $200, you must calculate for\neach country:\n\
            1. Take the amount from line 1 of this form for that country.\n2. Divide\
            \ it by the total foreign taxes paid for 2025 (to get this total, add\
            \ the amount on line 7 of Part 4 of\nForm T691, Alternative Minimum Tax,\
            \ divided by 66.6666% and the amount on line 8 of Part 4 of Form T691).\n\
            3. Multiply that result by the special foreign tax credit on line 11 of\
            \ Part 4 of Form T691.\n4. Enter the result on line 2 of the sheet for\
            \ that country."
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: '(cid:129) If you were a resident of another province or territory
            at the end of the year, enter the part of special foreign tax credit

            (line 11 of Part 4 of Form T691) that relates to non-business income taxes
            you paid to a foreign country for 2025 on

            line 2.'
      - kind: formula
        path: versions[0].formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Enter the amount from line 3 of Form T2209, unless you have to
            pay minimum tax.(1)
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax
            credit for 2025 that you can deduct from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: "if not minimum_tax_is_payable:\n  t2209_federal_non_business_foreign_tax_credit_line_3\n\
      else:\n  if resident_of_british_columbia_at_year_end:\n    t2209_federal_non_business_foreign_tax_credit_line_3\n\
      \  else:\n    if resident_of_ontario_at_year_end:\n      if total_non_business_income_taxes_paid_to_all_foreign_countries\n\
      \          <= total_non_business_income_taxes_paid_to_all_foreign_countries_ceiling:\n\
      \        ontario_minimum_tax_single_country_special_credit\n      else:\n  \
      \      ontario_minimum_tax_country_special_credit\n    else:\n      special_foreign_tax_credit_related_to_non_business_income"
    effective_to: '2025-12-31'
