format: rulespec/v1
imports: []
module:
  summary: 'Whole NS479 parent diagnostic: explicit claimant Person and annual per-child
    SourceEntry table membership; entered eligibility boundaries, per-child arithmetic,
    and document/refund duties. Not a determination of linked guide eligibility or
    final payable refund.'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/ns479-credits
    source_sha256: 6b8f99a306ad1815d427ee2406dc5683f3a52701106fc80deddb43287f641068
units:
- name: CAD
  kind: currency
  minor_units: 2
inputs:
- name: ns479_volunteer_firefighters_ground_search_rescue_credit_eligible
  entity: Person
  dtype: Boolean
  period: Year
  description: Explicit externally determined applicability of the volunteer credit;
    this form does not determine detailed eligibility from the linked guidance.
- name: completing_ns479
  entity: Person
  dtype: Boolean
  period: Year
  description: Explicit use of this form, not a claim that calculations or filing
    have been completed.
- name: filing_paper_return
  entity: Person
  dtype: Boolean
  period: Year
  description: Explicit paper-return filing context.
- name: using_children_credit_section
  entity: Person
  dtype: Boolean
  period: Year
  description: Explicit use of this section; not an eligibility determination or truth
    of completed table.
- name: needs_additional_space
  entity: Person
  dtype: Boolean
  period: Year
  description: Explicit need for additional space; not inferred from number of child
    rows.
- name: taxes_to_pay
  entity: Person
  dtype: Money
  period: Year
  description: Explicit amount of taxes to pay for conditional credit excess; no default
    and no claim of final refund settlement.
  unit: CAD
- name: child_name
  entity: SourceEntry
  dtype: Text
  period: Year
  description: Column A child name for this annual per-child table row; not a unique
    global identity or kinship inference.
- name: eligible_expenses_b
  entity: SourceEntry
  dtype: Money
  period: Year
  description: Column B entered annual eligible expenses for this one child; detailed
    program eligibility is external to this form.
  unit: CAD
- name: assistance_received_or_receivable_c
  entity: SourceEntry
  dtype: Money
  period: Year
  description: Column C assistance received or receivable for expenses in column B,
    including reimbursements and allowances.
  unit: CAD
- name: amount_from_d_claimed_by_others_e
  entity: SourceEntry
  dtype: Money
  period: Year
  description: Column E entered amount from this child row column D claimed by others.
  unit: CAD
