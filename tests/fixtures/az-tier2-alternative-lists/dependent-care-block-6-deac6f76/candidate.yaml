format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
  summary: |-
    Expenses must be verified only when any of the following occurs:
    Dependent child or incapacitated adult care expense amounts must be verified using documented or collateral contact verification before allowing the expense.
    NOTE Collateral contact can only be made to clarify documented verification or when the participant is unable to obtain the verification and asks for assistance.
inputs:
  - {name: new_application, entity: Person, dtype: Boolean, period: Month}
  - {name: renewal_application, entity: Person, dtype: Boolean, period: Month}
  - {name: reported_expense_or_address_change_received, entity: Person, dtype: Boolean, period: Month}
  - {name: expense_amount_is_questionable, entity: Person, dtype: Boolean, period: Month}
  - {name: care_is_for_incapacitated_adult, entity: Person, dtype: Boolean, period: Month}
  - {name: current_physician_statement_indicates_supervision_or_personal_care_required, entity: Person, dtype: Boolean, period: Month}
  - {name: current_psychologist_statement_indicates_supervision_or_personal_care_required, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_documentation_contains_provider_name, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_documentation_contains_provider_address, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_documentation_contains_provider_telephone, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_documentation_contains_amount_billed, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_documentation_contains_billing_frequency, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_documentation_contains_covered_period, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_documentation_names_care_recipient, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_documentation_names_participant_billed, entity: Person, dtype: Boolean, period: Month}
  - {name: contact_clarifies_documented_verification, entity: Person, dtype: Boolean, period: Month}
  - {name: participant_unable_to_obtain_verification, entity: Person, dtype: Boolean, period: Month}
  - {name: participant_requests_verification_assistance, entity: Person, dtype: Boolean, period: Month}
  - {name: paid_receipt_verifies_expense_amount, entity: Person, dtype: Boolean, period: Month}
  - {name: participant_canceled_check_verifies_expense_amount, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_website_or_app_screenshot_verifies_expense_amount, entity: Person, dtype: Boolean, period: Month}
  - {name: provider_statement_signed_and_dated, entity: Person, dtype: Boolean, period: Month}
  - {name: other_documented_verification_verifies_expense_amount, entity: Person, dtype: Boolean, period: Month}
  - {name: collateral_contact_verifies_expense_amount, entity: Person, dtype: Boolean, period: Month}
  - {name: participant_receives_na, entity: Person, dtype: Boolean, period: Month}
  - {name: transportation_to_and_from_dependent_care_provider_verified, entity: Person, dtype: Boolean, period: Month}
  - {name: employment_search_information_verified, entity: Person, dtype: Boolean, period: Month}
  - {name: snap_activities_information_verified, entity: Person, dtype: Boolean, period: Month}
rules:
  - name: dependent_care_expense_verification_required
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, verification occasions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: |-
                Expenses must be verified only when any of the following occurs:

                ● New application

                ● Renewal application

                ● When a reported change in the expense or address is received (See Effecting Changes for change information)

                ● When the expense amount is questionable(g)
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          new_application
          or renewal_application
          or reported_expense_or_address_change_received
          or expense_amount_is_questionable

  - name: incapacitated_adult_care_statement_requirement_satisfied
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, incapacitated adult statement
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: A current statement from a physician or psychologist indicating that the incapacitated adult requires supervision or personal care is needed to allow incapacitated adult care expenses.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not care_is_for_incapacitated_adult
          or current_physician_statement_indicates_supervision_or_personal_care_required
          or current_psychologist_statement_indicates_supervision_or_personal_care_required

  - name: dependent_care_provider_documentation_complete
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, required provider documentation information
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: |-
                Provider documentation must contain all of the following information:

                Name, address, and telephone number of the provider

                Amount billed

                How often billed

                Period of time it covers

                The name of the participant receiving the care

                The name of the participant being billed
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          provider_documentation_contains_provider_name
          and provider_documentation_contains_provider_address
          and provider_documentation_contains_provider_telephone
          and provider_documentation_contains_amount_billed
          and provider_documentation_contains_billing_frequency
          and provider_documentation_contains_covered_period
          and provider_documentation_names_care_recipient
          and provider_documentation_names_participant_billed

  - name: dependent_care_collateral_contact_permitted
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, collateral contact limitation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: Collateral contact can only be made to clarify documented verification or when the participant is unable to obtain the verification and asks for assistance.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          contact_clarifies_documented_verification
          or (
            participant_unable_to_obtain_verification
            and participant_requests_verification_assistance
          )

  - name: dependent_care_expense_amount_verification_satisfied
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, amount verification and acceptable evidence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: Dependent child or incapacitated adult care expense amounts must be verified using documented or collateral contact verification before allowing the expense.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: |-
                Verification that can be used for the expense amount includes, and is not limited to, any of the following:

                ● Paid receipt or participant's canceled checks.

                ● Screenshot of verification from the provider’s website or app.

                ● Collateral contact to, or a signed and dated statement from, the provider of the care.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: 'Provider documentation must contain all of the following information:'
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: Collateral contact can only be made to clarify documented verification or when the participant is unable to obtain the verification and asks for assistance.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          paid_receipt_verifies_expense_amount
          or participant_canceled_check_verifies_expense_amount
          or provider_website_or_app_screenshot_verifies_expense_amount
          or other_documented_verification_verifies_expense_amount
          or (
            provider_statement_signed_and_dated
            and dependent_care_provider_documentation_complete
          )
          or (
            collateral_contact_verifies_expense_amount
            and dependent_care_collateral_contact_permitted
          )

  - name: na_dependent_care_verification_requirements_satisfied
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, NA verification requirements
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: |-
                For NA, all of the following must be verified:

                ● Transportation to and from a dependent care provider for the NA Dependent Care Transportation Standard.

                ● Information about the participant’s search for employment and about Supplemental Nutrition Assistance Program Career Advancement Network (SNAP) activities.

                ● The dependent child or incapacitated adult care expense amount.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not participant_receives_na
          or (
            transportation_to_and_from_dependent_care_provider_verified
            and employment_search_information_verified
            and snap_activities_information_verified
            and dependent_care_expense_amount_verification_satisfied
          )
