format: rulespec/v1
module:
  summary: 'CRA Form T936 2025 calculates cumulative net investment loss to

    December 31, 2025, including Chart A and Parts 1 to 3.'
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/cumulative-net-investment-loss
    source_sha256: 796503a6838cb17679a0051fe8b20b95a115febc7d034f67ca340c0a0b3eabdc
  proof_validation:
    required: true
rules:
- name: federal_2025_t936_chart_a_line_17
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA T936 2025 Chart A line 17.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/cumulative-net-investment-loss
          excerpt: Line 15 minus line 16 68150 = 17
  versions:
  - effective_from: '2025-01-01'
    formula: t3_box_21_capital_gains - t3_box_30_capital_gains_eligible_for_deduction
- name: federal_2025_t936_chart_a_line_19
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA T936 2025 Chart A line 19 and its T3-slip condition.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/cumulative-net-investment-loss
          excerpt: Line 17 multiplied by the percentage on line 18
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/cumulative-net-investment-loss
          excerpt: Otherwise, enter "0" on line 19
  versions:
  - effective_from: '2025-01-01'
    formula: 'if t936_chart_a_line_14_includes_t3: federal_2025_t936_chart_a_line_17
      * federal_2025_t936_chart_a_inclusion_rate else: 0'
- name: federal_2025_t936_total_investment_expenses_line_a
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA T936 2025 Part 1, lines 1 to 7 and total A.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/cumulative-net-investment-loss
          excerpt: Add lines 1 to 7. Total investment expenses claimed in 2025 = A
  versions:
  - effective_from: '2025-01-01'
    formula: 'carrying_charges_and_interest_expenses_line_22100

      + net_rental_losses_line_12600

      + limited_or_non_active_partnership_losses_line_12200

      + limited_partnership_losses_of_other_years_line_25100

      + federal_2025_t936_chart_a_line_5_expense_amount

      + other_investment_expenses_line_68080

      + federal_2025_t936_additional_expenses_line_7'
- name: federal_2025_t936_total_investment_income_line_b
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA T936 2025 Part 2, lines 8 to 13 and total B.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/cumulative-net-investment-loss
          excerpt: Add lines 8 to 13. Total investment income reported in 2025 = B
  versions:
  - effective_from: '2025-01-01'
    formula: 'investment_income_lines_12000_and_12100

      + net_rental_income_line_12600

      + limited_or_non_active_partnership_income_line_12200

      + federal_2025_t936_other_property_income_line_11

      + federal_2025_t936_line_12_recovery_expense_income

      + federal_2025_t936_additional_income_line_13'
- name: cumulative_net_investment_loss_t936_part_3_line_c
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA T936 2025 Part 3 line C.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/cumulative-net-investment-loss
          excerpt: Line 18 minus line 21 (if negative, enter "0") CNIL to December
            31, 2025 = C
  versions:
  - effective_from: '2025-01-01'
    formula: "max(\n  0,\n  federal_2025_t936_cumulative_investment_expenses_line_18\n\
      \  - federal_2025_t936_cumulative_investment_income_line_21\n)"
