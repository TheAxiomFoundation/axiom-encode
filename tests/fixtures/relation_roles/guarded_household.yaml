      \ r))))\nor ((anchor.snap_exception_in_residence\n     or exists(snap_within_two_ties(anchor, p),\n\
      \               exists(snap_tie(p, r), not snap_within_two_ties(anchor, r))))\n    and candidate.snap_household_unit\
      \ == anchor.snap_household_unit)\n"
  source: Synthetic encoder test input adapted from relation-roles.md section 8
