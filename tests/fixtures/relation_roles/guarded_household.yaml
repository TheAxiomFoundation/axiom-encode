      \ candidate) and candidate.age < 18)\nor (under_parental_control_of(anchor, candidate)\n    and\
      \ not parent_of(candidate, anchor) and anchor.age < 18)\n"
  source: Synthetic encoder test input adapted from relation-roles.md section 8
