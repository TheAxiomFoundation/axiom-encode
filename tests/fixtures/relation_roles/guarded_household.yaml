    slot_entities:
    - Person
    - Person
    current_slot: 0
    related_slot: 1
    source_relation: lives_with
  versions:
  - effective_from: 2026-01-01
    formula: "candidate.meal_group == anchor.meal_group or spouse_of(anchor, candidate) or spouse_of(candidate,\
