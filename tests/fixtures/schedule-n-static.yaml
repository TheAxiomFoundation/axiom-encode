- name: schedule_n_net_investment_income_for_carryover
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  source: 'If, for 2025, your investment income (line 36 of Schedule N) is greater than your investment expenses (lines 18 and 54 of Schedule N), you can deduct the unused portion of the adjustment of investment expenses (up to the difference between your investment income and your investment expenses). Unused portion of the adjustment of investment expenses (line 70 of Schedule N) The unused portion of the adjustment of investment expenses is equal to the total of the amounts entered since 2004 on lines 40 and 64 of Schedule N, minus the amount already used to reduce your investment income for a previous year. '
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: schedule_n_investment_income_line_36 - schedule_n_investment_expenses_line_18 - schedule_n_other_investment_expenses_line_54
  unit: CAD
