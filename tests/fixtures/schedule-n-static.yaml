- name: schedule_n_part_c_input_consistent
  kind: derived
  entity: Person
  dtype: Boolean
  period: Year
  source: "Complete this part only if you entered an amount on lines 289 and 290 of your return.\nLimited partnership loss\n(included on line 289 of your return)\nNet capital losses from other years (see line 276, point 9, in the guide)\nAdd lines 50 and 52.\nAmount from line 36 above\nAmount from line 18 above\nSubtract line 58 from line 56. If the result is negative, enter 0.\nSubtract line 60 from line 54. If the result is negative, enter 0.\nCarry the result to line 276 of your return.\b\n"
  versions:
