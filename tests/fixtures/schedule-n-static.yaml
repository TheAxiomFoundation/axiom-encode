    effective_to: '2025-12-31'
    formula: "if schedule_n_part_c_applies == true or (schedule_n_limited_partnership_loss_line_50 == 0 and schedule_n_net_capital_losses_other_years_line_52 == 0):\n    true\nelse:\n    false"
