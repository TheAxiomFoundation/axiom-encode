- name: schedule_n_part_c_applies
  kind: derived
  entity: Person
  dtype: Boolean
  period: Year
  source: '09 Adjustment of other investment expenses The amount that you deduct as investment expenses cannot exceed your investment income. If you are deducting either of the following, complete Schedule N to calculate the amount to enter on line 276 of your return: • a limited partnership loss (included on line 289 of your return); • net capital losses from other years. On line 52 of Schedule N, enter the amount from line 290 of your return.'
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: "if limited_partnership_loss_deduction_entered == true or net_capital_loss_deduction_entered == true:\n    true\nelse:\n    false"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/main-return/guide
          excerpt: '09 Adjustment of other investment expenses The amount that you deduct as investment expenses cannot exceed your investment income. If you are deducting either of the following, complete Schedule N to calculate the amount to enter on line 276 of your return: • a limited partnership loss (included on line 289 of your return); • net capital losses from other years. On line 52 of Schedule N, enter the amount from line 290 of your return.'
      - path: versions[0].effective_from
