format: rulespec/v1
module:
  summary: '“Use this form to calculate the foreign non-business income tax credit

    for 2025 that you can deduct from the income tax payable to the province

    or territory you resided in at the end of the tax year.” The calculation

    uses T2036 lines 1 through 5 and the minimum-tax, net-income, and

    tax-otherwise-payable instructions.'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
    source_sha256: 7637ab494fc385b938e9e3ce4d5f3b1af8bc331ad644fe3cedefaee8434028ee
rules:
- name: net_income_for_part_year_resident
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA Form T2036 2025 note (3), part-year residence
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of Canada for part of the year, include the income for the part of the
            year you were a resident of

            Canada plus any income and losses referred to in paragraphs 115(1)(a) to (c) of the Income Tax Act as
            reported on your

            Canadian tax return, for the part of the year you were not a resident of Canada.'
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax credit for 2025 that you can deduct
            from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax credit for 2025 that you can deduct
            from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: 'if resident_of_canada_for_part_of_year: income_for_part_of_year_resident_in_canada + income_and_losses_under_paragraphs_115_1_a_to_c_for_nonresident_part
      else: 0'
    effective_to: '2025-12-31'
- name: net_income_for_multiple_jurisdictions
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA Form T2036 2025 note (3), multiple-jurisdiction substitution
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you paid tax to more than one jurisdiction in 2025, calculate this amount according to note
            (3) of Form T2209. However,

            instead of using "line 23600 of your return plus the amount on line 68360 of Form T1206" as stated in
            that note, use the

            amount allocated to your province or territory of residence in column 4 of Part 1 of Form T2203 to do
            the calculation.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-foreign-tax-credits
          excerpt: '(3) Net income

            Amount from line 23600 of your return (or the amount you would have entered if the instructions said
            "if negative, show in

            brackets") plus the amount on line 68360 of Form T1206, Total split income, minus any:

            (cid:129) amount deductible as a Canadian Forces personnel and police deduction (line 24400 of your
            return)

            (cid:129) amount deductible as security options deductions (line 24900 of your return)

            (cid:129) amount deductible as an other payments deduction (line 25000 of your return)

            (cid:129) net capital losses of other years you claimed (line 25300 of your return)

            (cid:129) capital gains deduction for qualifying business transfer or qualifying cooperative conversion
            you claimed (line 25395 of

            your return)

            (cid:129) capital gains deduction you claimed (line 25400 of your return)

            (cid:129) amounts deductible as net employment income from a prescribed international organization,
            as foreign income exempt

            under a tax treaty, or as adult basic education tuition assistance (included on line 25600 of your return)'
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax credit for 2025 that you can deduct
            from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax credit for 2025 that you can deduct
            from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: 'if jurisdictions_tax_paid_count > multiple_foreign_country_count_threshold: amount_allocated_to_province_or_territory_of_residence_t2203_part_1_column_4
      - deductible_canadian_forces_police_24400 - deductible_security_options_24900 - deductible_other_payments_25000
      - claimed_net_capital_losses_25300 - claimed_qualifying_transfer_capital_gains_25395 - claimed_capital_gains_25400
      - deductible_prescribed_organization_employment_25600 - deductible_treaty_exempt_foreign_income_25600 - deductible_adult_basic_education_tuition_25600
      else: 0'
    effective_to: '2025-12-31'
