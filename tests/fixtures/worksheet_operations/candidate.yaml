- name: provincial_or_territorial_tax_otherwise_payable
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA Form T2036 2025, note (4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of a province or territory other than Ontario, Alberta, or British Columbia,
            enter the amount of tax

            calculated before determining the provincial or territorial foreign tax credit by using the appropriate
            Form 428. However, if

            you have to pay tax to more than one jurisdiction, complete the applicable part of Section 428MJ of
            Form T2203 for the

            province or territory in which you resided at the end of the year.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of Ontario, calculate this amount by entering "0" on lines 70 and 72
            of Form ON428 and continue the

            calculation. The result from line 81 is your provincial or territorial tax otherwise payable. If you
            paid tax to more than one

            jurisdiction in 2025, calculate this amount by entering "0" on lines 43 and 45 in Part 4 of Section
            ON428MJ of Form T2203

            and continue the calculation. The amount from line 58 is your provincial or territorial tax otherwise
            payable.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of Alberta, calculate your provincial or territorial tax otherwise payable
            by adding the amount from

            line 63 to the amount on line 68 of Form AB428 or by adding the amount from line 20 to the amount from
            line 36 in Part 4 of

            Section AB428MJ of Form T2203.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: 'If you were a resident of British Columbia at the end of the tax year, your provincial or territorial
            tax otherwise payable is

            the amount of tax excluding the provincial and territorial foreign tax credit and any British Columbia
            additional tax for

            minimum tax purposes from Form BC428 or Section BC428MJ of Form T2203.'
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax credit for 2025 that you can deduct
            from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax credit for 2025 that you can deduct
            from the income tax
  versions:
  - effective_from: '2025-01-01'
    formula: "if resident_of_ontario_at_year_end:\n  if (jurisdictions_tax_paid_count > multiple_foreign_country_count_threshold):\n\
      \    on428mj_line_58_after_entering_zero_on_lines_43_and_45\n  else:\n    on428_line_81_after_entering_zero_on_lines_70_and_72\n\
      else:\n  if resident_of_alberta_at_year_end:\n    if alberta_applicable_form_is_428mj:\n      ab428mj_line_20\
      \ + ab428mj_line_36\n    else:\n      ab428_line_63 + ab428_line_68\n  else:\n    if resident_of_british_columbia_at_year_end:\n\
      \      british_columbia_tax_excluding_foreign_tax_credit_and_additional_minimum_tax\n    else:\n      if (jurisdictions_tax_payable_count\
      \ > multiple_foreign_country_count_threshold):\n        section_428mj_tax_before_foreign_tax_credit_for_residence_jurisdiction\n\
      \      else:\n        form_428_tax_before_provincial_or_territorial_foreign_tax_credit"
    effective_to: '2025-12-31'
