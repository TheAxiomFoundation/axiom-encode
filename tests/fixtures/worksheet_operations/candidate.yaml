- name: provincial_territorial_2025_t2036_federal_credit_line_2
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: CRA Form T2036 2025 line 2 and note (1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: '(1) If you must pay minimum tax, follow the instructions below:

            (cid:129) If you were a resident of British Columbia at the end of the year, enter the amount from line
            3 of Form T2209 on line 2.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: '(cid:129) If you were a resident of Ontario at the end of the year, follow the instructions
            that apply to your situation:

            – If the total non-business income taxes you paid to all foreign countries is $200 or less:'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: '– If the total non-business income taxes you paid to all foreign countries is more than $200,
            you must calculate for

            each country:'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: '(cid:129) If you were a resident of another province or territory at the end of the year, enter
            the part of special foreign tax credit

            (line 11 of Part 4 of Form T691) that relates to non-business income taxes you paid to a foreign country
            for 2025 on

            line 2.'
      - path: versions[0].effective_from
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax credit for 2025 that you can deduct
            from the income tax
      - path: versions[0].effective_to
        kind: definition
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Use this form to calculate the foreign non-business income tax credit for 2025 that you can deduct
            from the income tax
      - kind: formula
        path: versions[0].formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/provincial-territorial-foreign-tax-credit
          excerpt: Enter the amount from line 3 of Form T2209, unless you have to pay minimum tax.(1)
  versions:
  - effective_from: '2025-01-01'
    formula: "if not minimum_tax_is_payable:\n  t2209_federal_non_business_foreign_tax_credit_line_3\nelse:\n  if\
      \ resident_of_british_columbia_at_year_end:\n    t2209_federal_non_business_foreign_tax_credit_line_3\n  else:\n\
      \    if resident_of_ontario_at_year_end:\n      if total_non_business_income_taxes_paid_to_all_foreign_countries\
      \ <= t2036_foreign_tax_threshold:\n        ontario_minimum_tax_single_country_special_credit\n      else:\n\
      \        ontario_minimum_tax_country_special_credit\n    else:\n      special_foreign_tax_credit_related_to_non_business_income"
    effective_to: '2025-12-31'
