  - name: middlesbrough_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Middlesbrough Council Council Tax Reduction Scheme 2026/27 paragraph 48.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-48
              excerpt: "48.1 Subject to paragraphs (2) to (4), the amount of a person’s maximum Council Tax Reduction in respect of a day for which he is liable to pay council tax, shall be 90 per cent, of the amount A divided by B where;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.90

