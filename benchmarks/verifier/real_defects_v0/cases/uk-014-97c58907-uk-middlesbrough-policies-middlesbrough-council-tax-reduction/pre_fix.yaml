module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-65
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Middlesbrough Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Middlesbrough’s 2026-27 working-age award is its Schedule 1 90/72/36/23/0-percent income-band grid applied to the paragraph 48.1 90-percent maximum. Capital above £10,000 ends entitlement except for the Schedule 3 paragraph 7 named-benefit full-capital disregard. The adopted award surface prints no tariff-income rule, taper, non-dependant deduction, or minimum-award floor.
  deferred_outputs:
    - output: uk-middlesbrough:policies/middlesbrough/council-tax-reduction/sections-11-to-24-and-schedules-2-and-4#assessed_weekly_net_income
      reason: The working-age grid consumes weekly net income after the scheme’s income, earnings, Universal Credit, disregard, self-employment, and child-care calculations; those detailed assessment rules are outside this award-surface module.
    - output: uk-middlesbrough:policies/middlesbrough/council-tax-reduction/sections-25-to-34-and-schedule-3-except-paragraphs-7-and-8#capital_after_other_disregards_for_year
      reason: This module applies the local £10,000 capital cliff and the Schedule 3 paragraphs 7 and 8 passported-capital disregards after the scheme’s valuation, attribution, notional-capital, and other capital-disregard calculations.
    - output: uk-middlesbrough:policies/middlesbrough/council-tax-reduction/schedule-3-paragraph-8#joint_claim_couple_status
      reason: The paragraph 8 full-capital-disregard branch consumes the source-defined joint-claim-couple classification; the partner income-based-JSA fact is modeled directly with the shared household benefit-status inputs.
    - output: uk-middlesbrough:policies/middlesbrough/council-tax-reduction/paragraphs-48.2-to-48.4#maximum_eligible_liability_for_year
      reason: This module consumes the source-defined liability after statutory discounts and joint-liability apportionment; dwelling charge calculation and liability allocation are outside this award surface.
    - output: uk-middlesbrough:policies/middlesbrough/council-tax-reduction/class-d-c-to-e#residency_absence_and_exclusion_conditions
      reason: This module consumes the Class D resident-liability, absence, and prescribed-class eligibility determination; its fact-intensive classification is outside the locally parameterised award calculation.
    - output: uk-middlesbrough:policies/middlesbrough/council-tax-reduction/paragraph-48.1#number_of_days_in_financial_year
      reason: The maximum is defined daily using the number of days in the financial year; this module consumes the calendar-day count for the award period rather than inventing a fixed annual-week constant.
    - output: uk-middlesbrough:policies/middlesbrough/council-tax-reduction/paragraphs-48.6-and-58.5-to-58.9#chargeable_non_dependant_deduction_units
      reason: The flat per-unit deduction is encoded, while joint-liability apportionment, couple coordination, disability protection, benefit, student, absence, armed-forces, and Universal Credit no-earned-income exemption classification are deferred as the source-defined deduction-unit input.
    - output: uk-middlesbrough:policies/middlesbrough/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age alternative maximum Council Tax Reduction is outside this working-age local award surface.

