  - name: middlesbrough_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Middlesbrough Council Council Tax Reduction Scheme 2026/27 working-age eligibility and Schedule 1 capital condition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "The authority is required to specify a scheme for working age and therefore this scheme only applies to a person who;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-65
              excerpt: "4. Discount bands vary depending on both weekly income and the household (family as defined within this scheme). Any applicant and any partner whose capital is greater than £10,000 shall not be entitled to any Council Tax Reduction whatsoever including where the authority determines that 8 below applies, but not where 7 only applies."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "(c) be liable to pay council tax in respect of a dwelling in which he is solely or mainly resident;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "(d) is not deemed to be absent from the dwelling;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "(e) not fall within a class of person prescribed for the purposes of paragraph 2(9) of Schedule 1A to the Local Government Finance Act 1992 and excluded from the authority’s scheme;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          middlesbrough_council_tax_reduction_working_age_scheme_applies
          and middlesbrough_council_tax_reduction_capital_eligible
          and middlesbrough_council_tax_reduction_class_d_residency_absence_and_exclusion_conditions_met

