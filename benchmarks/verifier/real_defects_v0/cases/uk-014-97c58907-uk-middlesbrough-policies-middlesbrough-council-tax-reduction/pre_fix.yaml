  - name: middlesbrough_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Middlesbrough Council Council Tax Reduction Scheme 2026/27 paragraphs 1.6 and 1.7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "The authority is required to specify a scheme for working age and therefore this scheme only applies to a person who;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-middlesbrough/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "has made a valid application for reduction."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_middlesbrough
          and council_tax_reduction_household_in_england
          and middlesbrough_council_tax_reduction_applicant_is_in_working_age_class
          and would_claim_council_tax_reduction

  - name: middlesbrough_council_tax_reduction_applicant_or_partner_receives_schedule_3_paragraph_7_qualifying_benefit
