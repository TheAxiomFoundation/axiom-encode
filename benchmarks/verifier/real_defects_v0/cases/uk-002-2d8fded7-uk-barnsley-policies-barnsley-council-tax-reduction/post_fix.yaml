              excerpt: "have capital not exceeding £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          barnsley_council_tax_reduction_assessed_capital_for_year <= barnsley_council_tax_reduction_capital_limit

  - name: barnsley_council_tax_reduction_protected_group
    kind: derived
    entity: Household
    dtype: Judgment
    period: Week
    source: Barnsley Council Tax Reduction Scheme 2026-2027 Appendix 3
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: condition
            source:
              corpus_citation_path: uk-barnsley/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "These are applicants who are in receipt of certain types of disability income49, have no earnings and fall within the band 1 income from the table above."
          - path: 'versions[0].formula'
            kind: parameter_table
            source:
              corpus_citation_path: uk-barnsley/manual/council-tax-reduction-scheme-2026-2027/page-53
              excerpt: "The income bands reflect household status (single, couple, one or two children)."
              table:
                header: Working-age income bands
                row_key: household status
                column_key: income range
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          barnsley_council_tax_reduction_receives_qualifying_disability_income and barnsley_council_tax_reduction_has_no_earnings and barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_band_1_upper_income_weekly_by_household_category[barnsley_council_tax_reduction_household_income_category]

  - name: barnsley_council_tax_reduction_income_band
    kind: derived
    entity: Household
    dtype: Number
    period: Week
    source: Barnsley Council Tax Reduction Scheme 2026-2027 Appendix 3
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: parameter_table
            source:
              corpus_citation_path: uk-barnsley/manual/council-tax-reduction-scheme-2026-2027/page-53
              excerpt: "The percentage amount of reduction awarded depends on where the applicant’s income, as calculated below, falls in the income ranges listed in the table."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if barnsley_council_tax_reduction_household_income_category == 0: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_band_1_upper_income_weekly_by_household_category[barnsley_council_tax_reduction_household_income_category]: 1 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_single_band_2_upper_income_weekly: 2 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_single_band_3_upper_income_weekly: 3 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_single_band_4_upper_income_weekly: barnsley_council_tax_reduction_band_4_code else: 0 else: if barnsley_council_tax_reduction_household_income_category == 1: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_band_1_upper_income_weekly_by_household_category[barnsley_council_tax_reduction_household_income_category]: 1 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_couple_band_2_upper_income_weekly: 2 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_couple_band_3_upper_income_weekly: 3 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_couple_band_4_upper_income_weekly: barnsley_council_tax_reduction_band_4_code else: 0 else: if barnsley_council_tax_reduction_household_income_category == 2: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_band_1_upper_income_weekly_by_household_category[barnsley_council_tax_reduction_household_income_category]: 1 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_family_one_child_band_2_upper_income_weekly: 2 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_family_one_child_band_3_upper_income_weekly: 3 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_family_one_child_band_4_upper_income_weekly: barnsley_council_tax_reduction_band_4_code else: 0 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_band_1_upper_income_weekly_by_household_category[barnsley_council_tax_reduction_household_income_category]: 1 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_family_two_plus_children_band_2_upper_income_weekly: 2 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_family_two_plus_children_band_3_upper_income_weekly: 3 else: if barnsley_council_tax_reduction_weekly_assessed_income <= barnsley_council_tax_reduction_family_two_plus_children_band_4_upper_income_weekly: barnsley_council_tax_reduction_band_4_code else: 0

  - name: barnsley_council_tax_reduction_selected_support_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Week
    source: Barnsley Council Tax Reduction Scheme 2026-2027 Appendix 3
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: parameter_table
            source:
              corpus_citation_path: uk-barnsley/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "1 90% Applied to protected groups (see below) 85% £98.05 £153.92 £241.80 £329.68 2 70% £145.56 £201.43 £289.31 £377.19 3 50% £193.07 £248.94 £336.82 £424.70 4 25% £240.58 £296.45 £384.33 £472.21 No Discount"
              table:
                header: Working-age income bands
                row_key: income band and protected status
                column_key: discount
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if barnsley_council_tax_reduction_protected_group: barnsley_council_tax_reduction_maximum_support_rate else: barnsley_council_tax_reduction_support_rate_by_income_band[barnsley_council_tax_reduction_income_band]

