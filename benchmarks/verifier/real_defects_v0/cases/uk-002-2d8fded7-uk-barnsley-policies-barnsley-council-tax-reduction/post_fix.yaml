format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-barnsley/manual/council-tax-reduction-scheme-2026-2027/page-52
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Barnsley Metropolitan Borough Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Barnsley's 2026-27 working-age award is an income-banded percentage of liability, not a taper calculation. Households receiving qualifying disability income, with no earnings, receive 90% while within their household type's Band 1 ceiling; ordinary Bands 1-4 receive 85%, 70%, 50%, and 25%, with no discount above the last band. Capital above £6,000 ends entitlement and each applicable non-dependant reduces the award by £7.50 weekly. Pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-barnsley:policies/barnsley/council-tax-reduction/appendix-3#weekly_assessed_income
      reason: This module consumes the scheme's assessed weekly income; earnings, unearned income, Universal Credit treatment, disregards, childcare, and the minimum-income-floor calculation are outside its award surface.
    - output: uk-barnsley:policies/barnsley/council-tax-reduction/appendix-3#household_income_band_category
      reason: This module consumes household status, qualifying-disability-income status, and no-earnings status; the detailed disability-income classifier and child responsibility are outside its award surface.
    - output: uk-barnsley:policies/barnsley/council-tax-reduction/paragraphs-32-to-40#assessed_capital
      reason: This module applies the £6,000 working-age capital cliff; valuation, attribution, notional capital, and disregard rules are outside it.
    - output: uk-barnsley:policies/barnsley/council-tax-reduction/paragraphs-46-to-54#applicable_non_dependant_count
      reason: This module applies the printed flat deduction; non-dependant status, exemptions, couples, and joint-liability apportionment are outside it.
rules:
  - name: barnsley_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Barnsley Council Tax Reduction Scheme 2026-2027 paragraph 41
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: amount
            source:
              corpus_citation_path: uk-barnsley/manual/council-tax-reduction-scheme-2026-2027/page-11
              excerpt: "For any day for which a working-age applicant is liable to pay council tax, the maximum amount of council tax reduction is 90%"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.90

