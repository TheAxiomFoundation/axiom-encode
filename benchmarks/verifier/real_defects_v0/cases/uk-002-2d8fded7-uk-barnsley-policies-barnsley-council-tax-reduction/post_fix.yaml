              corpus_citation_path: uk-barnsley/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "This appendix applies to all working-age applicants, including those who have been awarded Universal Credit."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_barnsley and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: barnsley_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Barnsley Council Tax Reduction Scheme 2026-2027 Appendix 3
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: condition
            source:
