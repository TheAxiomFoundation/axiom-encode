format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-46
  summary: |-
    Worthing's 2026/27 adopted working-age scheme is operative from 1 April 2026. Its standard working-age maximum is 100 percent of eligible weekly liability less non-dependant deductions, and the Class E award deducts the excess-income taper from that defined maximum. The daily taper printed as 2 6/7 percent is converted to a weekly rate only by multiplying by the printed seven-day denominator. Capital over £16,000 is an exclusion, while £1 weekly tariff income applies for each started £250 above £6,000 up to the capital limit. The corpus has no printed minimum-award floor or council-tax-band cap. Paragraph 30.0(2)(a) cross-references paragraph 58.1(b), a child-care provision, for the remunerative non-dependant row below £279; it therefore supplies no printed monetary amount for that row. This active module encodes every printed amount and carries that one source-defective amount, the paragraph 10 hours/exception classifier, and the couple-coordination selection as self-scoped boundary outputs rather than inferring a rate. Pension-age provisions are outside this working-age module.
  deferred_outputs:
    - output: uk-worthing:policies/worthing/council-tax-reduction/applicable-amount#weekly_applicable_amount
      reason: The personal allowances, premiums, components, and transitional additions used to calculate the applicable amount are outside this award-surface module.
    - output: uk-worthing:policies/worthing/council-tax-reduction/income#weekly_assessed_income
      reason: Detailed income calculation, disregards, attribution, and childcare deductions are outside this award-surface module.
    - output: uk-worthing:policies/worthing/council-tax-reduction/capital#assessed_capital_after_schedule_7_disregards
      reason: Detailed capital valuation and the Schedule 7 disregard classifier are outside this award-surface module; the capital input is post-disregard.
    - output: uk-worthing:policies/worthing/council-tax-reduction/non-dependant-deduction#exemption_classifier
      reason: The detailed claimant/partner and non-dependant exemption classifications in paragraph 30.0(6)-(8) are accepted through an input rather than reproduced here.
    - output: uk-worthing:policies/worthing/council-tax-reduction/non-dependant-deduction#low_remunerative_income_weekly_deduction
      reason: Paragraph 30.0(2)(a) directs the below-£279 remunerative row to paragraph 58.1(b), which is a child-care provision and does not print a monetary deduction.
    - output: uk-worthing:policies/worthing/council-tax-reduction/remunerative-work#hours_and_exception_classifier
      reason: Paragraph 10's fluctuating-hours averaging, absence treatment, and exceptions in sub-paragraphs (2)-(8) are accepted through factual inputs before the 16-hour and paid-work test.
    - output: uk-worthing:policies/worthing/council-tax-reduction/non-dependant-deduction#household_selection_after_couple_coordination
      reason: Paragraph 30.0(3)'s one-deduction and higher-amount coordination for couples and polygamous marriages is supplied through a selection input before the household aggregation.
    - output: uk-worthing:policies/worthing/council-tax-reduction/paragraph-29-1a#protected_class_maximum_council_tax_reduction
      reason: Paragraph 29.0 refers to protection within 29.1A, but the adopted corpus contains no paragraph 29.1A definition, class, or alternate rate to encode.
    - output: uk-worthing:policies/worthing/council-tax-reduction/second-adult#alternative_maximum_council_tax_reduction
      reason: Class F's separate alternative maximum reduction is outside this Class D and E working-age main-award surface.
rules:
  - name: worthing_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 29.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "that person's maximum council tax reduction amount in respect of a day is 100 per cent of the amount A/B where:"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: worthing_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    period: Day
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 14.0(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-25
              excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.0285714285714285714285714286

  - name: worthing_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 30.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "£15.95 x 1/7;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: worthing_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 14.0(f)(ii), weekly equivalent derived from the printed daily rate
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-25
              excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "£15.95 x 1/7;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          worthing_council_tax_reduction_daily_taper_rate * worthing_council_tax_reduction_days_per_week

  - name: worthing_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 23.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-34
              excerpt: "The class of person described in this paragraph consists of any person whose capital exceeds £16,000."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          16000

  - name: worthing_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 72.0(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: worthing_council_tax_reduction_tariff_income_capital_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 72.0(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          250

  - name: worthing_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 72.0
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: worthing_council_tax_reduction_remunerative_work_hours
    kind: parameter
    dtype: Number
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 10.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "not less than 16 hours a week"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          16

  - name: worthing_council_tax_reduction_non_dependant_low_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 30.0(2)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b);"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          279

  - name: worthing_council_tax_reduction_non_dependant_middle_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 30.0(2)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          485

  - name: worthing_council_tax_reduction_non_dependant_high_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 30.0(2)(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          605

  - name: worthing_council_tax_reduction_non_dependant_weekly_deduction_by_resolved_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: worthing_council_tax_reduction_non_dependant_resolved_deduction_band
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 30.0(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              table:
                header: "30.0 Non-dependant deductions"
                row_key: "adult non-dependant status and normal gross weekly income"
                column_key: "weekly deduction"
              excerpt: "(1) Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. (2) In the case of a non-dependant aged 18 or over to whom paragraph 30.1(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7"
          - path: versions[0].values
            kind: exception
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: "No deduction is to be made in respect of a non-dependant if:"
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 5.20
          3: 10.60
          4: 13.30
          5: 15.95

  - name: worthing_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 section 1.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-8
              excerpt: "The adopted scheme for working age applicants is a means test, which compares income against an assessment of applicable amounts (unless otherwise stated)."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_worthing and council_tax_reduction_household_in_england and worthing_council_tax_reduction_applicant_is_in_working_age_class

  - name: worthing_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 23.0
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-34
              excerpt: "The class of person described in this paragraph consists of any person whose capital exceeds £16,000."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          worthing_council_tax_reduction_assessed_capital <= worthing_council_tax_reduction_capital_limit

  - name: worthing_council_tax_reduction_tariff_income_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 72.0
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000;"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "£1 for any excess which is not a complete £250."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if worthing_council_tax_reduction_capital_eligible: worthing_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, worthing_council_tax_reduction_assessed_capital - worthing_council_tax_reduction_tariff_income_threshold) / worthing_council_tax_reduction_tariff_income_capital_step) else: 0

  - name: worthing_council_tax_reduction_income_including_tariff_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 57.0(1)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-57
              excerpt: "by adding to that amount, the weekly income calculated under paragraph 72 (tariff income);"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          worthing_council_tax_reduction_assessed_income_weekly + worthing_council_tax_reduction_tariff_income_weekly

  - name: worthing_council_tax_reduction_excess_income_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 14.0(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-25
              excerpt: "difference between his income for the relevant week and his applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, worthing_council_tax_reduction_income_including_tariff_weekly - worthing_council_tax_reduction_applicable_amount_weekly)

  - name: worthing_council_tax_reduction_income_taper_deduction_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 14.0(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-25
              excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          worthing_council_tax_reduction_excess_income_weekly * worthing_council_tax_reduction_weekly_taper_rate

  - name: worthing_council_tax_reduction_maximum_weekly_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 29.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "that person's maximum council tax reduction amount in respect of a day is 100 per cent of the amount A/B where:"
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "less any deductions in respect of non-dependants"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, worthing_council_tax_reduction_eligible_liability_weekly * worthing_council_tax_reduction_maximum_support_rate - worthing_council_tax_reduction_non_dependant_deductions_weekly)

  - name: worthing_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Week
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraphs 13.0, 14.0, and 23.0
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-25
              excerpt: "whose income (if any) for the relevant week is less than his applicable amount,"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-25
              excerpt: "whose income for the relevant week is greater than his applicable amount;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-25
              excerpt: "in respect of whom amount A exceeds amount B where—"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-25
              excerpt: "who has made an application."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          worthing_council_tax_reduction_working_age_scheme_applies and would_claim_council_tax_reduction and worthing_council_tax_reduction_capital_eligible and (worthing_council_tax_reduction_income_including_tariff_weekly < worthing_council_tax_reduction_applicable_amount_weekly or (worthing_council_tax_reduction_income_including_tariff_weekly > worthing_council_tax_reduction_applicable_amount_weekly and worthing_council_tax_reduction_maximum_weekly_amount > worthing_council_tax_reduction_income_taper_deduction_weekly))

  - name: worthing_council_tax_reduction_weekly_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraphs 32.0(2)-(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-5
              excerpt: "is effective from 1st April 2026 for a period of one financial year."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-46
              excerpt: "Where the person is within class D, that amount is the amount which is the maximum council tax reduction in respect of the day in the applicant's case."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-46
              excerpt: "Where the person is within class E, that amount is the amount found by deducting amount B from amount A,"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if worthing_council_tax_reduction_award_conditions_met: max(0, worthing_council_tax_reduction_maximum_weekly_amount - worthing_council_tax_reduction_income_taper_deduction_weekly) else: 0

  - name: worthing_council_tax_reduction_non_dependant_in_remunerative_work
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 10.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "not less than 16 hours a week"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          worthing_council_tax_reduction_non_dependant_weekly_hours >= worthing_council_tax_reduction_remunerative_work_hours

  - name: worthing_council_tax_reduction_non_dependant_deduction_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 30.0(1), (6)-(8)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "in respect of a non-dependant aged 18 or over"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: "No deduction is to be made in respect of a non-dependant if:"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          worthing_council_tax_reduction_is_adult_non_dependant and not worthing_council_tax_reduction_non_dependant_is_exempt

  - name: worthing_council_tax_reduction_low_remunerative_income_cross_reference_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: Worthing Borough Council Tax Reduction Scheme 2026/27 paragraph 30.0(2)(a)
    metadata:
