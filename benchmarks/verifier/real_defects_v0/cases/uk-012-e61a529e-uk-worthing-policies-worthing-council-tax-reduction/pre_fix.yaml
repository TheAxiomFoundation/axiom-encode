        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-worthing/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b);"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          worthing_council_tax_reduction_non_dependant_deduction_applies and worthing_council_tax_reduction_non_dependant_in_remunerative_work and worthing_council_tax_reduction_non_dependant_normal_gross_weekly_income < worthing_council_tax_reduction_non_dependant_low_income_threshold

  - name: worthing_council_tax_reduction_non_dependant_resolved_deduction_band
    kind: derived
    entity: Person
    dtype: Integer
    period: Week
