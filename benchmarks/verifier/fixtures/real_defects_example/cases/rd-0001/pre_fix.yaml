format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-de/statute/30/1102
  summary: Tax table method applies to individuals whose tax table income does not exceed $60,000.
rules:
- name: statutory_tax_table_income_ceiling
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: 1102(d)
  versions:
  - effective_from: '0001-01-01'
    formula: '60000'
- name: tax_table_method_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: 1102(d)
  versions:
  - effective_from: '0001-01-01'
    formula: tax_table_income < statutory_tax_table_income_ceiling and not individual_is_estate_or_trust
