name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Install the versions uv.lock pins, as every production workflow does,
      # so tests never pass on a floated dependency.
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Check changelog fragments
        run: .venv/bin/python -m towncrier build --draft --version 0.0.0

      - name: Run tests
        run: .venv/bin/pytest tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: Set up Python
        run: uv python install 3.13

      # Lint with the ruff version uv.lock pins, not the index's latest release.
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Lint
        run: .venv/bin/ruff check src/ tests/

      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
