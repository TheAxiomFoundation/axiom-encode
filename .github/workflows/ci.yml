name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Install the versions uv.lock pins, as every production `uv sync --locked`
      # does, so tests never pass on a floated dependency.
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Check the environment is the locked set
        run: >-
          .venv/bin/pytest -q -o addopts=''
          tests/test_workflow_toolchain_pins.py::test_the_test_environment_is_exactly_the_locked_set

      - name: Check changelog fragments
        run: .venv/bin/python -m towncrier build --draft --version 0.0.0

      # The real-engine and real-core jobs run the tests that execute the
      # engine and the core CLI.
      - name: Run tests
        run: .venv/bin/pytest tests/ -m "not real_engine and not real_core"

  real-engine:
    # Tests that execute the real axiom-rules-engine (tests/real_engine.py),
    # against an engine built from the pinned commit. The test job has no
    # engine and deselects them; with AXIOM_REQUIRE_REAL_ENGINE=1 a missing,
    # unusable or unpinned engine fails them here instead of skipping them.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The engine rulespec-us's reviewed workflow toolchain validates with
      # (.axiom/workflow-toolchain.toml axiom_rules_engine_ref), also pinned by
      # issue233-canada-source-diagnostic.yml. The tests check the checkout is
      # clean at this commit and the binary carries a receipt for it.
      AXIOM_RULES_ENGINE_REF: 89571cc2a938707fd60a5489b951135345697296

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Check the environment is the locked set
        run: >-
          .venv/bin/pytest -q -o addopts=''
          tests/test_workflow_toolchain_pins.py::test_the_test_environment_is_exactly_the_locked_set

      # Outside the workspace, so the encoder checkout stays clean.
      - name: Check out the pinned axiom-rules-engine
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/axiom-rules-engine"
          git init -q "$engine"
          git -C "$engine" fetch -q --depth=1 \
            https://github.com/TheAxiomFoundation/axiom-rules-engine.git \
            "$AXIOM_RULES_ENGINE_REF"
          git -C "$engine" checkout -q --detach FETCH_HEAD
          test "$(git -C "$engine" rev-parse HEAD)" = "$AXIOM_RULES_ENGINE_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # Dependencies only: rust-cache never caches workspace crates, so the
      # engine binary itself is compiled below from the pinned checkout on
      # every run and no cached executable stands in for it.
      - name: Cache the engine's cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ runner.temp }}/axiom-rules-engine

      # engine-bind builds with `cargo build --release --locked`, re-checks the
      # checkout is clean at the pin afterwards, and writes the receipt that
      # binds the binary's bytes to the commit; the tests verify it.
      - name: Build and bind the pinned engine
        run: >-
          .venv/bin/axiom-encode engine-bind
          --axiom-rules-engine-path "$RUNNER_TEMP/axiom-rules-engine"
          --pin "$AXIOM_RULES_ENGINE_REF"

      - name: Run real-engine tests
        env:
          AXIOM_REQUIRE_REAL_ENGINE: "1"
          AXIOM_RULES_ENGINE_ROOT: ${{ runner.temp }}/axiom-rules-engine
        run: .venv/bin/pytest tests/ -m real_engine

  real-core:
    # The cross-repository export tests (tests/real_core.py), against an
    # axiom-core CLI compiled from the pinned commit in this run. The test job
    # has no core and deselects them; with AXIOM_REQUIRE_REAL_CORE=1 a missing,
    # unusable or unpinned core fails them here instead of skipping them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # axiom-core main since 2026-09-17 (#4). Core's own encoder-interop job
      # ran these tests at this commit against encoder 629b8f9f, the last
      # commit to change them before this job existed: 6 passed, no skips
      # (axiom-core run 35266183509). It differs from 8ac3a54f, where that job
      # was reviewed, only in its license. The tests check that the binary sits
      # at the build path of a checkout clean at this commit and reports that
      # checkout's Cargo.lock digest.
      AXIOM_CORE_REF: d989fb08c58ec401612e01e4a5af72a07aa83b07

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Check the environment is the locked set
        run: >-
          .venv/bin/pytest -q -o addopts=''
          tests/test_workflow_toolchain_pins.py::test_the_test_environment_is_exactly_the_locked_set

      # Outside the workspace, so the encoder checkout stays clean.
      - name: Check out the pinned axiom-core
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/axiom-core"
          git init -q "$core"
          git -C "$core" fetch -q --depth=1 \
            https://github.com/TheAxiomFoundation/axiom-core.git \
            "$AXIOM_CORE_REF"
          git -C "$core" checkout -q --detach FETCH_HEAD
          test "$(git -C "$core" rev-parse HEAD)" = "$AXIOM_CORE_REF"

      # The toolchain the pinned checkout's rust-toolchain.toml names.
      - name: Install core's Rust toolchain
        working-directory: ${{ runner.temp }}/axiom-core
        run: rustup toolchain install

      # Dependencies only, including the axiom-rules-engine revision core
      # links: with cache-workspace-crates left at its default (false),
      # rust-cache keeps no workspace crate, so the core binary is compiled
      # below from the pinned checkout on every run.
      - name: Cache core's cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ runner.temp }}/axiom-core

      - name: Build the pinned core
        working-directory: ${{ runner.temp }}/axiom-core
        run: cargo build --locked --bin axiom-core

      - name: Run real-core tests
        env:
          AXIOM_REQUIRE_REAL_CORE: "1"
          AXIOM_CORE_BIN: ${{ runner.temp }}/axiom-core/target/debug/axiom-core
        run: .venv/bin/pytest tests/ -m real_core

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: Set up Python
        run: uv python install 3.13

      # Lint with the ruff version uv.lock pins, not the index's latest release.
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Check the environment is the locked set
        run: >-
          .venv/bin/pytest -q -o addopts=''
          tests/test_workflow_toolchain_pins.py::test_the_test_environment_is_exactly_the_locked_set

      - name: Lint
        run: .venv/bin/ruff check src/ tests/

      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
