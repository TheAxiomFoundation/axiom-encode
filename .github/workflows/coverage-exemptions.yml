name: Coverage exemptions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stale-entries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
      - run: uv sync --locked --python 3.13 --extra dev
      - name: Fetch the pinned release
        env:
          CORPUS_ROOT: ${{ runner.temp }}/coverage-exemption-corpus
          RELEASE_NAME: us-rulespec-2026-08-08-obbb-alien-snap
          RELEASE_SHA256: 0d69a0cdbe024fc2276f3c261c00402bb0a47488ac5f482cc20bd3404980adbc
        run: |
          set -euo pipefail
          base="$(uv run --locked --no-sync python -c 'from axiom_encode.ci_parity import DEFAULT_RELEASE_BASE_URL; print(DEFAULT_RELEASE_BASE_URL)')"
          release_dir="$CORPUS_ROOT/releases/$RELEASE_NAME"
          mkdir -p "$release_dir"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 45 --max-filesize 67108864 --output "$release_dir/$RELEASE_SHA256.json" "$base/releases/$RELEASE_NAME/$RELEASE_SHA256.json"
      - name: Fetch the registry's corpus artifacts
        env:
          CORPUS_ROOT: ${{ runner.temp }}/coverage-exemption-corpus
          RELEASE_NAME: us-rulespec-2026-08-08-obbb-alien-snap
          RELEASE_SHA256: 0d69a0cdbe024fc2276f3c261c00402bb0a47488ac5f482cc20bd3404980adbc
        run: |
          uv run --locked --no-sync python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from axiom_encode.harness.coverage_exemptions import load_coverage_exemptions
          from scripts.propose_coverage_exemptions import load_release

          root = Path(os.environ["CORPUS_ROOT"])
          corpus = load_release(root, os.environ["RELEASE_NAME"], os.environ["RELEASE_SHA256"])
          listed = {entry.corpus_artifact for entry in load_coverage_exemptions()}
          for artifact in corpus.artifacts:
              if artifact.path not in listed:
                  continue
              destination = root / artifact.path
              destination.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  "curl", "--fail", "--silent", "--show-error",
                  "--connect-timeout", "10", "--max-time", "45",
                  "--max-filesize", str(artifact.byte_count),
                  "--output", str(destination),
                  f"https://raw.githubusercontent.com/TheAxiomFoundation/axiom-corpus/{corpus.release.git_commit}/{artifact.path}",
              ], check=True)
          PY
      - name: Refuse stale entries and check the exact corpus differential
        run: >-
          uv run --locked --no-sync python scripts/check_coverage_exemptions.py
          --release us-rulespec-2026-08-08-obbb-alien-snap
          --release-sha256 0d69a0cdbe024fc2276f3c261c00402bb0a47488ac5f482cc20bd3404980adbc
          --corpus-path "${{ runner.temp }}/coverage-exemption-corpus"
          --listed-artifacts-only
          --output "${{ runner.temp }}/coverage-exemptions-ledger.json"
