name: Encoder version bump

# Pull requests no longer pick an encoder version (axiom-encode#2048). After an
# encoder-affecting change reaches main, this workflow writes the next version
# into pyproject.toml, src/axiom_encode/__init__.py and uv.lock, compiles the
# changelog.d/ fragments into CHANGELOG.md, and opens a bump pull request with
# auto-merge on. Until that pull request merges, `--apply`, the provisioner and
# the re-encode workflow's early check refuse the unversioned head.
#
# The pull request is opened with ENCODER_VERSION_BUMP_TOKEN, not GITHUB_TOKEN:
# GitHub does not run workflows for pull requests that GITHUB_TOKEN opens, so
# the required checks would never report. The token needs contents and
# pull-requests write on this repository, and repository auto-merge must be on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encoder-version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Open the encoder version bump pull request
    if: github.repository == 'TheAxiomFoundation/axiom-encode'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout axiom-encode
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check for encoder changes that no bump covers
        id: check
        run: |
          python3 -I src/axiom_encode/version_provenance.py \
            check --repo . --ref HEAD --github-output "$GITHUB_OUTPUT"

      - name: Require the bump token
        if: steps.check.outputs.needs_bump == 'true'
        env:
          BUMP_TOKEN: ${{ secrets.ENCODER_VERSION_BUMP_TOKEN }}
        run: |
          if [ -z "$BUMP_TOKEN" ]; then
            echo "::error::ENCODER_VERSION_BUMP_TOKEN is not set; main has encoder changes that no version bump covers, and re-encodes refuse it until a bump merges."
            exit 1
          fi

      - name: Write the next version and changelog
        id: bump
        if: steps.check.outputs.needs_bump == 'true'
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          version="$(python3 -I src/axiom_encode/version_provenance.py bump --repo . --ref HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "automation/encoder-version-${version}-${base_sha:0:12}"
          git add -A pyproject.toml src/axiom_encode/__init__.py uv.lock CHANGELOG.md changelog.d
          git commit -m "Bump encoder version to ${version}"
          # The new commit must satisfy the same rule --apply enforces.
          python3 -I src/axiom_encode/version_provenance.py check --repo . --ref HEAD
          {
            echo "version=${version}"
            echo "base_sha=${base_sha}"
            echo "branch=automation/encoder-version-${version}-${base_sha:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump pull request with auto-merge
        if: steps.check.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.ENCODER_VERSION_BUMP_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BASE_SHA: ${{ steps.bump.outputs.base_sha }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          # A newer main supersedes any bump pull request still open: this one
          # compiles every fragment still on main, so close the older ones.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/encoder-version-")) | .number' |
            while read -r number; do
              gh pr close "$number" --repo "$GITHUB_REPOSITORY" --delete-branch \
                --comment "Superseded by the encoder version bump for main at ${BASE_SHA}."
            done
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Bump encoder version to ${VERSION}" \
            --body "Automated encoder version bump for main at ${BASE_SHA} (axiom-encode#2048). It changes only the version files, CHANGELOG.md and changelog.d/. Re-encodes refuse main until this merges.")"
          gh pr merge "$url" --auto --merge
