name: Validation effect

# Every encoder pull request declares how it changes RuleSpec validation
# (#2094): none, loosen or tighten. The RuleSpec drift run reads the
# declaration of each merged pull request to choose its scope.
#
# pull_request_target runs this file and the checker from the base branch, so
# a pull request can edit neither the job nor the script that judges it. The
# job checks out no pull request code, holds a read-only token, and reads the
# body only from the environment.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  declared:
    runs-on: ubuntu-latest
    steps:
      # Run the base branch's checker (never pull request code).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # github.sha is the newest base-branch commit, the same commit
          # as this workflow file; pull_request.base.sha can be older.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the declared validation effect
        # The body is untrusted text: pass it in the environment, never in
        # the script source.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ! -f scripts/check_validation_effect.py ]; then
            echo "::error::the base branch has no validation-effect checker"
            exit 1
          fi
          python3 -I scripts/check_validation_effect.py
