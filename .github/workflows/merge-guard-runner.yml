name: Merge guard runner (shadow)

# Run the content-bound merge guard on RuleSpec pull requests and report
# shadow verdicts, under change 3 of docs/content-bound-merge-guard.md section 8.
# Only workflow_dispatch starts this workflow; merging it starts no run.
# A recurring sweep needs a later reviewed trigger change.
#
# The gate job requires refs/heads/main and the value 'true' from
# vars.MERGE_GUARD_RUNNER_ENABLED. The vars context can supply organization
# values; the gate checks no repository-only origin. The gate has no
# environment. The run job requires the guard App's client ID through
# MERGE_GUARD_APP_CLIENT_ID and private key through MERGE_GUARD_APP_KEY, using
# the merge-guard environment. It relies on needs: gate without repeating
# the ref or switch checks.
#
# A rerun of only the run job can reuse the earlier gate result. Rollback
# requires both unsetting MERGE_GUARD_RUNNER_ENABLED and disabling this
# workflow. GitHub blocks reruns while the workflow stays disabled; unsetting
# the switch alone does not stop a rerun that reuses a successful gate.
# Actual same-name variable configuration and variable resolution during
# reruns remain unverified.
#
# dry-run, the default, prints verdicts without publishing check runs. Its
# token requests read access to checks. shadow can publish checks named
# "content-bound-merge-guard (shadow)", always with conclusion neutral.
# Keep that check out of required checks: GitHub accepts neutral as satisfying
# a required check. The runner offers no enforcing mode.
#
# Before anyone stores the guard App key or changes the runner switch,
# including for shadow mode, checklist step 1 requires Max to choose a
# mechanism and any complement, maintainers to implement the choice, and a
# fresh independent review to verify the whole key-exposure boundary.
# Options (a), (b) and (c), and any complement, remain unchosen. Options (a)
# and (b) need separate protection that prevents other workflows from
# selecting the key-bearing environment. Recording these prerequisites does
# not implement that protection or supply its evidence. Agents must not
# approve environment or signing gates.
#
# Restricting an environment to main limits refs, not which workflow or job
# selects it. The key-exposure boundary covers every job in any workflow
# that can select the environment, including new, replaced or modified
# workflows, dynamic selectors and who can land those workflows. It covers
# all pre-token steps and persistence, builds, installation, dependencies
# and their hooks, interpreter startup, __init__.py, the console entry point,
# signing_broker startup, the import closure and any code those steps leave
# on the runner. A write filter constrains its caller, not other code in the
# same job.
#
# The token action requests a token for one RuleSpec repository with the
# permissions below. Installation tokens expire after one hour. When it
# holds an unexpired token, the action's post-job cleanup attempts to revoke
# it. Requested scope, expiry and revocation limit that token. A holder of a
# valid App private key can mint tokens for any installation of that App,
# within each installation's granted repositories and permissions, while
# the key remains valid. One requested token does not restrict tokens the
# key holder mints independently.

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Country of the RuleSpec repository (us selects rulespec-us)"
        required: true
        default: us
        type: string
      pr:
        description: "Pull request number; leave empty to evaluate every open pull request to main"
        required: false
        default: ""
        type: string
      mode:
        description: "dry-run writes nothing; shadow writes a neutral check run"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - shadow

permissions:
  contents: read

concurrency:
  group: merge-guard-runner-${{ inputs.country }}
  cancel-in-progress: false

jobs:
  gate:
    name: Require main and the runner switch
    if: github.repository == 'TheAxiomFoundation/axiom-encode'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unless dispatched on main with the switch on
        env:
          REF: ${{ github.ref }}
          ENABLED: ${{ vars.MERGE_GUARD_RUNNER_ENABLED }}
          COUNTRY: ${{ inputs.country }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::The merge guard runner runs from refs/heads/main only; this dispatch is on $REF."
            exit 1
          fi
          if [ "$ENABLED" != "true" ]; then
            echo "::error::The merge guard runner is switched off: the repository variable MERGE_GUARD_RUNNER_ENABLED is not 'true'. See docs/content-bound-merge-guard.md section 8."
            exit 1
          fi
          # Whole-string matches. A per-line match (grep -x) admits a value
          # with a second line, and the token action splits its repository
          # list on newlines and commas.
          export LC_ALL=C
          if ! [[ "$COUNTRY" =~ ^[a-z]{2}$ ]]; then
            echo "::error::country must be two lowercase letters."
            exit 1
          fi
          if [ -n "$PR" ] && ! [[ "$PR" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::pr must be a pull request number or empty."
            exit 1
          fi

  run:
    name: Evaluate and report
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the guard App's client ID and private key; its branch rule must
    # allow only main.
    environment: merge-guard
    steps:
      - name: Require the guard App
        env:
          APP_CLIENT_ID: ${{ vars.MERGE_GUARD_APP_CLIENT_ID }}
          APP_KEY_SET: ${{ secrets.MERGE_GUARD_APP_KEY != '' }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ "$APP_KEY_SET" != "true" ]; then
            echo "::error::MERGE_GUARD_APP_CLIENT_ID or MERGE_GUARD_APP_KEY is not set in the merge-guard environment. The guard GitHub App must exist and be installed on the RuleSpec repository first (activation checklist step 1 of docs/content-bound-merge-guard.md)."
            exit 1
          fi

      - name: Checkout axiom-encode main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No uv cache: this job can read the App key, and a cache entry can be
      # written by any run on main.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: "false"

      - name: Install the locked encoder
        run: uv sync --no-config --locked --python 3.13 --extra api --no-dev

      - name: Create the guard App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_GUARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_GUARD_APP_KEY }}
          owner: TheAxiomFoundation
          repositories: rulespec-${{ inputs.country }}
          permission-checks: ${{ inputs.mode == 'shadow' && 'write' || 'read' }}
          permission-pull-requests: read
          permission-contents: read
          permission-actions: read

      - name: Evaluate and report
        env:
          MERGE_GUARD_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_GUARD_APP_CLIENT_ID: ${{ vars.MERGE_GUARD_APP_CLIENT_ID }}
          COUNTRY: ${{ inputs.country }}
          PR: ${{ inputs.pr }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then
            target=(--pr "$PR")
          else
            target=(--sweep)
          fi
          .venv/bin/axiom-encode merge-guard-run \
            --repository "rulespec-$COUNTRY" \
            "${target[@]}" \
            --mode "$MODE" | tee "$RUNNER_TEMP/merge-guard-report.json"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-guard-report
          path: ${{ runner.temp }}/merge-guard-report.json
          if-no-files-found: ignore
          retention-days: 14
