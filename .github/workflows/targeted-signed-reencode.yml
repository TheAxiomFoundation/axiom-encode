name: Targeted signed RuleSpec re-encode
run-name: "Targeted signed RuleSpec re-encode [${{ inputs.queue_id || 'adhoc' }}:${{ inputs.queue_item_id || 'adhoc' }}:${{ inputs.queue_item_generation_sha256 || 'adhoc' }}] ${{ inputs.citation }}"

on:
  workflow_dispatch:
    inputs:
      citation:
        description: Canonical corpus citation path
        required: true
        type: string
      country:
        description: Canonical RuleSpec country checkout (for rulespec-<country>)
        required: true
        default: us
        type: string
      rulespec_ref:
        description: Immutable main SHA, or allowlisted reviewed SHA (artifact-only unless its approved PR base is exact)
        required: true
        type: string
      pr_base_branch:
        description: Exact RuleSpec branch targeted when open_pr is true
        required: false
        default: main
        type: string
      corpus_ref:
        description: Immutable axiom-corpus commit SHA
        required: true
        type: string
      rules_engine_ref:
        description: Immutable axiom-rules-engine commit SHA
        required: true
        type: string
      review_finding:
        description: Validator or independent-review finding to address
        required: false
        type: string
      repair_run_id:
        description: Prior failed protected run whose final candidate is replayed as untrusted repair context
        required: false
        type: string
      source_bundle_json:
        description: JSON citation array, canonical_refresh_bundle object, or atomic-source-transaction/v2/v3 envelope for an independent refresh transaction
        required: false
        default: "[]"
        type: string
      existing_signed_imports_json:
        description: JSON array of tracked same-jurisdiction signed-v5 modules to reuse as direct imports
        required: false
        default: "[]"
        type: string
      replace_rulespec_path:
        description: Existing target, or unique canonical destination for a legacy replacement
        required: false
        type: string
      replace_legacy_rulespec_path:
        description: Exact noncanonical legacy primary replaced by a fresh model encode
        required: false
        type: string
      legacy_exact_dependent_rulespec_path:
        description: Exact v1/manual direct dependent migrated by canonical reference rewrite
        required: false
        type: string
      second_legacy_exact_dependent_rulespec_path:
        description: Second exact v1/manual direct dependent in the same atomic migration
        required: false
        type: string
      legacy_retained_successor_rulespec_paths_json:
        description: JSON array of legacy primaries removed for existing signed-v5 canonical successors
        required: false
        default: "[]"
        type: string
      dependent_citation:
        description: Direct dependent to re-encode atomically after a breaking target
        required: false
        type: string
      dependent_review_finding:
        description: Independent-review finding for the direct dependent
        required: false
        type: string
      second_dependent_citation:
        description: Second direct dependent to re-encode in the same signed change
        required: false
        type: string
      second_dependent_review_finding:
        description: Independent-review finding for the second direct dependent
        required: false
        type: string
      open_pr:
        description: Commit, push, and open a draft RuleSpec pull request
        required: false
        default: false
        type: boolean
      queue_id:
        description: Optional durable encoding queue identifier
        required: false
        type: string
      queue_item_id:
        description: Optional durable encoding queue item identifier
        required: false
        type: string
      queue_manifest_sha256:
        description: Optional SHA-256 of the durable queue manifest
        required: false
        type: string
      queue_item_generation_sha256:
        description: Optional stable SHA-256 identity of the queue item attempt
        required: false
        type: string
      queue_dispatcher_run_id:
        description: Dispatcher run that authorized this queue-target workflow run
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: targeted-signed-reencode-${{ github.actor == 'github-actions[bot]' && inputs.queue_id && inputs.queue_item_generation_sha256 || github.run_id }}
  cancel-in-progress: false

jobs:
  # Cost damper (axiom-encode#1495): blocks ad hoc re-dispatches of a
  # citation that keeps failing, before the protected environment consumes
  # an approval and before any model call. Ad hoc dispatches only — queue
  # runs skip it entirely so the guard can never stall a tranche, and the
  # queue machinery owns its own retry policy. Runs unprotected on purpose:
  # it reads public run history with the read-scoped token and signs
  # nothing. Tunables are repository variables, not inputs — the dispatch
  # input list sits at GitHub's hard cap of 25 (pinned by
  # tests/test_signing_supervisor.py).
  attempt_budget:
    name: Enforce failed-attempt budget
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
        && inputs.queue_id == ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout axiom-encode
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: axiom-encode
          persist-credentials: false

      - name: Enforce failed-attempt budget
        env:
          GH_TOKEN: ${{ github.token }}
          CITATION: ${{ inputs.citation }}
          QUEUE_ID: ${{ inputs.queue_id }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
          ATTEMPT_BUDGET: ${{ vars.ATTEMPT_BUDGET }}
          ATTEMPT_BUDGET_OVERRIDE: ${{ vars.ATTEMPT_BUDGET_OVERRIDE }}
          ATTEMPT_BUDGET_BY_CITATION_JSON: ${{ vars.ATTEMPT_BUDGET_BY_CITATION_JSON }}
        run: |
          python3 "$GITHUB_WORKSPACE/axiom-encode/scripts/enforce_attempt_budget.py"

  encode:
    name: Queue protected signed RuleSpec re-encode
    needs: attempt_budget
    # !cancelled() disables the implicit success() gate so a skipped
    # attempt_budget (queue dispatch) still admits encode; an explicit
    # failure (budget exhausted) or infrastructure failure of the guard
    # job blocks only ad hoc runs, which can always be re-dispatched.
    if: >-
      ${{
        !cancelled()
        && (
          needs.attempt_budget.result == 'success'
          || needs.attempt_budget.result == 'skipped'
        )
        && github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
        && (
          inputs.queue_id == ''
          || (
            github.actor == 'github-actions[bot]'
            && github.run_attempt == 1
          )
        )
      }}
    environment: production-signing
    runs-on: ubuntu-latest
    # A replacement with a composed source bundle performs a target preflight,
    # each source lane, and the final target validation serially. Keep the
    # fail-closed per-lane retry bounds, but allow enough wall time for all of
    # those bounded retries to finish.
    timeout-minutes: 240
    steps:
      - name: Checkout axiom-encode
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: axiom-encode
          fetch-depth: 0
          persist-credentials: false

      - name: Validate country routing input
        env:
          CITATION: ${{ inputs.citation }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          COUNTRY: ${{ inputs.country }}
          OPEN_PR: ${{ inputs.open_pr }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          QUEUE_DISPATCHER_RUN_ID: ${{ inputs.queue_dispatcher_run_id }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_ITEM_ID: ${{ inputs.queue_item_id }}
          QUEUE_ITEM_GENERATION_SHA256: ${{ inputs.queue_item_generation_sha256 }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
          RULES_ENGINE_REF: ${{ inputs.rules_engine_ref }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
        run: |
          set -euo pipefail
          python axiom-encode/scripts/prepare_signed_backfill.py \
            validate-country "$COUNTRY"
          python axiom-encode/scripts/prepare_signed_backfill.py \
            validate-queue-tracking "$QUEUE_ID" "$QUEUE_ITEM_ID" \
            "$QUEUE_MANIFEST_SHA256" "$QUEUE_ITEM_GENERATION_SHA256"
          if [ -n "$QUEUE_ID" ]; then
            if [ "$GITHUB_ACTOR" != "github-actions[bot]" ] || \
              [ "$GITHUB_RUN_ATTEMPT" != "1" ] || \
              [[ ! "$QUEUE_DISPATCHER_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "queue target must be created by an authenticated dispatcher" >&2
              exit 1
            fi
            python axiom-encode/scripts/prepare_signed_queue.py \
              validate-dispatch \
              "axiom-encode/data/encoding-queues/${QUEUE_ID}.json" \
              --queue-id "$QUEUE_ID" \
              --item-id "$QUEUE_ITEM_ID" \
              --manifest-sha256 "$QUEUE_MANIFEST_SHA256" \
              --item-generation-sha256 "$QUEUE_ITEM_GENERATION_SHA256" \
              --citation "$CITATION" \
              --country "$COUNTRY" \
              --rulespec-ref "$RULESPEC_REF" \
              --pr-base-branch "$PR_BASE_BRANCH" \
              --corpus-ref "$CORPUS_REF" \
              --rules-engine-ref "$RULES_ENGINE_REF" \
              --open-pr "$OPEN_PR"

            api_version="2026-03-10"
            dispatcher_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$QUEUE_DISPATCHER_RUN_ID"
            for _ in $(seq 1 60); do
              gh api \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/actions/runs/$QUEUE_DISPATCHER_RUN_ID" \
                > "$RUNNER_TEMP/queue-dispatcher-run.json"
              if jq -e '.status == "completed"' \
                "$RUNNER_TEMP/queue-dispatcher-run.json" > /dev/null; then
                break
              fi
              sleep 2
            done
            jq -e \
              --arg head_sha "$GITHUB_SHA" \
              --arg url "$dispatcher_run_url" '
                .status == "completed"
                and .conclusion == "success"
                and .event == "workflow_dispatch"
                and .head_branch == "main"
                and .head_sha == $head_sha
                and (.run_attempt | type) == "number"
                and .run_attempt >= 1
                and .html_url == $url
                and .path == ".github/workflows/dispatch-signed-snap-queue.yml"
              ' "$RUNNER_TEMP/queue-dispatcher-run.json" > /dev/null
            gh api --paginate --slurp \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$QUEUE_DISPATCHER_RUN_ID/jobs?filter=all&per_page=100" \
              > "$RUNNER_TEMP/queue-dispatcher-jobs.json"
            dispatcher_attempts="$(jq -r '.run_attempt' \
              "$RUNNER_TEMP/queue-dispatcher-run.json")"
            jq -e --argjson attempts "$dispatcher_attempts" '
              [.[].jobs[] | select(.name == "Dispatch protected SNAP queue")] as $jobs
              | ($jobs | length) == $attempts
              and ([range(1; $attempts + 1)] ==
                ([$jobs[].run_attempt] | sort))
              and all(
                $jobs[];
                if .run_attempt == 1
                then .status == "completed" and .conclusion == "success"
                else .status == "completed" and .conclusion == "skipped"
                end
              )
            ' "$RUNNER_TEMP/queue-dispatcher-jobs.json" > /dev/null
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$QUEUE_DISPATCHER_RUN_ID/artifacts?per_page=100" \
              > "$RUNNER_TEMP/queue-dispatcher-artifacts.json"
            archive_url="$(jq -er \
              --arg name "snap-queue-reconciliation-$QUEUE_DISPATCHER_RUN_ID" '
                [
                  .artifacts[]
                  | select(.name == $name and .expired == false)
                  | .archive_download_url
                ]
                | if length == 1 then .[0] else error("dispatcher artifact is unavailable") end
              ' "$RUNNER_TEMP/queue-dispatcher-artifacts.json")"
            gh api "$archive_url" > "$RUNNER_TEMP/queue-dispatcher.zip"
            mkdir "$RUNNER_TEMP/queue-dispatcher"
            unzip -q "$RUNNER_TEMP/queue-dispatcher.zip" \
              -d "$RUNNER_TEMP/queue-dispatcher"
            jq -e \
              --arg generation "$QUEUE_ITEM_GENERATION_SHA256" \
              --arg item_id "$QUEUE_ITEM_ID" \
              --arg manifest "$QUEUE_MANIFEST_SHA256" '
                .manifest_sha256 == $manifest
                and any(
                  .items[];
                  .id == $item_id
                  and .generation_sha256 == $generation
                  and .action == "dispatch"
                )
              ' "$RUNNER_TEMP/queue-dispatcher/snap-queue-plan.json" > /dev/null
            jq -e \
              --arg item_id "$QUEUE_ITEM_ID" \
              --arg run_id "$GITHUB_RUN_ID" '
                select(
                  .item_id == $item_id
                  and .workflow_run_attempt == 1
                  and .workflow_run_id == $run_id
                )
              ' "$RUNNER_TEMP/queue-dispatcher/dispatched-run-records.jsonl" \
              > /dev/null
          fi

      - name: Checkout canonical RuleSpec country
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/rulespec-${{ inputs.country }}
          ref: ${{ inputs.rulespec_ref }}
          path: rulespec-${{ inputs.country }}
          fetch-depth: 0
          token: ${{ secrets.AXIOM_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Checkout axiom-corpus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-corpus
          ref: ${{ inputs.corpus_ref }}
          path: axiom-corpus
          fetch-depth: 0
          token: ${{ secrets.AXIOM_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Checkout axiom-rules-engine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ inputs.rules_engine_ref }}
          path: axiom-rules-engine
          fetch-depth: 0
          token: ${{ secrets.AXIOM_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify immutable checkout identities
        env:
          COUNTRY: ${{ inputs.country }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
          OPEN_PR: ${{ inputs.open_pr }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          RULES_ENGINE_REF: ${{ inputs.rules_engine_ref }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          verify_checkout() {
            local label="$1"
            local requested="$2"
            local checkout="$3"
            if [[ ! "$requested" =~ $sha_pattern ]]; then
              echo "$label ref must be a full lowercase commit SHA" >&2
              exit 1
            fi
            actual="$(git -C "$checkout" rev-parse HEAD)"
            if [ "$actual" != "$requested" ]; then
              echo "$label checkout resolved to $actual, expected $requested" >&2
              exit 1
            fi
          }
          if [[ ! "$GITHUB_SHA" =~ $sha_pattern ]]; then
            echo "GITHUB_SHA must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git -C axiom-encode rev-parse HEAD)" = "$GITHUB_SHA"
          verify_checkout "rulespec-$COUNTRY" "$RULESPEC_REF" "$RULESPEC_CHECKOUT"
          verify_checkout axiom-corpus "$CORPUS_REF" axiom-corpus
          verify_checkout axiom-rules-engine "$RULES_ENGINE_REF" axiom-rules-engine
          test "$(git -C "$RULESPEC_CHECKOUT" remote get-url origin)" = \
            "https://github.com/TheAxiomFoundation/rulespec-$COUNTRY"
          python axiom-encode/scripts/prepare_signed_backfill.py \
            validate-rulespec-base "$RULESPEC_CHECKOUT" "$COUNTRY" \
            "$RULESPEC_REF" "$OPEN_PR" "$PR_BASE_BRANCH"
          git -C axiom-corpus merge-base --is-ancestor HEAD refs/remotes/origin/main
          git -C axiom-rules-engine merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: Set up Go 1.26.1
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.1
          cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Build Axiom rules engine
        working-directory: axiom-rules-engine
        run: |
          cargo build --release --locked
          test -x target/release/axiom-rules-engine

      - name: Install encoder
        working-directory: axiom-encode
        run: |
          uv sync --locked --python 3.13 --extra api
          rm -rf "$RUNNER_TEMP/axiom-verification-site-packages"
          uv pip install --python .venv/bin/python \
            --target "$RUNNER_TEMP/axiom-verification-site-packages" ".[api]"

      - name: Resolve trusted prior-run repair candidate
        id: repair_candidate
        if: ${{ inputs.repair_run_id != '' }}
        env:
          ATOMIC_SOURCE_JSON: ${{ inputs.source_bundle_json }}
          CITATION: ${{ inputs.citation }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          COUNTRY: ${{ inputs.country }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          EXISTING_SIGNED_IMPORTS_JSON: ${{ inputs.existing_signed_imports_json }}
          GH_TOKEN: ${{ github.token }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON: ${{ inputs.legacy_retained_successor_rulespec_paths_json }}
          QUEUE_ID: ${{ inputs.queue_id }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
          RULES_ENGINE_REF: ${{ inputs.rules_engine_ref }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
        run: |
          set -euo pipefail
          atomic_source_payload="$(
            axiom-encode/.venv/bin/python \
              axiom-encode/scripts/prepare_signed_backfill.py \
              split-atomic-source-input "${ATOMIC_SOURCE_JSON:-[]}"
          )"
          source_bundle_json="$(jq -cer '.source_bundle' \
            <<< "$atomic_source_payload")"
          canonical_refresh_bundle_json="$(jq -cer '.canonical_refresh_bundle' \
            <<< "$atomic_source_payload")"
          primary_required_test_cases_json="$(jq -cer \
            '.primary_required_test_cases' <<< "$atomic_source_payload")"
          repair_tests_only=false
          if jq -e 'type == "array" and length > 0' \
            <<< "$primary_required_test_cases_json" > /dev/null; then
            repair_tests_only=true
          elif ! jq -e 'type == "array" and length == 0' \
            <<< "$primary_required_test_cases_json" > /dev/null; then
            echo "primary required test cases must be a JSON array" >&2
            exit 1
          fi
          echo "tests_only=$repair_tests_only" >> "$GITHUB_OUTPUT"
          if [[ ! "$REPAIR_RUN_ID" =~ ^[0-9]+$ ]] || \
             [ "$REPAIR_RUN_ID" = "$GITHUB_RUN_ID" ]; then
            echo "repair_run_id must identify a different decimal workflow run" >&2
            exit 1
          fi
          # The supported transaction determines the replay lane. Derive its
          # canonical path rather than spending two additional dispatch inputs
          # or trusting a separately supplied path (GitHub permits at most 25).
          REPAIR_RUN_LANE=target
          repair_citation="$CITATION"
          repair_rulespec_path="$REPLACE_RULESPEC_PATH"
          if [ -n "$DEPENDENT_CITATION" ]; then
            REPAIR_RUN_LANE=dependent
            repair_citation="$DEPENDENT_CITATION"
            repair_rulespec_path="$(
              axiom-encode/.venv/bin/python \
                axiom-encode/scripts/prepare_signed_backfill.py \
                citation-rulespec-path "$DEPENDENT_CITATION"
            )"
          fi
          if [ -z "$REPLACE_RULESPEC_PATH" ] || \
             [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ] || \
             [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
             [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
             [ -n "$SECOND_DEPENDENT_CITATION" ] || \
             [ -n "$QUEUE_ID" ] || \
             ! jq -e 'type == "array" and length == 0' \
               <<< "$canonical_refresh_bundle_json" > /dev/null || \
             { jq -e 'length > 0' <<< "$source_bundle_json" > /dev/null && \
               jq -e 'length > 0' <<< "$primary_required_test_cases_json" \
                 > /dev/null; } || \
             ! jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' \
               <<< "${EXISTING_SIGNED_IMPORTS_JSON:-[]}" > /dev/null || \
             ! jq -e 'type == "array" and length == 0' \
               <<< "${LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON:-[]}" \
               > /dev/null; then
            echo "repair replay is limited to one non-legacy target and at most one direct dependent, with at most one exact source or test bundle, artifact-bound imports, and without refreshes, second dependents, or queue authorization" >&2
            exit 1
          fi

          api_version="2026-03-10"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN_ID" \
            > "$RUNNER_TEMP/repair-run.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$REPAIR_RUN_ID" '
              .id == $run_id
              and .status == "completed"
              and .conclusion == "failure"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .run_attempt == 1
              and .repository.full_name == $repository
              and .path == ".github/workflows/targeted-signed-reencode.yml"
            ' "$RUNNER_TEMP/repair-run.json" > /dev/null
          repair_encoder_commit="$(jq -er '.head_sha' \
            "$RUNNER_TEMP/repair-run.json")"
          git -C axiom-encode merge-base --is-ancestor \
            "$repair_encoder_commit" "$GITHUB_SHA"

          gh api --paginate --slurp \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN_ID/jobs?filter=all&per_page=100" \
            > "$RUNNER_TEMP/repair-jobs.json"
          jq -e '
            [.[].jobs[] | select(
              .name == "Queue protected signed RuleSpec re-encode"
              and .run_attempt == 1
              and .status == "completed"
              and .conclusion == "failure"
            )] | length == 1
          ' "$RUNNER_TEMP/repair-jobs.json" > /dev/null

          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/repair-artifacts.json"
          artifact_name="targeted-reencode-failure-${REPAIR_RUN_ID}-1"
          jq -e --arg name "$artifact_name" --argjson run_id "$REPAIR_RUN_ID" '
            [.artifacts[] | select(
              .name == $name
              and .expired == false
              and .workflow_run.id == $run_id
            )] | length == 1
          ' "$RUNNER_TEMP/repair-artifacts.json" > /dev/null
          repair_download="$RUNNER_TEMP/repair-download"
          mkdir "$repair_download"
          gh run download "$REPAIR_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$repair_download"
          repair_archive="$repair_download/targeted-reencode-failure.tar"
          test -f "$repair_archive" && test ! -L "$repair_archive"
          axiom-encode/.venv/bin/python axiom-encode/scripts/extract_repair_candidate.py \
            "$repair_archive" "$RUNNER_TEMP/repair-candidate" \
            --citation "$repair_citation" \
            --country "$COUNTRY" \
            --encoder-commit "$repair_encoder_commit" \
            --corpus-ref "$CORPUS_REF" \
            --rules-engine-ref "$RULES_ENGINE_REF" \
            --rulespec-ref "$RULESPEC_REF" \
            --allow-rulespec-base-advance \
            --atomic-source-json "$ATOMIC_SOURCE_JSON" \
            --existing-signed-imports-json "${EXISTING_SIGNED_IMPORTS_JSON:-[]}" \
            --repair-lane "$REPAIR_RUN_LANE" \
            --replace-rulespec-path "$repair_rulespec_path" \
            --transaction-citation "$CITATION" \
            --transaction-rulespec-path "$REPLACE_RULESPEC_PATH" \
            --workflow-run-id "$REPAIR_RUN_ID" \
            > "$RUNNER_TEMP/repair-candidate.json"
          jq -e '
            (.source_rulespec_ref | test("^[0-9a-f]{40}$"))
            and if .lane == "source-only" then
              .root == ""
              and .path == ""
              and .runner == ""
              and .rulespec_sha256 == ""
              and .tests_sha256 == ""
            else
              (.root | type == "string" and length > 0)
              and (.lane == "target" or .lane == "target-preflight" or .lane == "dependent")
              and (.path | type == "string" and length > 0)
              and (.rulespec_sha256 | test("^[0-9a-f]{64}$"))
              and (.tests_sha256 | test("^[0-9a-f]{64}$"))
            end
          ' "$RUNNER_TEMP/repair-candidate.json" > /dev/null
          repair_source_rulespec_ref="$(jq -er '.source_rulespec_ref' \
            "$RUNNER_TEMP/repair-candidate.json")"
          repair_candidate_path="$(jq -er '.path' \
            "$RUNNER_TEMP/repair-candidate.json")"
          if [ -n "$repair_candidate_path" ]; then
            axiom-encode/.venv/bin/python axiom-encode/scripts/verify_repair_base_advance.py \
              "$RULESPEC_CHECKOUT" \
              --country "$COUNTRY" \
              --source-ref "$repair_source_rulespec_ref" \
              --current-ref "$RULESPEC_REF" \
              --candidate-path "$repair_candidate_path" \
              --rulespec-path "$repair_rulespec_path"
          fi
          echo "lane=$(jq -r '.lane' "$RUNNER_TEMP/repair-candidate.json")" \
            >> "$GITHUB_OUTPUT"
          echo "rulespec_path=$repair_rulespec_path" >> "$GITHUB_OUTPUT"
          echo "root=$(jq -r '.root' "$RUNNER_TEMP/repair-candidate.json")" \
            >> "$GITHUB_OUTPUT"
          echo "path=$(jq -r '.path' "$RUNNER_TEMP/repair-candidate.json")" \
            >> "$GITHUB_OUTPUT"
          echo "runner=$(jq -r '.runner' "$RUNNER_TEMP/repair-candidate.json")" \
            >> "$GITHUB_OUTPUT"
          echo "source_rulespec_ref=$repair_source_rulespec_ref" \
            >> "$GITHUB_OUTPUT"
          echo "rulespec_sha256=$(jq -r '.rulespec_sha256' "$RUNNER_TEMP/repair-candidate.json")" \
            >> "$GITHUB_OUTPUT"
          echo "tests_sha256=$(jq -r '.tests_sha256' "$RUNNER_TEMP/repair-candidate.json")" \
            >> "$GITHUB_OUTPUT"

      - name: Validate atomic source inputs
        env:
          ATOMIC_SOURCE_JSON: ${{ inputs.source_bundle_json }}
          CITATION: ${{ inputs.citation }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          EXISTING_SIGNED_IMPORTS_JSON: ${{ inputs.existing_signed_imports_json }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON: ${{ inputs.legacy_retained_successor_rulespec_paths_json }}
          QUEUE_ID: ${{ inputs.queue_id }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
        run: |
          set -euo pipefail
          atomic_source_payload="$(
            axiom-encode/.venv/bin/python \
              axiom-encode/scripts/prepare_signed_backfill.py \
              split-atomic-source-input "${ATOMIC_SOURCE_JSON:-[]}"
          )"
          source_bundle_json="$(jq -cer '.source_bundle' \
            <<< "$atomic_source_payload")"
          canonical_refresh_bundle_json="$(jq -cer '.canonical_refresh_bundle' \
            <<< "$atomic_source_payload")"
          primary_required_test_cases_json="$(jq -cer \
            '.primary_required_test_cases' <<< "$atomic_source_payload")"
          canonical_refresh_primary_required_test_cases_json="$primary_required_test_cases_json"
          if [ -n "${REPAIR_RUN_ID:-}" ]; then
            canonical_refresh_primary_required_test_cases_json="[]"
          fi
          source_bundle_args=(
            axiom-encode/.venv/bin/python
            axiom-encode/scripts/prepare_signed_backfill.py
            parse-source-bundle "$source_bundle_json"
            --primary-citation "$CITATION"
          )
          if [ -n "$DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$DEPENDENT_CITATION")
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$SECOND_DEPENDENT_CITATION")
          fi
          normalized_source_bundle="$("${source_bundle_args[@]}")"
          axiom-encode/.venv/bin/python \
            axiom-encode/scripts/prepare_signed_backfill.py \
            validate-source-add-targets "$RULESPEC_CHECKOUT" \
            "$normalized_source_bundle" \
            --primary-citation "$CITATION" \
            --primary-rulespec-path "$REPLACE_RULESPEC_PATH" \
            > /dev/null
          normalized_canonical_refresh_bundle="$(
            axiom-encode/.venv/bin/python \
              axiom-encode/scripts/prepare_signed_backfill.py \
              parse-canonical-refresh-bundle "$RULESPEC_CHECKOUT" \
              "$canonical_refresh_bundle_json" \
              --primary-citation "$CITATION" \
              --primary-rulespec-path "$REPLACE_RULESPEC_PATH" \
              --primary-required-test-cases-json \
                "$canonical_refresh_primary_required_test_cases_json"
          )"
          existing_import_args=(
            axiom-encode/.venv/bin/python
            axiom-encode/scripts/prepare_signed_backfill.py
            parse-existing-signed-imports "$RULESPEC_CHECKOUT"
            "${EXISTING_SIGNED_IMPORTS_JSON:-[]}"
            --primary-citation "$CITATION"
          )
          while IFS= read -r source_citation; do
            existing_import_args+=(--source-citation "$source_citation")
          done < <(printf '%s\n' "$normalized_source_bundle" | jq -r '.[]')
          if [ -n "$DEPENDENT_CITATION" ]; then
            existing_import_args+=(--exclude-citation "$DEPENDENT_CITATION")
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            existing_import_args+=(--exclude-citation "$SECOND_DEPENDENT_CITATION")
          fi
          if ! printf '%s\n' "${LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON:-[]}" \
            | jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' \
              > /dev/null; then
            echo "retained successor paths must be a JSON array of non-empty strings" >&2
            exit 1
          fi
          retained_successor_paths=()
          while IFS= read -r retained_successor_path; do
            retained_successor_paths+=("$retained_successor_path")
          done < <(
            printf '%s\n' "${LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON:-[]}" \
              | jq -r '.[]'
          )
          for reserved_path in \
            "$REPLACE_RULESPEC_PATH" \
            "$REPLACE_LEGACY_RULESPEC_PATH" \
            "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" \
            "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" \
            "${retained_successor_paths[@]-}"; do
            if [ -n "$reserved_path" ]; then
              existing_import_args+=(--exclude-rulespec-path "$reserved_path")
            fi
          done
          normalized_existing_imports="$("${existing_import_args[@]}")"
          if [ "$normalized_canonical_refresh_bundle" != "[]" ] && \
            { [ "$normalized_source_bundle" != "[]" ] || \
              [ "$normalized_existing_imports" != "[]" ] || \
              [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ] || \
              [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
              [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
              [ "${#retained_successor_paths[@]}" -gt 0 ] || \
              [ -n "$DEPENDENT_CITATION" ] || \
              [ -n "$SECOND_DEPENDENT_CITATION" ] || \
              [ -n "$REPAIR_RUN_ID" ] || \
              [ -n "$QUEUE_ID" ]; }; then
            echo "canonical refresh bundles cannot mix with imports, composition bundles, legacy/dependent migration, repair replay, or queue authorization" >&2
            exit 1
          fi
          if [ "$normalized_source_bundle" != "[]" ] && \
             [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
            echo "source bundles require legacy replacements to merge first" >&2
            exit 1
          fi
          if [ "$normalized_source_bundle" != "[]" ] && \
             [ -n "$REPLACE_RULESPEC_PATH" ] && \
             { [ -n "$DEPENDENT_CITATION" ] || \
               [ -n "$SECOND_DEPENDENT_CITATION" ] || \
               [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
               [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
               [ "${#retained_successor_paths[@]}" -gt 0 ]; }; then
            echo "source-bundle replacements cannot include dependent migrations" >&2
            exit 1
          fi
          if [ -n "$QUEUE_ID" ] && \
            { [ "$normalized_canonical_refresh_bundle" != "[]" ] || \
              [ "$normalized_source_bundle" != "[]" ] || \
              [ "$normalized_existing_imports" != "[]" ]; }; then
            echo "queue-authorized re-encodes cannot add source inputs until queue generation identity binds them" >&2
            exit 1
          fi

      - name: Fetch pinned signed corpus release object
        shell: bash
        env:
          RELEASE_BASE_URL: https://pub-a8952f8657fc49fda358146ac001366c.r2.dev
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
        run: |
          set -euo pipefail
          materializer=axiom-encode/scripts/materialize_corpus_release.py
          toolchain="$RULESPEC_CHECKOUT/.axiom/toolchain.toml"
          mapfile -t release_pin < <(
            axiom-encode/.venv/bin/python "$materializer" pin --toolchain "$toolchain"
          )
          if [ "${#release_pin[@]}" -ne 2 ]; then
            echo "RuleSpec toolchain did not yield exactly one corpus release pin" >&2
            exit 1
          fi
          release_name="${release_pin[0]}"
          release_sha="${release_pin[1]}"
          if [ -n "$QUEUE_ID" ]; then
            axiom-encode/.venv/bin/python \
              axiom-encode/scripts/prepare_signed_queue.py \
              validate-release-pin \
              "axiom-encode/data/encoding-queues/${QUEUE_ID}.json" \
              --toolchain "$toolchain" \
              --manifest-sha256 "$QUEUE_MANIFEST_SHA256"
          fi
          response="$(mktemp "$RUNNER_TEMP/corpus-release-response.XXXXXX")"
          public_object="$(mktemp "$RUNNER_TEMP/corpus-release-object.XXXXXX")"
          trap 'rm -f "$response" "$public_object"' EXIT
          url="${RELEASE_BASE_URL%/}/releases/${release_name}/${release_sha}.json"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 16777216 \
            --output "$public_object" "$url"
          jq -ce '[{"release_object": .}]' "$public_object" > "$response"
          release_commit="$(axiom-encode/.venv/bin/python "$materializer" \
            materialize --toolchain "$toolchain" --response "$response" \
            --corpus-root axiom-corpus)"
          rm -f "$response" "$public_object"
          trap - EXIT
          if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Signed release provenance is not a full lowercase commit SHA" >&2
            exit 1
          fi
          git -C axiom-corpus merge-base --is-ancestor "$release_commit" HEAD || {
            echo "Pinned corpus checkout predates signed release provenance" >&2
            exit 1
          }

      - name: Provision protected signing supervisor
        id: provision_signing_supervisor
        working-directory: axiom-encode
        env:
          TRUST_APPLY_ROOT: ${{ vars.AXIOM_ENCODE_APPLY_SIGNING_PUBLIC_KEY }}
          TRUST_EVAL_ROOT: ${{ vars.AXIOM_ENCODE_EVAL_SIGNING_PUBLIC_KEY }}
          TRUST_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
          TRUST_RETIRED_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_RETIRED_PUBLIC_KEY }}
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-buildid=' \
            -o "$RUNNER_TEMP/axiom-encode-signing-supervisor" \
            ./cmd/axiom-encode-signing-supervisor
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-buildid=' \
            -o "$RUNNER_TEMP/axiom-encode-apply-signer" \
            ./cmd/axiom-encode-apply-signer
          sudo chown 0:0 /opt
          sudo chmod go-w /opt
          sudo rm -rf /opt/axiom-verification
          sudo .venv/bin/python scripts/provision_verification_supervisor.py \
            --destination /opt/axiom-verification \
            --supervisor "$RUNNER_TEMP/axiom-encode-signing-supervisor" \
            --site-packages "$RUNNER_TEMP/axiom-verification-site-packages" \
            --apply-root "$TRUST_APPLY_ROOT" \
            --eval-root "$TRUST_EVAL_ROOT" \
            --corpus-release-root "$TRUST_CORPUS_RELEASE_ROOT" \
            --retired-corpus-release-root "$TRUST_RETIRED_CORPUS_RELEASE_ROOT" \
            --git /usr/bin/git \
            --encoder-git-root "$GITHUB_WORKSPACE/axiom-encode" \
            --encoder-commit "$GITHUB_SHA" \
            --encoder-origin-repository github.com/TheAxiomFoundation/axiom-encode
          sudo install -o root -g root -m 0755 \
            "$RUNNER_TEMP/axiom-encode-apply-signer" \
            /opt/axiom-verification/axiom-encode-apply-signer
          sudo chown -R 0:0 /opt/axiom-verification
          sudo chmod -R go-w /opt/axiom-verification

      - name: Verify protected RuleSpec routing
        env:
          RULESPEC_CHECKOUT: ${{ github.workspace }}/rulespec-${{ inputs.country }}
        run: |
          set -euo pipefail
          trusted_path=/opt/axiom-verification/python/bin
          trusted_home=/opt/axiom-verification/python
          env -i PATH="$trusted_path" HOME="$trusted_home" \
            git -C "$RULESPEC_CHECKOUT" rev-parse --show-toplevel
          env -i PATH="$trusted_path" HOME="$trusted_home" \
            git -C "$RULESPEC_CHECKOUT" remote get-url origin
          interpreter="$(sed -n '1s/^#!\([^ ]*\).*/\1/p' \
            /opt/axiom-verification/axiom-encode)"
          env -i PATH="$trusted_path" HOME="$trusted_home" \
            "$interpreter" -I - "$RULESPEC_CHECKOUT" <<'PY'
          import ctypes
          import json
          import sys
          from pathlib import Path

          from axiom_encode.constants import RULESPEC_FILESYSTEM_ROOTS
          from axiom_encode.repo_routing import (
              canonical_rulespec_repo_name,
              inspect_canonical_rulespec_checkout,
          )
          from axiom_encode.signing_broker import _harden_signing_capability_process

          checkout = Path(sys.argv[1])
          structure = {
              "git_marker_is_symlink": (checkout / ".git").is_symlink(),
              "name": checkout.name,
              "path": str(checkout),
              "resolved_path": str(checkout.resolve()),
              "unexpected_root_entries": sorted(
                  name
                  for name in RULESPEC_FILESYSTEM_ROOTS - {"programs"}
                  if (checkout / name).exists() or (checkout / name).is_symlink()
              ),
          }

          def route_payload():
              inspection = inspect_canonical_rulespec_checkout(
                  checkout, allow_composition_specs=True
              )
              return {
                  "canonical_repo_name": canonical_rulespec_repo_name(checkout),
                  "rejection": inspection.rejection,
              }

          direct = route_payload()
          _harden_signing_capability_process(role="routing-probe")
          if sys.platform.startswith("linux"):
              libc = ctypes.CDLL(None, use_errno=True)
              if libc.prctl(38, 1, 0, 0, 0) != 0:
                  raise SystemExit("could not enable routing-probe no-new-privileges")
          hardened = route_payload()
          payload = {**structure, "direct": direct, "hardened": hardened}
          print(json.dumps(payload, sort_keys=True))
          if direct["canonical_repo_name"] != checkout.name:
              raise SystemExit("protected RuleSpec routing rejected checkout")
          if hardened["canonical_repo_name"] != checkout.name:
              raise SystemExit("hardened RuleSpec routing rejected checkout")
          PY

      - name: Validate dependent cascade
        if: >-
          ${{
            inputs.dependent_citation != ''
            || inputs.second_dependent_citation != ''
          }}
        env:
          CITATION: ${{ inputs.citation }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
        run: |
          set -euo pipefail
          if [ -z "$DEPENDENT_CITATION" ]; then
            echo "first dependent citation is required before a second dependent" >&2
            exit 1
          fi
          dependent_citations=("$DEPENDENT_CITATION")
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            dependent_citations+=("$SECOND_DEPENDENT_CITATION")
          fi
          cascade_args=(
            axiom-encode/.venv/bin/python
            axiom-encode/scripts/prepare_signed_backfill.py
            validate-dependent-cascade
            "$RULESPEC_CHECKOUT" "$CITATION"
          )
          cascade_target="$REPLACE_RULESPEC_PATH"
          if [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
            cascade_target="$REPLACE_LEGACY_RULESPEC_PATH"
          fi
          if [ -n "$cascade_target" ]; then
            cascade_args+=(--target-rulespec-path "$cascade_target")
          fi
          if [ -n "$REPLACE_RULESPEC_PATH" ] && \
             [ -z "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
            cascade_args+=(--allow-proof-import-subset)
          fi
          cascade_args+=("${dependent_citations[@]}")
          cascade_mode="$("${cascade_args[@]}")"
          case "$cascade_mode" in
            all-direct|proof-import-subset) ;;
            *)
              echo "dependent cascade returned an invalid scheduling mode" >&2
              exit 1
              ;;
          esac
          printf 'DEPENDENT_CASCADE_MODE=%s\n' "$cascade_mode" >> "$GITHUB_ENV"

      - name: Verify existing signed imports
        env:
          ATOMIC_SOURCE_JSON: ${{ inputs.source_bundle_json }}
          CITATION: ${{ inputs.citation }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          EXISTING_SIGNED_IMPORTS_JSON: ${{ inputs.existing_signed_imports_json }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON: ${{ inputs.legacy_retained_successor_rulespec_paths_json }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          REPAIR_TESTS_ONLY: ${{ steps.repair_candidate.outputs.tests_only }}
          RULESPEC_CHECKOUT: ${{ github.workspace }}/rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
        run: |
          set -euo pipefail
          workflow_python=/opt/axiom-verification/python/bin/python
          backfill_helper=axiom-encode/scripts/prepare_signed_backfill.py
          atomic_source_payload="$(
            "$workflow_python" -I "$backfill_helper" \
              split-atomic-source-input "${ATOMIC_SOURCE_JSON:-[]}"
          )"
          source_bundle_json="$(jq -cer '.source_bundle' \
            <<< "$atomic_source_payload")"
          canonical_refresh_bundle_json="$(jq -cer '.canonical_refresh_bundle' \
            <<< "$atomic_source_payload")"
          primary_required_test_cases_json="$(jq -cer \
            '.primary_required_test_cases' <<< "$atomic_source_payload")"
          canonical_refresh_primary_required_test_cases_json="$primary_required_test_cases_json"
          if [ "${REPAIR_TESTS_ONLY:-false}" = "true" ]; then
            canonical_refresh_primary_required_test_cases_json="[]"
          fi
          source_bundle_args=(
            "$workflow_python" -I "$backfill_helper" parse-source-bundle
            "$source_bundle_json" --primary-citation "$CITATION"
          )
          if [ -n "$DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$DEPENDENT_CITATION")
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$SECOND_DEPENDENT_CITATION")
          fi
          normalized_source_bundle="$("${source_bundle_args[@]}")"
          printf '%s\n' "$normalized_source_bundle" \
            > "$RUNNER_TEMP/source-bundle.json"
          normalized_canonical_refresh_bundle="$(
            "$workflow_python" -I "$backfill_helper" \
              parse-canonical-refresh-bundle "$RULESPEC_CHECKOUT" \
              "$canonical_refresh_bundle_json" \
              --primary-citation "$CITATION" \
              --primary-rulespec-path "$REPLACE_RULESPEC_PATH" \
              --primary-required-test-cases-json \
                "$canonical_refresh_primary_required_test_cases_json"
          )"
          printf '%s\n' "$normalized_canonical_refresh_bundle" \
            > "$RUNNER_TEMP/canonical-refresh-bundle.json"

          existing_import_args=(
            "$workflow_python" -I "$backfill_helper"
            parse-existing-signed-imports "$RULESPEC_CHECKOUT"
            "${EXISTING_SIGNED_IMPORTS_JSON:-[]}"
            --primary-citation "$CITATION"
          )
          while IFS= read -r source_citation; do
            existing_import_args+=(--source-citation "$source_citation")
          done < <(printf '%s\n' "$normalized_source_bundle" | jq -r '.[]')
          if [ -n "$DEPENDENT_CITATION" ]; then
            existing_import_args+=(--exclude-citation "$DEPENDENT_CITATION")
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            existing_import_args+=(--exclude-citation "$SECOND_DEPENDENT_CITATION")
          fi
          if ! printf '%s\n' "${LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON:-[]}" \
            | jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' \
              > /dev/null; then
            echo "retained successor paths must be a JSON array of non-empty strings" >&2
            exit 1
          fi
          retained_successor_paths=()
          while IFS= read -r retained_successor_path; do
            retained_successor_paths+=("$retained_successor_path")
          done < <(
            printf '%s\n' "${LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON:-[]}" \
              | jq -r '.[]'
          )
          for reserved_path in \
            "$REPLACE_RULESPEC_PATH" \
            "$REPLACE_LEGACY_RULESPEC_PATH" \
            "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" \
            "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" \
            "${retained_successor_paths[@]-}"; do
            if [ -n "$reserved_path" ]; then
              existing_import_args+=(--exclude-rulespec-path "$reserved_path")
            fi
          done
          normalized_existing_imports="$("${existing_import_args[@]}")"
          printf '%s\n' "$normalized_existing_imports" \
            > "$RUNNER_TEMP/existing-signed-imports.json"
          jq -r '.[]' "$RUNNER_TEMP/existing-signed-imports.json" \
            > "$RUNNER_TEMP/existing-signed-import-paths.txt"

          if [ -s "$RUNNER_TEMP/existing-signed-import-paths.txt" ]; then
            signed_import_args=(
              /opt/axiom-verification/axiom-encode-signing-supervisor
              --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json
              --trusted-python-runtime-root /opt/axiom-verification/python
              --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages
              --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode
              -- /opt/axiom-verification/axiom-encode signed-import-inventory
              --repo "$RULESPEC_CHECKOUT"
              --corpus-path "$GITHUB_WORKSPACE/axiom-corpus"
              --base-ref "$RULESPEC_REF"
              --expected-encoder-checkout "$GITHUB_WORKSPACE/axiom-encode"
              --json
            )
            while IFS= read -r existing_import_path; do
              signed_import_args+=(--rulespec-path "$existing_import_path")
            done < "$RUNNER_TEMP/existing-signed-import-paths.txt"
            "${signed_import_args[@]}" \
              > "$RUNNER_TEMP/existing-signed-import-inventory.json"
          else
            "$workflow_python" -I - \
              "$RULESPEC_REF" \
              "$RUNNER_TEMP/existing-signed-import-inventory.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[2]).write_text(
              json.dumps(
                  {
                      "schema": "axiom-encode/signed-import-inventory/v1",
                      "rulespec_base": sys.argv[1],
                      "verifier_encoder_identity": None,
                      "items": [],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Encode, review, validate, and apply
        id: encode_apply
        env:
          # Flush encoder output as it is produced so a timeout or crash
          # still leaves attempt records in the job log.
          PYTHONUNBUFFERED: "1"
          AXIOM_ENCODE_APPLY_SIGNING_KEY: ${{ secrets.AXIOM_ENCODE_APPLY_SIGNING_KEY }}
          # Ship each run's cost ledger row (tokens, spend, attempt count) to
          # the ops dashboard. Without these the encoder logs the run locally
          # on the runner and prints "supabase_sync=skipped", and the ledger
          # is discarded with the runner's temp dir.
          AXIOM_ENCODE_SUPABASE_URL: ${{ secrets.AXIOM_ENCODE_SUPABASE_URL }}
          AXIOM_ENCODE_SUPABASE_SECRET_KEY: ${{ secrets.AXIOM_ENCODE_SUPABASE_SECRET_KEY }}
          ATOMIC_SOURCE_JSON: ${{ inputs.source_bundle_json }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CITATION: ${{ inputs.citation }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          COUNTRY: ${{ inputs.country }}
          REVIEW_FINDING: ${{ inputs.review_finding }}
          REPAIR_CANDIDATE_PATH: ${{ steps.repair_candidate.outputs.path }}
          REPAIR_CANDIDATE_ROOT: ${{ steps.repair_candidate.outputs.root }}
          REPAIR_CANDIDATE_RULESPEC_SHA256: ${{ steps.repair_candidate.outputs.rulespec_sha256 }}
          REPAIR_CANDIDATE_TESTS_SHA256: ${{ steps.repair_candidate.outputs.tests_sha256 }}
          REPAIR_TESTS_ONLY: ${{ steps.repair_candidate.outputs.tests_only }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
          REPAIR_RUN_LANE: ${{ steps.repair_candidate.outputs.lane }}
          REPAIR_RULESPEC_PATH: ${{ steps.repair_candidate.outputs.rulespec_path }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON: ${{ inputs.legacy_retained_successor_rulespec_paths_json }}
          QUEUE_ID: ${{ inputs.queue_id }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          DEPENDENT_REVIEW_FINDING: ${{ inputs.dependent_review_finding }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          SECOND_DEPENDENT_REVIEW_FINDING: ${{ inputs.second_dependent_review_finding }}
          EXISTING_SIGNED_IMPORTS_JSON: ${{ inputs.existing_signed_imports_json }}
          RULESPEC_CHECKOUT: ${{ github.workspace }}/rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
          RULES_ENGINE_REF: ${{ inputs.rules_engine_ref }}
        run: |
          set -euo pipefail
          : "${REPAIR_TESTS_ONLY:=false}"
          : "${REPAIR_RUN_LANE:=target}"
          : "${REPAIR_RULESPEC_PATH:=}"
          : "${QUEUE_ID:=}"
          : "${REPLACE_RULESPEC_PATH:=}"
          : "${REPLACE_LEGACY_RULESPEC_PATH:=}"
          : "${LEGACY_EXACT_DEPENDENT_RULESPEC_PATH:=}"
          : "${SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH:=}"
          : "${LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON:=[]}"
          if ! printf '%s\n' "$LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON" \
            | jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' \
              > /dev/null; then
            echo "retained successor paths must be a JSON array of non-empty strings" >&2
            exit 1
          fi
          retained_successor_paths=()
          retained_successor_count=0
          while IFS= read -r retained_successor_path; do
            retained_successor_paths+=("$retained_successor_path")
            retained_successor_count=$((retained_successor_count + 1))
          done < <(
            printf '%s\n' "$LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON" \
              | jq -r '.[]'
          )
          : "${SECOND_DEPENDENT_CITATION:=}"
          : "${SECOND_DEPENDENT_REVIEW_FINDING:=}"
          dependent_rulespec_path=""
          second_dependent_rulespec_path=""
          source_repair_candidates_json="[]"

          run_signed_encode() {
            local citation="$1"
            local review_finding="$2"
            local target_only="$3"
            local output_lane="$4"
            local replacement_path="$5"
            local legacy_source_path="$6"
            local require_direct_imports="$7"
            local deferred_output_contracts_json="${8:-[]}"
            local required_test_cases_json="${9:-[]}"
            local require_complete_source_unit="${10:-true}"
            local scheduled_dependent_paths_json="${11:-[]}"
            local review_finding_path=""
            local review_contract_json=""
            local candidate_root=""
            local candidate_path=""
            local candidate_rulespec_sha256=""
            local candidate_tests_sha256=""
            local source_candidate=""
            mkdir -p "$RUNNER_TEMP/generated/$output_lane"
            local -a args=(
              /opt/axiom-verification/axiom-encode encode
              --backend openai
              --corpus-path "$GITHUB_WORKSPACE/axiom-corpus"
              --axiom-rules-engine-path "$GITHUB_WORKSPACE/axiom-rules-engine"
              --policy-repo-path "$RULESPEC_CHECKOUT"
              --output "$RUNNER_TEMP/generated/$output_lane"
              --emit-final-rejected-candidate \
                "$RUNNER_TEMP/generated/$output_lane/final-rejected-candidate"
              --mode repo-augmented
              --db "$RUNNER_TEMP/encodings.db"
              --apply
            )
            case "$require_complete_source_unit" in
              true)
                args+=(--require-complete-source-unit)
                ;;
              false)
                ;;
              *)
                echo "require_complete_source_unit must be true or false" >&2
                exit 1
                ;;
            esac
            if [ "$target_only" = "true" ]; then
              args+=(--apply-target-only)
            fi
            while IFS= read -r scheduled_dependent_path; do
              args+=(--scheduled-dependent-rulespec-path \
                "$scheduled_dependent_path")
            done < <(
              jq -er 'if type == "array" then .[] else error("not array") end' \
                <<< "$scheduled_dependent_paths_json"
            )
            if [ -n "$replacement_path" ]; then
              args+=(--replace-rulespec-path "$replacement_path")
            fi
            if [ -n "$replacement_path" ] && [ -z "$legacy_source_path" ]; then
              shrink_authorized="$(
                "$workflow_python" "$backfill_helper" \
                  authorize-legacy-index-manifest-shrink \
                  "$RULESPEC_CHECKOUT" "$replacement_path"
              )"
              case "$shrink_authorized" in
                true)
                  args+=(--allow-shrink)
                  ;;
                false)
                  ;;
                *)
                  echo "manifest shrink authorization returned malformed output" >&2
                  exit 1
                  ;;
              esac
            fi
            if [ -n "$legacy_source_path" ]; then
              args+=(--replace-legacy-rulespec-path "$legacy_source_path")
              if [ -n "$dependent_rulespec_path" ]; then
                args+=(
                  --legacy-dependent-rulespec-path "$dependent_rulespec_path"
                )
              fi
              if [ -n "$second_dependent_rulespec_path" ]; then
                args+=(
                  --legacy-dependent-rulespec-path \
                  "$second_dependent_rulespec_path"
                )
              fi
              if [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; then
                args+=(
                  --legacy-exact-dependent-rulespec-path \
                  "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
                )
              fi
              if [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; then
                args+=(
                  --legacy-exact-dependent-rulespec-path \
                  "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
                )
              fi
            for retained_successor_path in "${retained_successor_paths[@]-}"; do
                if [ -n "$retained_successor_path" ]; then
                  args+=(
                    --legacy-retained-successor-rulespec-path \
                    "$retained_successor_path"
                  )
                fi
              done
            fi
            if [ "$require_direct_imports" = "true" ]; then
              while IFS= read -r required_import_path; do
                args+=(--required-import-rulespec-path "$required_import_path")
              done < "$RUNNER_TEMP/required-import-rulespec-paths.txt"
            fi
            if [ -n "$review_finding" ]; then
              review_finding_dir="$(mktemp -d "$RUNNER_TEMP/axiom-targeted-review-finding.XXXXXX")"
              review_finding_path="$review_finding_dir/review-finding.txt"
              printf '%s\n' "$review_finding" > "$review_finding_path"
              args+=(--review-findings "$review_finding_path")
            fi
            if [ "$deferred_output_contracts_json" != "[]" ] || \
               [ "$required_test_cases_json" != "[]" ]; then
              review_contract_json="$(
                jq -cn \
                  --arg schema "$([ "$required_test_cases_json" = "[]" ] \
                    && printf '%s' 'axiom-encode/review-contract/v1' \
                    || printf '%s' 'axiom-encode/review-contract/v2')" \
                  --arg citation "$citation" \
                  --arg rulespec_path "$replacement_path" \
                  --argjson required_deferred_outputs \
                    "$deferred_output_contracts_json" \
                  --argjson required_test_cases "$required_test_cases_json" \
                  '{
                    schema: $schema,
                    citation: $citation,
                    rulespec_path: $rulespec_path,
                    required_deferred_outputs: $required_deferred_outputs
                  } + if $schema == "axiom-encode/review-contract/v2"
                    then {required_test_cases: $required_test_cases}
                    else {}
                    end'
              )"
              args+=(
                --review-contract-json
                "$review_contract_json"
              )
            fi
            if [ -n "${REPAIR_CANDIDATE_ROOT:-}" ] && \
               { [ "$output_lane" = "$REPAIR_RUN_LANE" ] || \
                 { [ "$REPAIR_RUN_LANE" = "target" ] && \
                   [[ "$output_lane" =~ ^target(-preflight)?$ ]]; }; } && \
               [ -n "$replacement_path" ]; then
              candidate_root="$REPAIR_CANDIDATE_ROOT"
              candidate_path="$REPAIR_CANDIDATE_PATH"
              candidate_rulespec_sha256="$REPAIR_CANDIDATE_RULESPEC_SHA256"
              candidate_tests_sha256="$REPAIR_CANDIDATE_TESTS_SHA256"
            elif [[ "$output_lane" =~ ^source-[0-9]{2}$ ]] && \
                 [ "$source_repair_candidates_json" != "[]" ]; then
              source_candidate="$(
                jq -cer \
                  --arg lane "$output_lane" \
                  --arg citation "$citation" '
                    [.[] | select(
                      .lane == $lane and .citation == $citation
                    )]
                    | if length == 1 then .[0]
                      else error("source repair candidate identity mismatch")
                      end
                  ' <<< "$source_repair_candidates_json"
              )"
              candidate_root="$(jq -er '.root' <<< "$source_candidate")"
              candidate_path="$(jq -er '.path' <<< "$source_candidate")"
              candidate_rulespec_sha256="$(
                jq -er '.rulespec_sha256' <<< "$source_candidate"
              )"
              candidate_tests_sha256="$(
                jq -er '.tests_sha256' <<< "$source_candidate"
              )"
            fi
            if [ -n "$candidate_root" ]; then
              test -n "$candidate_path" \
                && test -n "$candidate_rulespec_sha256" \
                && test -n "$candidate_tests_sha256"
              args+=(
                --repair-candidate-root "$candidate_root"
                --repair-candidate-path "$candidate_path"
                --repair-candidate-rulespec-sha256 \
                  "$candidate_rulespec_sha256"
                --repair-candidate-tests-sha256 \
                  "$candidate_tests_sha256"
              )
              if [ -n "$replacement_path" ] && \
                 [ "$REPAIR_TESTS_ONLY" = "true" ]; then
                args+=(--repair-candidate-tests-only)
              fi
            fi
            args+=("$citation")

            /opt/axiom-verification/axiom-encode-apply-signer run \
              --scope apply_ed25519 \
              --key-env AXIOM_ENCODE_APPLY_SIGNING_KEY \
              --supervisor /opt/axiom-verification/axiom-encode-signing-supervisor \
              --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
              --trusted-python-runtime-root /opt/axiom-verification/python \
              --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages \
              --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode \
              --expected-github-repository TheAxiomFoundation/axiom-encode \
              --allowed-workflow-ref TheAxiomFoundation/axiom-encode/.github/workflows/targeted-signed-reencode.yml@refs/heads/main \
              --allowed-event-name workflow_dispatch \
              -- "${args[@]}"
          }

          if [ -n "$DEPENDENT_REVIEW_FINDING" ] && [ -z "$DEPENDENT_CITATION" ]; then
            echo "dependent citation is required with dependent review finding" >&2
            exit 1
          fi
          if [ -n "$QUEUE_ID" ] && \
            { [ -n "$REPLACE_RULESPEC_PATH" ] || \
              [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ] || \
              [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
              [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
              [ "$retained_successor_count" -gt 0 ]; }; then
            echo "queue-authorized re-encodes cannot override the RuleSpec target path" >&2
            exit 1
          fi
          if [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ] && \
            [ -z "$REPLACE_RULESPEC_PATH" ]; then
            echo "legacy source and canonical destination must be paired" >&2
            exit 1
          fi
          if { [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
               [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; } && \
             [ -z "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
            echo "exact legacy dependents require a legacy source replacement" >&2
            exit 1
          fi
          if [ "$retained_successor_count" -gt 0 ] && \
             [ -z "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
            echo "retained successors require a legacy source replacement" >&2
            exit 1
          fi
          if [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] && \
             [ -z "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; then
            echo "first exact legacy dependent is required before a second" >&2
            exit 1
          fi
          if { [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
               [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; } && \
             { [ -n "$DEPENDENT_CITATION" ] || \
               [ -n "$SECOND_DEPENDENT_CITATION" ]; }; then
            echo "exact and model-regenerated dependent modes cannot be combined" >&2
            exit 1
          fi
          if [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] && \
             { [ "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$REPLACE_RULESPEC_PATH" ] || \
               [ "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$REPLACE_LEGACY_RULESPEC_PATH" ]; }; then
            echo "exact legacy dependent must differ from source and destination" >&2
            exit 1
          fi
          if [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] && \
             { [ "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$REPLACE_RULESPEC_PATH" ] || \
               [ "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$REPLACE_LEGACY_RULESPEC_PATH" ] || \
               [ "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; }; then
            echo "second exact legacy dependent must be unique" >&2
            exit 1
          fi
          if [ -n "$DEPENDENT_CITATION" ] && [ -z "$DEPENDENT_REVIEW_FINDING" ]; then
            echo "dependent review finding is required with dependent citation" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ] && [ -z "$DEPENDENT_CITATION" ]; then
            echo "first dependent citation is required before a second dependent" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_REVIEW_FINDING" ] && \
            [ -z "$SECOND_DEPENDENT_CITATION" ]; then
            echo "second dependent citation is required with its review finding" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ] && \
            [ -z "$SECOND_DEPENDENT_REVIEW_FINDING" ]; then
            echo "second dependent review finding is required" >&2
            exit 1
          fi
          if [ -n "$DEPENDENT_CITATION" ] && [ "$DEPENDENT_CITATION" = "$CITATION" ]; then
            echo "dependent citation must differ from the target citation" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ] && \
            { [ "$SECOND_DEPENDENT_CITATION" = "$CITATION" ] || \
              [ "$SECOND_DEPENDENT_CITATION" = "$DEPENDENT_CITATION" ]; }; then
            echo "second dependent citation must be unique" >&2
            exit 1
          fi

          backfill_helper="axiom-encode/scripts/prepare_signed_backfill.py"
          if [ ! -f "$backfill_helper" ]; then
            backfill_helper="scripts/prepare_signed_backfill.py"
          fi
          workflow_python="/opt/axiom-verification/python/bin/python"
          if [ ! -x "$workflow_python" ]; then
            workflow_python="${AXIOM_TEST_PYTHON:-python}"
          fi
          if [ -n "$DEPENDENT_CITATION" ]; then
            dependent_rulespec_path="$("$workflow_python" "$backfill_helper" \
              citation-rulespec-path "$DEPENDENT_CITATION")"
          fi
          if [ -n "${REPAIR_CANDIDATE_ROOT:-}" ] && \
             [ "$REPAIR_RUN_LANE" = "dependent" ] && \
             [ "$dependent_rulespec_path" != "$REPAIR_RULESPEC_PATH" ]; then
            echo "dependent repair RuleSpec path does not match its citation" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            second_dependent_rulespec_path="$("$workflow_python" "$backfill_helper" \
              citation-rulespec-path "$SECOND_DEPENDENT_CITATION")"
          fi
          scheduled_dependent_paths_json="[]"
          if [ "${DEPENDENT_CASCADE_MODE:-}" = "proof-import-subset" ]; then
            scheduled_dependent_paths_json="$(
              jq -cn \
                --arg first "$dependent_rulespec_path" \
                --arg second "$second_dependent_rulespec_path" \
                '[$first, $second] | map(select(length > 0))'
            )"
          fi

          atomic_source_payload="$(
            "$workflow_python" "$backfill_helper" split-atomic-source-input \
              "${ATOMIC_SOURCE_JSON:-[]}"
          )"
          source_bundle_json="$(jq -cer '.source_bundle' \
            <<< "$atomic_source_payload")"
          canonical_refresh_bundle_json="$(jq -cer '.canonical_refresh_bundle' \
            <<< "$atomic_source_payload")"
          primary_required_test_cases_json="$(jq -cer \
            '.primary_required_test_cases' <<< "$atomic_source_payload")"
          target_require_complete_source_unit="$(jq -r \
            '.require_complete_source_unit' <<< "$atomic_source_payload")"
          canonical_refresh_primary_required_test_cases_json="$primary_required_test_cases_json"
          if [ "$REPAIR_TESTS_ONLY" = "true" ]; then
            canonical_refresh_primary_required_test_cases_json="[]"
          fi
          source_bundle_args=(
            "$workflow_python" "$backfill_helper" parse-source-bundle
            "$source_bundle_json" --primary-citation "$CITATION"
          )
          if [ -n "$DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$DEPENDENT_CITATION")
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$SECOND_DEPENDENT_CITATION")
          fi
          normalized_source_bundle="$("${source_bundle_args[@]}")"
          normalized_canonical_refresh_bundle="$(
            "$workflow_python" "$backfill_helper" \
              parse-canonical-refresh-bundle "$RULESPEC_CHECKOUT" \
              "$canonical_refresh_bundle_json" \
              --primary-citation "$CITATION" \
              --primary-rulespec-path "$REPLACE_RULESPEC_PATH" \
              --primary-required-test-cases-json \
                "$canonical_refresh_primary_required_test_cases_json"
          )"
          verified_canonical_refresh_bundle="$(tr -d '\n' \
            < "$RUNNER_TEMP/canonical-refresh-bundle.json")"
          if [ "$normalized_canonical_refresh_bundle" != \
               "$verified_canonical_refresh_bundle" ]; then
            echo "verified canonical refresh bundle changed before apply" >&2
            exit 1
          fi
          existing_import_args=(
            "$workflow_python" "$backfill_helper"
            parse-existing-signed-imports "$RULESPEC_CHECKOUT"
            "${EXISTING_SIGNED_IMPORTS_JSON:-[]}"
            --primary-citation "$CITATION"
          )
          while IFS= read -r source_citation; do
            existing_import_args+=(--source-citation "$source_citation")
          done < <(printf '%s\n' "$normalized_source_bundle" | jq -r '.[]')
          if [ -n "$DEPENDENT_CITATION" ]; then
            existing_import_args+=(--exclude-citation "$DEPENDENT_CITATION")
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            existing_import_args+=(--exclude-citation "$SECOND_DEPENDENT_CITATION")
          fi
          for reserved_path in \
            "$REPLACE_RULESPEC_PATH" \
            "$REPLACE_LEGACY_RULESPEC_PATH" \
            "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" \
            "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" \
            "${retained_successor_paths[@]-}"; do
            if [ -n "$reserved_path" ]; then
              existing_import_args+=(--exclude-rulespec-path "$reserved_path")
            fi
          done
          normalized_existing_imports="$("${existing_import_args[@]}")"
          verified_existing_imports="$(tr -d '\n' \
            < "$RUNNER_TEMP/existing-signed-imports.json")"
          if [ "$normalized_existing_imports" != "$verified_existing_imports" ]; then
            echo "verified existing signed imports changed before apply" >&2
            exit 1
          fi
          if [ -n "$QUEUE_ID" ] && \
            { [ "$normalized_source_bundle" != "[]" ] || \
              [ "$normalized_existing_imports" != "[]" ]; }; then
            echo "queue-authorized re-encodes cannot add source inputs until queue generation identity binds them" >&2
            exit 1
          fi
          printf '%s\n' "$normalized_source_bundle" \
            > "$RUNNER_TEMP/source-bundle.json"
          jq -r '.[]' "$RUNNER_TEMP/source-bundle.json" \
            > "$RUNNER_TEMP/source-bundle-citations.txt"
          : > "$RUNNER_TEMP/source-bundle-rulespec-paths.txt"
          while IFS= read -r source_citation; do
            "$workflow_python" "$backfill_helper" \
              citation-rulespec-path "$source_citation" \
              >> "$RUNNER_TEMP/source-bundle-rulespec-paths.txt"
          done < "$RUNNER_TEMP/source-bundle-citations.txt"
          cat \
            "$RUNNER_TEMP/source-bundle-rulespec-paths.txt" \
            "$RUNNER_TEMP/existing-signed-import-paths.txt" \
            > "$RUNNER_TEMP/required-import-rulespec-paths.txt"
          source_bundle_count="$(jq -er 'length' \
            "$RUNNER_TEMP/source-bundle.json")"
          canonical_refresh_count="$(jq -er 'length' \
            "$RUNNER_TEMP/canonical-refresh-bundle.json")"
          existing_import_count="$(jq -er 'length' \
            "$RUNNER_TEMP/existing-signed-imports.json")"
          source_bundle_enabled=false
          if [ "$source_bundle_count" -gt 0 ]; then
            source_bundle_enabled=true
          fi
          if [ "$target_require_complete_source_unit" = "false" ] && \
             { [ "$source_bundle_enabled" != "true" ] || \
               [ -z "$REPLACE_RULESPEC_PATH" ] || \
               [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ] || \
               [ -n "$DEPENDENT_CITATION" ] || \
               [ -n "$SECOND_DEPENDENT_CITATION" ] || \
               [ -n "$QUEUE_ID" ]; }; then
            echo "scoped source-unit validation requires a normal source-bundle replacement" >&2
            exit 1
          fi
          if [ "$source_bundle_enabled" = "true" ] && \
             [ -n "${REPAIR_RUN_ID:-}" ]; then
            source_rulespec_paths_json="$(
              jq -Rsc 'split("\n") | map(select(length > 0))' \
                "$RUNNER_TEMP/source-bundle-rulespec-paths.txt"
            )"
            repair_encoder_commit="$(jq -er '.head_sha' \
              "$RUNNER_TEMP/repair-run.json")"
            source_repair_result="$(
              "$workflow_python" \
                axiom-encode/scripts/extract_repair_candidate.py \
                "$RUNNER_TEMP/repair-download/targeted-reencode-failure.tar" \
                "$RUNNER_TEMP/source-repair-candidate" \
                --citation "$CITATION" \
                --country "$COUNTRY" \
                --encoder-commit "$repair_encoder_commit" \
                --corpus-ref "$CORPUS_REF" \
                --rules-engine-ref "$RULES_ENGINE_REF" \
                --rulespec-ref "$RULESPEC_REF" \
                --allow-rulespec-base-advance \
                --atomic-source-json "$ATOMIC_SOURCE_JSON" \
                --existing-signed-imports-json \
                  "${EXISTING_SIGNED_IMPORTS_JSON:-[]}" \
                --replace-rulespec-path "$REPLACE_RULESPEC_PATH" \
                --source-rulespec-paths-json "$source_rulespec_paths_json" \
                --workflow-run-id "$REPAIR_RUN_ID"
            )"
            source_repair_candidates_json="$(
              jq -cer \
                --argjson expected_count "$source_bundle_count" '
                  .source_candidates
                  | select(type == "array" and length == $expected_count)
                ' <<< "$source_repair_result"
            )"
          fi
          canonical_refresh_enabled=false
          if [ "$canonical_refresh_count" -gt 0 ]; then
            canonical_refresh_enabled=true
          fi
          required_imports_enabled=false
          if [ $((source_bundle_count + existing_import_count)) -gt 0 ]; then
            required_imports_enabled=true
          fi
          if [ "$canonical_refresh_enabled" = "true" ] && \
            { [ "$source_bundle_enabled" = "true" ] || \
              [ "$existing_import_count" -gt 0 ] || \
              [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ] || \
              [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
              [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
              [ "$retained_successor_count" -gt 0 ] || \
              [ -n "$DEPENDENT_CITATION" ] || \
              [ -n "$SECOND_DEPENDENT_CITATION" ] || \
              [ -n "${REPAIR_CANDIDATE_ROOT:-}" ] || \
              [ -n "$QUEUE_ID" ]; }; then
            echo "canonical refresh bundles cannot mix with imports, composition bundles, legacy/dependent migration, repair replay, or queue authorization" >&2
            exit 1
          fi
          if [ "$source_bundle_enabled" = "true" ] && \
             [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
            echo "source bundles require legacy replacements to merge first" >&2
            exit 1
          fi
          if [ "$source_bundle_enabled" = "true" ] && \
             [ -n "$REPLACE_RULESPEC_PATH" ] && \
             { [ -n "$DEPENDENT_CITATION" ] || \
               [ -n "$SECOND_DEPENDENT_CITATION" ] || \
               [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
               [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
               [ "$retained_successor_count" -gt 0 ]; }; then
            echo "source-bundle replacements cannot include dependent migrations" >&2
            exit 1
          fi

          checkpoint_signed_changes() {
            local message="$1"
            local guard_json="$RUNNER_TEMP/checkpoint-guard-generated.json"
            local guard_stderr="$RUNNER_TEMP/checkpoint-guard-generated.stderr.log"
            set +e
            (
              unset AXIOM_ENCODE_APPLY_SIGNING_KEY
              /opt/axiom-verification/axiom-encode-signing-supervisor \
                --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
                --trusted-python-runtime-root /opt/axiom-verification/python \
                --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages \
                --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode \
                -- /opt/axiom-verification/axiom-encode guard-generated \
                --repo "$RULESPEC_CHECKOUT" \
                --corpus-path "$GITHUB_WORKSPACE/axiom-corpus" \
                --expected-encoder-checkout "$GITHUB_WORKSPACE/axiom-encode" \
                --json
            ) > "$guard_json" 2> "$guard_stderr"
            local guard_status="$?"
            set -e
            if [ -s "$guard_stderr" ]; then
              cat "$guard_stderr" >&2
            else
              rm "$guard_stderr"
            fi
            if ! jq -e -s '
              select(
                length == 1
                and (
                  .[0] | type == "object"
                  and keys == ["issues", "passed", "repo"]
                  and (.repo | type == "string")
                  and (.passed | type == "boolean")
                  and (.issues | type == "array" and all(.[]; type == "string"))
                )
              )
              | .[0]
            ' "$guard_json" >&2; then
              mv "$guard_json" \
                "$RUNNER_TEMP/checkpoint-guard-generated.stdout.log"
              echo "checkpoint provenance guard returned malformed diagnostics" >&2
              if [ "$guard_status" -eq 0 ]; then
                guard_status=1
              fi
            fi
            if [ "$guard_status" -ne 0 ]; then
              return "$guard_status"
            fi
            git -C "$RULESPEC_CHECKOUT" diff --check
            "$workflow_python" "$backfill_helper" stage "$RULESPEC_CHECKOUT"
            git -C "$RULESPEC_CHECKOUT" \
              -c core.hooksPath=/dev/null \
              -c user.name=axiom-encode-bot \
              -c user.email=axiom-encode-bot@users.noreply.github.com \
              commit -m "$message"
          }

          if [ "$canonical_refresh_enabled" = "true" ]; then
            refresh_index=0
            while IFS= read -r refresh_item; do
              while IFS= read -r pending_refresh_item; do
                "$workflow_python" "$backfill_helper" \
                  verify-canonical-refresh-target "$RULESPEC_CHECKOUT" \
                  "$pending_refresh_item" > /dev/null
              done < <(jq -c ".[$refresh_index:][]" \
                "$RUNNER_TEMP/canonical-refresh-bundle.json")
              refresh_citation="$(jq -er '.citation' <<< "$refresh_item")"
              refresh_rulespec_path="$(jq -er '.rulespec_path' <<< "$refresh_item")"
              refresh_deferred_output_contracts="$(
                jq -cer '.deferred_output_contracts // []' <<< "$refresh_item"
              )"
              refresh_required_test_cases="$(
                jq -cer '.required_test_cases // []' <<< "$refresh_item"
              )"
              refresh_lane=target
              refresh_finding="$REVIEW_FINDING"
              if [ "$refresh_index" -gt 0 ]; then
                refresh_lane="$(printf 'canonical-refresh-%02d' "$refresh_index")"
                refresh_finding="$(jq -er '.review_finding // ""' \
                  <<< "$refresh_item")"
              fi
              run_signed_encode \
                "$refresh_citation" "$refresh_finding" false "$refresh_lane" \
                "$refresh_rulespec_path" "" false \
                "$refresh_deferred_output_contracts" \
                "$refresh_required_test_cases"
              "$workflow_python" "$backfill_helper" \
                reconcile-retired-manifest-inventory \
                "$RULESPEC_CHECKOUT" "$refresh_rulespec_path"
              checkpoint_signed_changes \
                "Refresh signed canonical module for ${refresh_citation}"
              cp "$RUNNER_TEMP/checkpoint-guard-generated.json" \
                "$RUNNER_TEMP/${refresh_lane}-guard-generated.json"
              refresh_index=$((refresh_index + 1))
            done < <(jq -c '.[]' \
              "$RUNNER_TEMP/canonical-refresh-bundle.json")
          else
            if [ "$source_bundle_enabled" = "true" ] && \
               [ "$source_repair_candidates_json" = "[]" ] && \
               [ -n "$REPLACE_RULESPEC_PATH" ] && \
               [ -z "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
              run_signed_encode \
                "$CITATION" "$REVIEW_FINDING" false target-preflight \
                "$REPLACE_RULESPEC_PATH" "" false "[]" "[]" \
                "$target_require_complete_source_unit"
              "$workflow_python" "$backfill_helper" \
                reconcile-retired-manifest-inventory \
                "$RULESPEC_CHECKOUT" "$REPLACE_RULESPEC_PATH"
              checkpoint_signed_changes \
                "Canonicalize signed replacement target before source bundle"
              cp "$RUNNER_TEMP/checkpoint-guard-generated.json" \
                "$RUNNER_TEMP/target-preflight-guard-generated.json"
            fi

            source_index=0
            while IFS= read -r source_citation; do
              source_index=$((source_index + 1))
              source_lane="$(printf 'source-%02d' "$source_index")"
              run_signed_encode \
                "$source_citation" "" true "$source_lane" "" "" false
              checkpoint_signed_changes \
                "Add signed source module for ${source_citation}"
              cp "$RUNNER_TEMP/checkpoint-guard-generated.json" \
                "$RUNNER_TEMP/${source_lane}-guard-generated.json"
            done < "$RUNNER_TEMP/source-bundle-citations.txt"

            if [ -n "$DEPENDENT_CITATION" ]; then
              primary_target_only=true
              if [ "${DEPENDENT_CASCADE_MODE:-}" = "proof-import-subset" ]; then
                primary_target_only=false
              fi
              run_signed_encode \
                "$CITATION" "$REVIEW_FINDING" "$primary_target_only" target \
                "$REPLACE_RULESPEC_PATH" "$REPLACE_LEGACY_RULESPEC_PATH" \
                "$required_imports_enabled" "[]" \
                "$primary_required_test_cases_json" \
                "$target_require_complete_source_unit" \
                "$scheduled_dependent_paths_json"
              dependent_target_only=false
              if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
                dependent_target_only=true
              fi
              dependent_replacement_path=""
              if [ -n "${REPAIR_CANDIDATE_ROOT:-}" ] && \
                 [ "$REPAIR_RUN_LANE" = "dependent" ]; then
                dependent_replacement_path="$dependent_rulespec_path"
              fi
              run_signed_encode \
                "$DEPENDENT_CITATION" "$DEPENDENT_REVIEW_FINDING" \
                "$dependent_target_only" dependent \
                "$dependent_replacement_path" "" false
              if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
                run_signed_encode \
                  "$SECOND_DEPENDENT_CITATION" \
                  "$SECOND_DEPENDENT_REVIEW_FINDING" false dependent-2 "" "" false
              fi
            else
              run_signed_encode \
                "$CITATION" "$REVIEW_FINDING" false \
                target "$REPLACE_RULESPEC_PATH" \
                "$REPLACE_LEGACY_RULESPEC_PATH" \
                "$required_imports_enabled" "[]" \
                "$primary_required_test_cases_json" \
                "$target_require_complete_source_unit"
            fi

            if { [ "$source_bundle_enabled" = "false" ] || \
                 [ "$source_repair_candidates_json" != "[]" ]; } && \
               [ -n "$REPLACE_RULESPEC_PATH" ] && \
               [ -z "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
              "$workflow_python" "$backfill_helper" \
                reconcile-retired-manifest-inventory \
                "$RULESPEC_CHECKOUT" "$REPLACE_RULESPEC_PATH"
            fi

            if [ "$source_bundle_enabled" = "true" ]; then
              checkpoint_signed_changes \
                "Compose signed source bundle for ${CITATION}"
            fi
          fi

      - name: Summarize model spend
        id: run_cost_summary
        # Telemetry only (axiom-encode#1495): prices this run's recorded
        # usage so spend is visible per run instead of only on the invoice.
        # Runs on failure too — failed attempts are the expensive case.
        if: ${{ !cancelled() && steps.encode_apply.outcome != 'skipped' }}
        env:
          TRACES_ROOT: ${{ runner.temp }}/generated
        run: |
          python3 "$GITHUB_WORKSPACE/axiom-encode/scripts/summarize_run_cost.py" \
            --traces-root "$TRACES_ROOT" \
            --pricing "$GITHUB_WORKSPACE/axiom-encode/src/axiom_encode/harness/pricing_rates.toml"

      - name: Verify generated provenance
        id: verify_generated_provenance
        env:
          RULESPEC_CHECKOUT: ${{ github.workspace }}/rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
        run: |
          set +e
          /opt/axiom-verification/axiom-encode-signing-supervisor \
            --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
            --trusted-python-runtime-root /opt/axiom-verification/python \
            --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages \
            --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode \
            -- /opt/axiom-verification/axiom-encode guard-generated \
            --repo "$RULESPEC_CHECKOUT" \
            --corpus-path "$GITHUB_WORKSPACE/axiom-corpus" \
            --expected-encoder-checkout "$GITHUB_WORKSPACE/axiom-encode" \
            --base-ref "$RULESPEC_REF" \
            --json > "$RUNNER_TEMP/guard-generated.json"
          guard_status="$?"
          set -e
          if [ "$guard_status" -ne 0 ]; then
            if ! jq . "$RUNNER_TEMP/guard-generated.json" >&2; then
              echo "generated provenance guard returned malformed diagnostics" >&2
            fi
            exit "$guard_status"
          fi
          git -C "$RULESPEC_CHECKOUT" diff --check

      - name: Verify existing signed import integrity
        id: verify_existing_signed_import_integrity
        env:
          RULESPEC_CHECKOUT: ${{ github.workspace }}/rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/existing-signed-import-paths.txt" ]; then
            signed_import_args=(
              /opt/axiom-verification/axiom-encode-signing-supervisor
              --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json
              --trusted-python-runtime-root /opt/axiom-verification/python
              --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages
              --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode
              -- /opt/axiom-verification/axiom-encode signed-import-inventory
              --repo "$RULESPEC_CHECKOUT"
              --corpus-path "$GITHUB_WORKSPACE/axiom-corpus"
              --base-ref "$RULESPEC_REF"
              --expected-encoder-checkout "$GITHUB_WORKSPACE/axiom-encode"
              --json
            )
            while IFS= read -r existing_import_path; do
              signed_import_args+=(--rulespec-path "$existing_import_path")
            done < "$RUNNER_TEMP/existing-signed-import-paths.txt"
            "${signed_import_args[@]}" \
              > "$RUNNER_TEMP/existing-signed-import-inventory-final.json"
          else
            cp \
              "$RUNNER_TEMP/existing-signed-import-inventory.json" \
              "$RUNNER_TEMP/existing-signed-import-inventory-final.json"
          fi
          cmp --silent \
            "$RUNNER_TEMP/existing-signed-import-inventory.json" \
            "$RUNNER_TEMP/existing-signed-import-inventory-final.json"

      - name: Package exact generated changes
        id: package_exact_generated_changes
        env:
          CITATION: ${{ inputs.citation }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          DEPENDENT_REVIEW_FINDING: ${{ inputs.dependent_review_finding }}
          DEPENDENT_REVIEW_FINDING_PRESENT: ${{ inputs.dependent_review_finding != '' }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          SECOND_DEPENDENT_REVIEW_FINDING: ${{ inputs.second_dependent_review_finding }}
          SECOND_DEPENDENT_REVIEW_FINDING_PRESENT: ${{ inputs.second_dependent_review_finding != '' }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_ITEM_ID: ${{ inputs.queue_item_id }}
          QUEUE_ITEM_GENERATION_SHA256: ${{ inputs.queue_item_generation_sha256 }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
          REVIEW_FINDING: ${{ inputs.review_finding }}
          REVIEW_FINDING_PRESENT: ${{ inputs.review_finding != '' }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
          REPAIR_CANDIDATE_LANE: ${{ steps.repair_candidate.outputs.lane }}
          REPAIR_CANDIDATE_PATH: ${{ steps.repair_candidate.outputs.path }}
          REPAIR_CANDIDATE_RUNNER: ${{ steps.repair_candidate.outputs.runner }}
          REPAIR_CANDIDATE_SOURCE_RULESPEC_REF: ${{ steps.repair_candidate.outputs.source_rulespec_ref }}
          REPAIR_CANDIDATE_RULESPEC_SHA256: ${{ steps.repair_candidate.outputs.rulespec_sha256 }}
          REPAIR_CANDIDATE_TESTS_SHA256: ${{ steps.repair_candidate.outputs.tests_sha256 }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON: ${{ inputs.legacy_retained_successor_rulespec_paths_json }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
        run: |
          set -euo pipefail
          workflow_python=(/opt/axiom-verification/python/bin/python -I)
          if [ ! -x "${workflow_python[0]}" ]; then
            workflow_python=("${AXIOM_TEST_PYTHON:-python}")
          fi
          artifact="$RUNNER_TEMP/targeted-reencode"
          mkdir -p "$artifact"
          git -C "$RULESPEC_CHECKOUT" diff --binary --full-index \
            "$RULESPEC_REF" > "$artifact/tracked.patch"
          git -C "$RULESPEC_CHECKOUT" ls-files --others --exclude-standard -z \
            | tar -C "$RULESPEC_CHECKOUT" --null -czf "$artifact/untracked.tar.gz" --files-from -
          git -C "$RULESPEC_CHECKOUT" status --short > "$artifact/status.txt"
          git -C "$RULESPEC_CHECKOUT" diff --name-status \
            "$RULESPEC_REF" HEAD >> "$artifact/status.txt"
          cp "$RUNNER_TEMP/guard-generated.json" "$artifact/guard-generated.json"
          cp "$RUNNER_TEMP/source-bundle.json" "$artifact/source-bundle.json"
          cp "$RUNNER_TEMP/canonical-refresh-bundle.json" \
            "$artifact/canonical-refresh-bundle.json"
          cp "$RUNNER_TEMP/existing-signed-imports.json" \
            "$artifact/existing-signed-imports.json"
          cp "$RUNNER_TEMP/existing-signed-import-inventory.json" \
            "$artifact/signed-import-inventory.json"
          for source_guard in "$RUNNER_TEMP"/source-*-guard-generated.json; do
            if [ -f "$source_guard" ]; then
              cp "$source_guard" "$artifact/"
            fi
          done
          for refresh_guard in \
            "$RUNNER_TEMP"/canonical-refresh-*-guard-generated.json; do
            if [ -f "$refresh_guard" ]; then
              cp "$refresh_guard" "$artifact/"
            fi
          done
          if [ -f "$RUNNER_TEMP/target-guard-generated.json" ]; then
            cp "$RUNNER_TEMP/target-guard-generated.json" "$artifact/"
          fi
          if [ -f "$RUNNER_TEMP/target-preflight-guard-generated.json" ]; then
            cp "$RUNNER_TEMP/target-preflight-guard-generated.json" "$artifact/"
          fi
          "${workflow_python[@]}" - \
            "$artifact/context-manifest.json" \
            "$artifact/apply-manifests.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          from axiom_encode.corpus_resolver import (
              UnsafeCorpusPathError,
              read_bounded_regular_file,
          )
          from axiom_encode.legacy_replacement import (
              RECEIPT_SCHEMA_V1,
              RECEIPT_SCHEMAS,
              RECEIPT_SCHEMAS_WITH_RETAINED_SUCCESSORS,
          )
          from axiom_encode.rulespec_path_migration import (
              canonical_destination,
              rewrite_exact_references,
          )

          def git_paths(*args):
              output = subprocess.check_output(
                  ["git", "-C", os.environ["RULESPEC_CHECKOUT"], *args]
              )
              return {
                  Path(value.decode("utf-8"))
                  for value in output.split(b"\0")
                  if value
              }

          def git_blob(relative, *, label, max_bytes):
              relative = Path(relative)
              if (
                  relative.is_absolute()
                  or not relative.parts
                  or any(part in {"", ".", ".."} for part in relative.parts)
              ):
                  raise SystemExit(f"{label} path is not canonical")
              completed = subprocess.run(
                  [
                      "git",
                      "-C",
                      os.environ["RULESPEC_CHECKOUT"],
                      "show",
                      f"{os.environ['RULESPEC_REF']}:{relative.as_posix()}",
                  ],
                  check=False,
                  capture_output=True,
              )
              if completed.returncode != 0:
                  raise SystemExit(f"{label} is absent from the base commit")
              if len(completed.stdout) > max_bytes:
                  raise SystemExit(f"{label} exceeds its size limit")
              return completed.stdout

          def read_bounded_regular(root, relative, *, label, max_bytes):
              relative = Path(relative)
              if (
                  relative.is_absolute()
                  or not relative.parts
                  or any(part in {"", ".", ".."} for part in relative.parts)
              ):
                  raise SystemExit(f"{label} path is not canonical")
              root = Path(root).resolve(strict=True)
              try:
                  return read_bounded_regular_file(
                      root,
                      root / relative,
                      label=label,
                      max_bytes=max_bytes,
                      required_mode=0o644,
                  )
              except UnsafeCorpusPathError as exc:
                  raise SystemExit(str(exc)) from exc

          manifest_paths = git_paths(
              "diff", "--name-only", "--diff-filter=AM", "-z",
              os.environ["RULESPEC_REF"], "--",
              ".axiom/encoding-manifests",
          )
          deleted_manifest_paths = git_paths(
              "diff", "--name-only", "--diff-filter=D", "-z",
              os.environ["RULESPEC_REF"], "--",
              ".axiom/encoding-manifests",
          )
          manifest_paths.update(
              git_paths(
                  "ls-files", "--others", "--exclude-standard", "-z", "--",
                  ".axiom/encoding-manifests",
              )
          )
          dependent_citation = os.environ.get("DEPENDENT_CITATION") or ""
          second_dependent_citation = (
              os.environ.get("SECOND_DEPENDENT_CITATION") or ""
          )
          replacement_path = os.environ.get("REPLACE_RULESPEC_PATH") or ""
          legacy_source_path = (
              os.environ.get("REPLACE_LEGACY_RULESPEC_PATH") or ""
          )
          exact_dependent_paths = [
              value
              for value in (
                  os.environ.get("LEGACY_EXACT_DEPENDENT_RULESPEC_PATH") or "",
                  os.environ.get(
                      "SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
                  ) or "",
              )
              if value
          ]
          try:
              retained_successor_paths = json.loads(
