                          (
                              "successor",
                              successor_files,
                              retained_destination,
                              allowed_successor_files,
                              True,
                          ),
                      ):
                          if (
                              not isinstance(files, list)
                              or not files
                              or [
                                  item.get("path")
                                  for item in files
                                  if isinstance(item, dict)
                              ].count(required)
                              != 1
                              or len(
                                  {
                                      item.get("path")
                                      for item in files
                                      if isinstance(item, dict)
                                  }
                              )
                              != len(files)
                          ):
                              raise SystemExit(
                                  f"legacy replacement retained {label} files "
                                  "are malformed"
                              )
                          for item in files:
                              if (
                                  not isinstance(item, dict)
                                  or set(item) != {"path", "sha256"}
                                  or item.get("path") not in allowed
                                  or not isinstance(item.get("sha256"), str)
                                  or re.fullmatch(r"[0-9a-f]{64}", item["sha256"])
                                  is None
                              ):
                                  raise SystemExit(
                                      "legacy replacement retained file evidence "
                                      "is malformed"
                                  )
                              live_path = (
                                  Path(os.environ["RULESPEC_CHECKOUT"])
                                  / item["path"]
                              )
                              if must_exist:
                                  live_bytes = read_bounded_regular(
                                      os.environ["RULESPEC_CHECKOUT"],
                                      Path(item["path"]),
                                      label="legacy retained successor live file",
                                      max_bytes=16 * 1024 * 1024,
                                  )
                                  if (
                                      hashlib.sha256(live_bytes).hexdigest()
                                      != item["sha256"]
                                      or hashlib.sha256(
                                          git_blob(
                                              Path(item["path"]),
                                              label=(
                                                  "legacy retained original "
                                                  "successor file"
                                              ),
                                              max_bytes=16 * 1024 * 1024,
                                          )
                                      ).hexdigest()
                                      != item["sha256"]
                                  ):
                                      raise SystemExit(
                                          "legacy replacement retained successor "
                                          "live file digest differs"
                                      )
                              elif live_path.exists() or live_path.is_symlink():
                                  raise SystemExit(
                                      "legacy replacement retained legacy file "
                                      "still exists"
                                  )
                              elif hashlib.sha256(
                                  git_blob(
                                      Path(item["path"]),
                                      label="legacy retained predecessor file",
                                      max_bytes=16 * 1024 * 1024,
                                  )
                              ).hexdigest() != item["sha256"]:
                                  raise SystemExit(
                                      "legacy replacement retained predecessor "
                                      "file digest differs"
                                  )
                      if expected_successor_manifest_path not in manifest_paths:
                          raise SystemExit(
                              "legacy replacement retained successor lacks a "
                              "changed signed manifest"
                          )
                      retained_manifest_bytes = read_bounded_regular(
                          os.environ["RULESPEC_CHECKOUT"],
                          expected_successor_manifest_path,
                          label="legacy retained successor manifest",
                          max_bytes=1024 * 1024,
                      )
                      retained_manifest = json.loads(retained_manifest_bytes)
                      migration = retained_manifest.get("legacy_migration")
                      if (
                          retained_manifest.get("tool")
                          != "axiom-encode encode --apply "
                          "--legacy-retained-successor-rulespec-path"
                          or retained_manifest.get("applied_files")
                          != successor_files
                          or retained_manifest.get("retained_successor_manifest")
                          != successor_manifest["payload"]
                          or not isinstance(migration, dict)
                          or migration.get("receipt_path")
                          != receipt_path.as_posix()
                          or migration.get("receipt_sha256") != receipt_sha256
                          or migration.get("source") != retained_source
                          or migration.get("destination")
                          != retained_destination
                          or migration.get("legacy_manifest_path")
                          != expected_legacy_manifest_path.as_posix()
                          or migration.get("legacy_manifest_sha256")
                          != legacy_manifest["sha256"]
                          or migration.get("successor_manifest_sha256")
                          != successor_manifest["sha256"]
                      ):
                          raise SystemExit(
                              "legacy retained successor manifest binding differs"
                          )
                      expected_deleted_manifest_paths.add(
                          expected_legacy_manifest_path
                      )
                      applied_inventory.append(
                          {
                              "citation": None,
                              "path": expected_successor_manifest_path.as_posix(),
                              "sha256": hashlib.sha256(
                                  retained_manifest_bytes
                              ).hexdigest(),
                          }
                      )
                  for exact_dependent in exact_dependents:
                      primary = exact_dependent.get("primary")
                      if not isinstance(primary, str):
                          raise SystemExit(
                              "legacy replacement exact dependent is malformed"
                          )
                      exact_manifest_path = (
                          Path(".axiom/encoding-manifests")
                          / Path(primary).with_suffix(".json")
                      )
                      if exact_manifest_path not in manifest_paths:
                          raise SystemExit(
                              "legacy replacement exact dependent lacks "
                              "a changed signed manifest"
                          )
                      exact_manifest_bytes = read_bounded_regular(
                          os.environ["RULESPEC_CHECKOUT"],
                          exact_manifest_path,
                          label="legacy exact dependent manifest",
                          max_bytes=1024 * 1024,
                      )
                      exact_manifest = json.loads(exact_manifest_bytes)
                      migration = exact_manifest.get("legacy_migration")
                      if (
                          exact_manifest.get("tool")
                          != "axiom-encode encode --apply "
                          "--legacy-exact-dependent-rulespec-path"
                          or not isinstance(migration, dict)
                          or migration.get("receipt_path")
                          != receipt_path.as_posix()
                          or migration.get("receipt_sha256") != receipt_sha256
                          or migration.get("primary") != primary
                          or exact_manifest.get("applied_files")
                          != exact_dependent.get("live_files")
                      ):
                          raise SystemExit(
                              "legacy exact dependent manifest binding differs"
                          )
                      applied_inventory.append(
                          {
                              "citation": None,
                              "path": exact_manifest_path.as_posix(),
                              "sha256": hashlib.sha256(
                                  exact_manifest_bytes
                              ).hexdigest(),
                          }
                      )
                  scheduled = receipt_replacement.get("scheduled_dependents")
                  if not isinstance(scheduled, list):
                      raise SystemExit(
                          "legacy replacement scheduled dependents are malformed"
                      )
                  for dependent in scheduled:
                      if (
                          not isinstance(dependent, dict)
                          or not isinstance(dependent.get("primary"), str)
                          or not isinstance(dependent.get("files"), list)
                      ):
                          raise SystemExit(
                              "legacy replacement scheduled dependent is malformed"
                          )
                      dependent_manifest = (
                          Path(".axiom/encoding-manifests")
                          / Path(dependent["primary"]).with_suffix(".json")
                      )
                      if dependent_manifest not in manifest_paths:
                          raise SystemExit(
                              "legacy replacement scheduled dependent lacks "
                              "a changed signed manifest"
                          )
                      for evidence in dependent["files"]:
                          if not isinstance(evidence, dict):
                              raise SystemExit(
                                  "legacy replacement scheduled file is malformed"
                              )
                          pending_relative = Path(
                              str(evidence.get("path") or "")
                          )
                          pending_bytes = read_bounded_regular(
                              os.environ["RULESPEC_CHECKOUT"],
                              pending_relative,
                              label="legacy replacement scheduled dependent",
                              max_bytes=16 * 1024 * 1024,
                          )
                          if (
                              hashlib.sha256(pending_bytes).hexdigest()
                              == evidence.get("before_sha256")
                          ):
                              raise SystemExit(
                                  "legacy replacement scheduled dependent "
                                  "is still pending"
                              )
                          replacements = {
                              str(item["from"]): str(item["to"])
                              for item in evidence.get("replacements", [])
                              if isinstance(item, dict)
                              and set(item) == {"from", "to", "count"}
                          }
                          _rewritten, remaining = rewrite_exact_references(
                              pending_bytes, replacements
                          )
                          if (
                              len(replacements)
                              != len(evidence.get("replacements", []))
                              or remaining
                          ):
                              raise SystemExit(
                                  "legacy replacement scheduled dependent "
                                  "retains an old reference"
                              )
                  expected_old_manifest = Path(
                      ".axiom/encoding-manifests"
                  ) / Path(legacy_source_path).with_suffix(".json")
                  if legacy_source_path == normalized_replacement_path:
                      if expected_old_manifest != relative_path:
                          raise SystemExit(
                              "in-place legacy replacement manifest path differs"
                          )
                      live_primary = (
                          Path(os.environ["RULESPEC_CHECKOUT"])
                          / normalized_replacement_path
                      )
                      if not live_primary.is_file():
                          raise SystemExit(
                              "in-place legacy replacement primary is absent"
                          )
                  else:
                      expected_deleted_manifest_paths.add(expected_old_manifest)
                      if (
                          Path(os.environ["RULESPEC_CHECKOUT"]) / legacy_source_path
                      ).exists():
                          raise SystemExit(
                              "legacy replacement old primary still exists"
                          )
                  if deleted_manifest_paths != expected_deleted_manifest_paths:
                      raise SystemExit(
                          "legacy replacement deleted manifest inventory differs"
                      )
                  receipt_artifact = Path(sys.argv[1]).with_name(
                      "legacy-replacement-receipt.json"
                  )
                  receipt_artifact.write_bytes(receipt_bytes)
              elif lane == "target" and normalized_replacement_path:
                  applied_files = applied_manifest.get("applied_files")
                  if not isinstance(applied_files, list):
                      raise SystemExit(
                          "replacement apply manifest has malformed applied_files"
                      )
                  primary_paths = sorted(
                      item.get("path")
                      for item in applied_files
                      if isinstance(item, dict)
                      and isinstance(item.get("path"), str)
                      and item["path"].endswith(".yaml")
                      and not item["path"].endswith(".test.yaml")
                  )
                  if primary_paths != [normalized_replacement_path]:
                      raise SystemExit(
                          "replacement apply manifest primary path does not "
                          "match the requested RuleSpec target"
                      )
              context_path = Path(
                  evidence_manifest["context_manifest_file"]
              ).resolve()
              try:
                  context_path.relative_to(generated_root / lane)
              except ValueError as exc:
                  raise SystemExit(
                      f"signed context manifest is outside assigned {lane} lane"
                  ) from exc
              context_bytes = read_bounded_regular(
                  generated_root,
                  context_path.relative_to(generated_root),
                  label="signed context manifest",
                  max_bytes=16 * 1024 * 1024,
              )
              context_digest = hashlib.sha256(context_bytes).hexdigest()
              if context_digest != evidence_manifest.get(
                  "context_manifest_sha256"
              ):
                  raise SystemExit("signed context manifest digest does not match")

              context_payload = json.loads(context_bytes)
              if context_payload.get("citation") != citation:
                  raise SystemExit(
                      "signed context manifest citation does not match"
                  )
              if expected_review_contract is None:
                  if "review_contract" in context_payload:
                      raise SystemExit(
                          "context manifest contains an unexpected review contract"
                      )
              else:
                  try:
                      actual_review_contract = json.dumps(
                          context_payload.get("review_contract"),
                          allow_nan=False,
                          ensure_ascii=False,
                          separators=(",", ":"),
                          sort_keys=True,
                      )
                      normalized_expected_review_contract = json.dumps(
                          expected_review_contract,
                          allow_nan=False,
                          ensure_ascii=False,
                          separators=(",", ":"),
                          sort_keys=True,
                      )
                  except (TypeError, ValueError) as exc:
                      raise SystemExit(
                          "context manifest does not bind the normalized "
                          "review contract"
                      ) from exc
                  if (
                      actual_review_contract
                      != normalized_expected_review_contract
                  ):
                      raise SystemExit(
                          "context manifest does not bind the normalized "
                          "review contract"
                      )
              review_findings = context_payload.get("review_findings_files")
              if not isinstance(review_findings, list):
                  raise SystemExit(
                      "context manifest review findings evidence is malformed"
                  )
              if expected_review_finding is None and review_findings:
                  raise SystemExit(
                      "context manifest contains an unexpected review finding"
                  )
              expected_review_content = (
                  f"{expected_review_finding}\n"
                  if expected_review_finding is not None
                  else None
              )
              if expected_review_content is not None and (
                  len(review_findings) != 1
                  or review_findings[0].get("content")
                  != expected_review_content
              ):
                  raise SystemExit(
                      "context manifest does not bind the supplied review finding"
                  )
              for finding in review_findings:
                  if not isinstance(finding, dict):
                      raise SystemExit("context manifest review finding is malformed")
                  content = finding.get("content")
                  digest = finding.get("sha256")
                  if not isinstance(content, str) or not content.strip():
                      raise SystemExit(
                          "context manifest review finding content is empty"
                      )
                  if "\r" in content:
                      raise SystemExit(
                          "context manifest review finding is not normalized"
                      )
                  if any(
                      (ord(char) < 32 and char not in {"\n", "\t"})
                      or ord(char) == 127
                      for char in content
                  ):
                      raise SystemExit(
                          "context manifest review finding contains a forbidden control character"
                      )
                  if hashlib.sha256(content.encode("utf-8")).hexdigest() != digest:
                      raise SystemExit(
                          "context manifest review finding digest does not match"
                      )

              destination.write_bytes(context_bytes)
              applied_inventory.append(
                  {
                      "citation": citation,
                      "path": relative_path.as_posix(),
                      "sha256": hashlib.sha256(
                          read_bounded_regular(
                              os.environ["RULESPEC_CHECKOUT"],
                              relative_path,
                              label="packaged apply manifest",
                              max_bytes=1024 * 1024,
                          )
                      ).hexdigest(),
                  }
              )
          Path(sys.argv[2]).write_text(
              json.dumps(
                  {
                      "schema": "axiom-encode/applied-manifest-inventory/v1",
                      "items": applied_inventory,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          "${workflow_python[@]}" - "$artifact/metadata.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          def rev(path):
              return subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()

          repair_run_id = os.environ.get("REPAIR_RUN_ID") or None
          repair_candidate = None
          if repair_run_id:
              consumed_lane = os.environ.get("REPAIR_CANDIDATE_LANE", "")
              consumed_path = os.environ.get("REPAIR_CANDIDATE_PATH", "")
              consumed_runner = os.environ.get("REPAIR_CANDIDATE_RUNNER", "")
              consumed_source_rulespec_ref = os.environ.get(
                  "REPAIR_CANDIDATE_SOURCE_RULESPEC_REF", ""
              )
              consumed_rulespec_sha256 = os.environ.get(
                  "REPAIR_CANDIDATE_RULESPEC_SHA256", ""
              )
              consumed_tests_sha256 = os.environ.get(
                  "REPAIR_CANDIDATE_TESTS_SHA256", ""
              )
              if not re.fullmatch(r"[0-9a-f]{40}", consumed_source_rulespec_ref):
                  raise SystemExit(
                      "repair candidate source RuleSpec ref is malformed"
                  )
              if consumed_lane == "source-only":
                  if any(
                      (
                          consumed_path,
                          consumed_runner,
                          consumed_rulespec_sha256,
                          consumed_tests_sha256,
                      )
                  ):
                      raise SystemExit(
                          "source-only repair candidate evidence is malformed"
                      )
                  repair_candidate = {
                      "lane": consumed_lane,
                      "run_id": repair_run_id,
                      "source_rulespec_ref": consumed_source_rulespec_ref,
                  }
              else:
                  if consumed_lane not in {"target", "target-preflight", "dependent"}:
                      raise SystemExit("repair candidate evidence lane is malformed")
                  if not consumed_path or not re.fullmatch(
                      r"[a-z0-9][a-z0-9._:/-]*\.yaml", consumed_path
                  ):
                      raise SystemExit("repair candidate evidence path is malformed")
                  if not re.fullmatch(r"[a-z0-9][a-z0-9._-]*", consumed_runner):
                      raise SystemExit("repair candidate evidence runner is malformed")
                  if any(
                      re.fullmatch(r"[0-9a-f]{64}", digest) is None
                      for digest in (
                          consumed_rulespec_sha256,
                          consumed_tests_sha256,
                      )
                  ):
                      raise SystemExit("repair candidate evidence is malformed")
                  repair_candidate = {
                      "lane": consumed_lane,
                      "run_id": repair_run_id,
                      "path": consumed_path,
                      "runner": consumed_runner,
                      "source_rulespec_ref": consumed_source_rulespec_ref,
                      "rulespec_sha256": consumed_rulespec_sha256,
                      "tests_sha256": consumed_tests_sha256,
                  }

          payload = {
              "schema": "axiom-encode/targeted-reencode-artifact/v1",
              "citation": os.environ["CITATION"],
              "canonical_refresh_bundle": json.loads(
                  (
                      Path(os.environ["RUNNER_TEMP"])
                      / "canonical-refresh-bundle.json"
                  ).read_text(encoding="utf-8")
              ),
              "source_bundle": json.loads(
                  (
                      Path(os.environ["RUNNER_TEMP"]) / "source-bundle.json"
                  ).read_text(encoding="utf-8")
              ),
              "existing_signed_imports": json.loads(
                  (
                      Path(os.environ["RUNNER_TEMP"])
                      / "existing-signed-imports.json"
                  ).read_text(encoding="utf-8")
              ),
              "signed_import_inventory_sha256": hashlib.sha256(
                  (
                      Path(os.environ["RUNNER_TEMP"])
                      / "existing-signed-import-inventory.json"
                  ).read_bytes()
              ).hexdigest(),
              "dependent_citation": os.environ.get("DEPENDENT_CITATION") or None,
              "second_dependent_citation": (
                  os.environ.get("SECOND_DEPENDENT_CITATION") or None
              ),
              "replace_rulespec_path": (
                  os.environ.get("REPLACE_RULESPEC_PATH") or None
              ),
              "replace_legacy_rulespec_path": (
                  os.environ.get("REPLACE_LEGACY_RULESPEC_PATH") or None
              ),
              "legacy_exact_dependent_rulespec_path": (
                  os.environ.get("LEGACY_EXACT_DEPENDENT_RULESPEC_PATH") or None
              ),
              "second_legacy_exact_dependent_rulespec_path": (
                  os.environ.get(
                      "SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
                  ) or None
              ),
              "legacy_retained_successor_rulespec_paths": json.loads(
                  os.environ.get(
                      "LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON", "[]"
                  )
              ),
              "pr_base_branch": os.environ["PR_BASE_BRANCH"],
              "repair_candidate": repair_candidate,
              "repair_run_id": os.environ.get("REPAIR_RUN_ID") or None,
              "queue_id": os.environ.get("QUEUE_ID") or None,
              "queue_item_id": os.environ.get("QUEUE_ITEM_ID") or None,
              "queue_item_generation_sha256": (
                  os.environ.get("QUEUE_ITEM_GENERATION_SHA256") or None
              ),
              "queue_manifest_sha256": (
                  os.environ.get("QUEUE_MANIFEST_SHA256") or None
              ),
              "rulespec_base": os.environ["RULESPEC_REF"],
              "rulespec_generated_head": rev(os.environ["RULESPEC_CHECKOUT"]),
              "encoder_commit": rev("axiom-encode"),
              "corpus_commit": rev("axiom-corpus"),
              "rules_engine_commit": rev("axiom-rules-engine"),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          test -s "$artifact/status.txt"

      - name: Commit reviewed lane changes locally
        id: commit_reviewed_lane_changes
        if: ${{ inputs.open_pr }}
        env:
          COUNTRY: ${{ inputs.country }}
          CITATION: ${{ inputs.citation }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
        run: |
          set -euo pipefail
          workflow_python=(/opt/axiom-verification/python/bin/python -I)
          if [ ! -x "${workflow_python[0]}" ]; then
            workflow_python=("${AXIOM_TEST_PYTHON:-python}")
          fi
          branch="$("${workflow_python[@]}" \
            axiom-encode/scripts/prepare_signed_backfill.py branch-name \
            "$COUNTRY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          git -C "$RULESPEC_CHECKOUT" switch -c "$branch"
          if jq -e 'length > 0' \
               "$RUNNER_TEMP/source-bundle.json" > /dev/null || \
             jq -e 'length > 0' \
               "$RUNNER_TEMP/canonical-refresh-bundle.json" > /dev/null; then
            test -z "$(git -C "$RULESPEC_CHECKOUT" status --porcelain)"
          else
            /opt/axiom-verification/axiom-encode-signing-supervisor \
              --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
              --trusted-python-runtime-root /opt/axiom-verification/python \
              --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages \
              --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode \
              -- /opt/axiom-verification/axiom-encode stage-signed-backfill \
              --repo "$RULESPEC_CHECKOUT" \
              --corpus-path "$GITHUB_WORKSPACE/axiom-corpus"
            git -C "$RULESPEC_CHECKOUT" \
              -c core.hooksPath=/dev/null \
              -c user.name=axiom-encode-bot \
              -c user.email=axiom-encode-bot@users.noreply.github.com \
              commit -m "Add signed encoding manifest for ${CITATION}"
          fi

      - name: Push lane branch and open draft pull request
        id: publish_lane_pull_request
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ secrets.AXIOM_REPO_TOKEN }}
          COUNTRY: ${{ inputs.country }}
          CITATION: ${{ inputs.citation }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON: ${{ inputs.legacy_retained_successor_rulespec_paths_json }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_ITEM_ID: ${{ inputs.queue_item_id }}
          QUEUE_ITEM_GENERATION_SHA256: ${{ inputs.queue_item_generation_sha256 }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          workflow_python=(/opt/axiom-verification/python/bin/python -I)
          if [ ! -x "${workflow_python[0]}" ]; then
            workflow_python=("${AXIOM_TEST_PYTHON:-python}")
          fi
          repo="TheAxiomFoundation/rulespec-${COUNTRY}"
          git -C "$RULESPEC_CHECKOUT" fetch --no-tags origin \
            "+refs/heads/${PR_BASE_BRANCH}:refs/remotes/origin/${PR_BASE_BRANCH}"
          test "$(git -C "$RULESPEC_CHECKOUT" rev-parse \
            "refs/remotes/origin/${PR_BASE_BRANCH}")" = "$RULESPEC_REF"
          branch="$("${workflow_python[@]}" \
            axiom-encode/scripts/prepare_signed_backfill.py branch-name \
            "$COUNTRY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          source_bundle="$(tr -d '\n' < "$RUNNER_TEMP/source-bundle.json")"
          canonical_refresh_bundle="$(tr -d '\n' \
            < "$RUNNER_TEMP/canonical-refresh-bundle.json")"
          existing_signed_imports="$(tr -d '\n' \
            < "$RUNNER_TEMP/existing-signed-imports.json")"
          body="$(printf '%s\n' \
            '## Signed apply manifest' \
            '' \
            "Citation: \`${CITATION}\`" \
            "Independent canonical refresh bundle: \`${canonical_refresh_bundle}\`" \
            "Atomic source bundle: \`${source_bundle}\`" \
            "Existing signed imports: \`${existing_signed_imports}\`" \
            "Direct dependent: \`${DEPENDENT_CITATION:-n/a}\`" \
            "Second direct dependent: \`${SECOND_DEPENDENT_CITATION:-n/a}\`" \
            "Exact legacy dependent: \`${LEGACY_EXACT_DEPENDENT_RULESPEC_PATH:-n/a}\`" \
            "Second exact legacy dependent: \`${SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH:-n/a}\`" \
            "Retained successor legacy paths: \`${LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON:-[]}\`" \
            "Repair candidate run: \`${REPAIR_RUN_ID:-n/a}\`" \
            "Base commit: \`${RULESPEC_REF}\`" \
            "Base branch: \`${PR_BASE_BRANCH}\`" \
            "Queue item: \`${QUEUE_ID:-ad-hoc}/${QUEUE_ITEM_ID:-ad-hoc}\`" \
            "Queue generation SHA-256: \`${QUEUE_ITEM_GENERATION_SHA256:-n/a}\`" \
            "Queue manifest SHA-256: \`${QUEUE_MANIFEST_SHA256:-n/a}\`" \
            "Axiom Encode run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '' \
            'This draft PR was produced by the protected country-general signed-apply workflow. Review all RuleSpec and manifest changes before marking it ready.')"
          gh auth setup-git
          git -C "$RULESPEC_CHECKOUT" -c core.hooksPath=/dev/null push \
            "https://github.com/${repo}.git" "HEAD:refs/heads/${branch}"
          gh api --method POST "repos/${repo}/pulls" \
            -f title="Add signed encoding manifest for ${CITATION}" \
            -f head="TheAxiomFoundation:${branch}" \
            -f base="$PR_BASE_BRANCH" \
            -f body="$body" \
            -F draft=true > "$RUNNER_TEMP/lane-pull-request.json"
          if ! jq -e \
            --arg branch "$PR_BASE_BRANCH" \
            --arg sha "$RULESPEC_REF" \
            '.base.ref == $branch and .base.sha == $sha' \
            "$RUNNER_TEMP/lane-pull-request.json" > /dev/null; then
            pr_number="$(jq -r '.number // empty' \
              "$RUNNER_TEMP/lane-pull-request.json")"
            if test -n "$pr_number"; then
              gh api --method PATCH "repos/${repo}/pulls/${pr_number}" \
                -f state=closed || echo "warning: failed to close stale-base PR" >&2
            fi
            git -C "$RULESPEC_CHECKOUT" push \
              "https://github.com/${repo}.git" \
              ":refs/heads/${branch}" ||
              echo "warning: failed to delete stale-base lane branch" >&2
            echo "created pull request does not target the reviewed base SHA" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/lane-pull-request.json" \
            "$RUNNER_TEMP/targeted-reencode/lane-pull-request.json"

      - name: Finalize signed re-encode artifact checksums
        id: finalize_signed_reencode_artifact
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/targeted-reencode"
          (
            cd "$artifact"
            sha256sum * > SHA256SUMS
          )

      - name: Upload signed re-encode artifact
        id: upload_signed_reencode_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: targeted-reencode-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/targeted-reencode
          if-no-files-found: error
          retention-days: 90

      - name: Package failed re-encode diagnostics
        id: package_failed_reencode_diagnostics
        if: ${{ failure() && !cancelled() }}
        env:
          ATOMIC_SOURCE_JSON: ${{ inputs.source_bundle_json }}
          CITATION: ${{ inputs.citation }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          COUNTRY: ${{ inputs.country }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          ENCODE_APPLY_CONCLUSION: ${{ steps.encode_apply.conclusion }}
          ENCODE_APPLY_OUTCOME: ${{ steps.encode_apply.outcome }}
          EXISTING_SIGNED_IMPORTS_JSON: ${{ inputs.existing_signed_imports_json }}
          FINALIZE_SIGNED_REENCODE_ARTIFACT_CONCLUSION: ${{ steps.finalize_signed_reencode_artifact.conclusion }}
          FINALIZE_SIGNED_REENCODE_ARTIFACT_OUTCOME: ${{ steps.finalize_signed_reencode_artifact.outcome }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON: ${{ inputs.legacy_retained_successor_rulespec_paths_json }}
          OPEN_PR: ${{ inputs.open_pr }}
          PACKAGE_EXACT_GENERATED_CHANGES_CONCLUSION: ${{ steps.package_exact_generated_changes.conclusion }}
          PACKAGE_EXACT_GENERATED_CHANGES_OUTCOME: ${{ steps.package_exact_generated_changes.outcome }}
          COMMIT_REVIEWED_LANE_CHANGES_CONCLUSION: ${{ steps.commit_reviewed_lane_changes.conclusion }}
          COMMIT_REVIEWED_LANE_CHANGES_OUTCOME: ${{ steps.commit_reviewed_lane_changes.outcome }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          REPAIR_CANDIDATE_CONCLUSION: ${{ steps.repair_candidate.conclusion }}
          REPAIR_CANDIDATE_LANE: ${{ steps.repair_candidate.outputs.lane }}
          REPAIR_CANDIDATE_OUTCOME: ${{ steps.repair_candidate.outcome }}
          REPAIR_CANDIDATE_PATH: ${{ steps.repair_candidate.outputs.path }}
          REPAIR_CANDIDATE_RUNNER: ${{ steps.repair_candidate.outputs.runner }}
          REPAIR_CANDIDATE_SOURCE_RULESPEC_REF: ${{ steps.repair_candidate.outputs.source_rulespec_ref }}
          REPAIR_CANDIDATE_RULESPEC_SHA256: ${{ steps.repair_candidate.outputs.rulespec_sha256 }}
          REPAIR_CANDIDATE_TESTS_SHA256: ${{ steps.repair_candidate.outputs.tests_sha256 }}
          PROVISION_SIGNING_SUPERVISOR_CONCLUSION: ${{ steps.provision_signing_supervisor.conclusion }}
          PUBLISH_LANE_PULL_REQUEST_CONCLUSION: ${{ steps.publish_lane_pull_request.conclusion }}
          PUBLISH_LANE_PULL_REQUEST_OUTCOME: ${{ steps.publish_lane_pull_request.outcome }}
          QUEUE_DISPATCHER_RUN_ID: ${{ inputs.queue_dispatcher_run_id }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_ITEM_GENERATION_SHA256: ${{ inputs.queue_item_generation_sha256 }}
          QUEUE_ITEM_ID: ${{ inputs.queue_item_id }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          RULES_ENGINE_REF: ${{ inputs.rules_engine_ref }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          UPLOAD_SIGNED_REENCODE_ARTIFACT_CONCLUSION: ${{ steps.upload_signed_reencode_artifact.conclusion }}
          UPLOAD_SIGNED_REENCODE_ARTIFACT_OUTCOME: ${{ steps.upload_signed_reencode_artifact.outcome }}
          VERIFY_EXISTING_SIGNED_IMPORT_INTEGRITY_CONCLUSION: ${{ steps.verify_existing_signed_import_integrity.conclusion }}
          VERIFY_EXISTING_SIGNED_IMPORT_INTEGRITY_OUTCOME: ${{ steps.verify_existing_signed_import_integrity.outcome }}
          VERIFY_GENERATED_PROVENANCE_CONCLUSION: ${{ steps.verify_generated_provenance.conclusion }}
          VERIFY_GENERATED_PROVENANCE_OUTCOME: ${{ steps.verify_generated_provenance.outcome }}
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated"
          artifact="$RUNNER_TEMP/targeted-reencode-failure"
          mkdir -p "$artifact"
          workflow_python=/usr/bin/python3
          if [ "${PROVISION_SIGNING_SUPERVISOR_CONCLUSION:-}" = success ] && \
             [ -x /opt/axiom-verification/python/bin/python ]; then
            workflow_python=/opt/axiom-verification/python/bin/python
          fi
          test -x "$workflow_python"
          "$workflow_python" -I - \
            "$generated" "$artifact" \
            "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          from pathlib import Path

          class UnsafeDiagnosticPathError(Exception):
              pass


          def read_bounded_regular_file(root, candidate, *, label, max_bytes):
              nofollow = getattr(os, "O_NOFOLLOW", None)
              directory = getattr(os, "O_DIRECTORY", None)
              if nofollow is None or directory is None:
                  raise UnsafeDiagnosticPathError(
                      f"{label} cannot be opened safely on this platform"
                  )
              raw_root = Path(os.path.abspath(root))
              raw_candidate = Path(os.path.abspath(candidate))
              try:
                  relative = raw_candidate.relative_to(raw_root)
              except ValueError as exc:
                  raise UnsafeDiagnosticPathError(
                      f"{label} is outside {raw_root}: {candidate}"
                  ) from exc
              if not relative.parts:
                  raise UnsafeDiagnosticPathError(
                      f"{label} is not a file: {candidate}"
                  )

              base_flags = os.O_RDONLY | nofollow | getattr(os, "O_CLOEXEC", 0)
              nonblocking = getattr(os, "O_NONBLOCK", 0)
              descriptors = []
              file_descriptor = None
              try:
                  parent_descriptor = os.open(raw_root, base_flags | directory)
                  descriptors.append(parent_descriptor)
                  for part in relative.parts[:-1]:
                      parent_descriptor = os.open(
                          part,
                          base_flags | directory,
                          dir_fd=parent_descriptor,
                      )
                      descriptors.append(parent_descriptor)
                  file_descriptor = os.open(
                      relative.parts[-1],
                      base_flags | nonblocking,
                      dir_fd=parent_descriptor,
                  )
                  file_stat = os.fstat(file_descriptor)
                  if not stat.S_ISREG(file_stat.st_mode):
                      raise UnsafeDiagnosticPathError(
                          f"{label} is not a regular file: {candidate}"
                      )
                  if file_stat.st_size > max_bytes:
                      raise UnsafeDiagnosticPathError(
                          f"{label} exceeds the {max_bytes}-byte safety limit: "
                          f"{candidate}"
                      )
                  chunks = []
                  remaining = max_bytes + 1
                  while remaining:
                      chunk = os.read(
                          file_descriptor,
                          min(1024 * 1024, remaining),
                      )
                      if not chunk:
                          break
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  raw = b"".join(chunks)
                  if len(raw) > max_bytes:
                      raise UnsafeDiagnosticPathError(
                          f"{label} exceeds the {max_bytes}-byte safety limit: "
                          f"{candidate}"
                      )
                  return raw
              except UnsafeDiagnosticPathError:
                  raise
              except OSError as exc:
                  raise UnsafeDiagnosticPathError(
                      f"Could not safely open {label}: {candidate}"
                  ) from exc
              finally:
                  if file_descriptor is not None:
                      os.close(file_descriptor)
                  for descriptor in reversed(descriptors):
                      os.close(descriptor)

          generated = Path(os.path.abspath(sys.argv[1]))
          artifact = Path(os.path.abspath(sys.argv[2]))
          guard_root = Path(os.path.abspath(sys.argv[3]))
          allowed_suffixes = {".json", ".log", ".txt", ".yaml", ".yml"}
          max_entries = 4096
          max_files = 1024
          max_file_bytes = 16 * 1024 * 1024
          max_total_bytes = 64 * 1024 * 1024
          entry_count = 0
          total_bytes = 0
          inventory = []

          if generated.exists():
              root_stat = os.lstat(generated)
              if not stat.S_ISDIR(root_stat.st_mode):
                  raise SystemExit("generated diagnostic root is not a directory")
              for directory, dirnames, filenames in os.walk(
                  generated,
                  topdown=True,
                  followlinks=False,
              ):
                  entry_count += len(dirnames) + len(filenames)
                  if entry_count > max_entries:
                      raise SystemExit("generated diagnostics exceed entry limit")
                  current = Path(directory)
                  for name in dirnames:
                      mode = os.lstat(current / name).st_mode
                      if not stat.S_ISDIR(mode):
                          raise SystemExit(
                              "generated diagnostics contain a non-directory entry"
                          )
                  for name in sorted(filenames):
                      source = current / name
                      mode = os.lstat(source).st_mode
                      if not stat.S_ISREG(mode):
                          raise SystemExit(
                              "generated diagnostics contain a non-regular file"
                          )
                      relative = source.relative_to(generated)
                      if source.suffix.lower() not in allowed_suffixes:
                          continue
                      if len(inventory) >= max_files:
                          raise SystemExit("generated diagnostics exceed file limit")
                      try:
                          payload = read_bounded_regular_file(
                              generated,
                              source,
                              label="failed re-encode diagnostic",
                              max_bytes=max_file_bytes,
                          )
                      except UnsafeDiagnosticPathError as exc:
                          raise SystemExit(str(exc)) from exc
                      total_bytes += len(payload)
                      if total_bytes > max_total_bytes:
                          raise SystemExit("generated diagnostics exceed size limit")
                      destination = artifact / "generated" / relative
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(payload)
                      inventory.append(
                          {
                              "path": relative.as_posix(),
                              "sha256": hashlib.sha256(payload).hexdigest(),
                              "size": len(payload),
                          }
                      )

          guard_candidates = [
              guard_root / "guard-generated.json",
              guard_root / "checkpoint-guard-generated.json",
              guard_root / "target-preflight-guard-generated.json",
              *[
                  guard_root / f"source-{index:02d}-guard-generated.json"
                  for index in range(1, 17)
              ],
          ]
          guard_inventory = []
          for guard_generated in guard_candidates:
              if not guard_generated.exists() and not guard_generated.is_symlink():
                  continue
              try:
                  guard_payload = read_bounded_regular_file(
                      guard_root,
                      guard_generated,
                      label="generated provenance guard diagnostics",
                      max_bytes=1024 * 1024,
                  )
              except UnsafeDiagnosticPathError as exc:
                  raise SystemExit(str(exc)) from exc
              try:
                  parsed_guard = json.loads(guard_payload)
              except (json.JSONDecodeError, UnicodeDecodeError, RecursionError) as exc:
                  raise SystemExit(
                      "generated provenance guard diagnostics are not valid JSON"
                  ) from exc
              if (
                  not isinstance(parsed_guard, dict)
                  or set(parsed_guard) != {"repo", "passed", "issues"}
                  or not isinstance(parsed_guard["repo"], str)
                  or not isinstance(parsed_guard["passed"], bool)
                  or not isinstance(parsed_guard["issues"], list)
                  or any(not isinstance(issue, str) for issue in parsed_guard["issues"])
              ):
                  raise SystemExit(
                      "generated provenance guard diagnostics have invalid shape"
                  )
              guard_destination = artifact / "guards" / guard_generated.name
              guard_destination.parent.mkdir(parents=True, exist_ok=True)
              guard_destination.write_bytes(guard_payload)
              guard_inventory.append(
                  {
                      "path": f"guards/{guard_generated.name}",
                      "sha256": hashlib.sha256(guard_payload).hexdigest(),
                      "size": len(guard_payload),
                  }
              )

          guard_log_candidates = [
              guard_root / "checkpoint-guard-generated.stderr.log",
              guard_root / "checkpoint-guard-generated.stdout.log",
          ]
          for guard_log in guard_log_candidates:
              if not guard_log.exists() and not guard_log.is_symlink():
                  continue
              try:
                  guard_payload = read_bounded_regular_file(
                      guard_root,
                      guard_log,
                      label="generated provenance guard raw diagnostics",
                      max_bytes=1024 * 1024,
                  )
              except UnsafeDiagnosticPathError as exc:
                  raise SystemExit(str(exc)) from exc
              guard_destination = artifact / "guards" / guard_log.name
              guard_destination.parent.mkdir(parents=True, exist_ok=True)
              guard_destination.write_bytes(guard_payload)
              guard_inventory.append(
                  {
                      "path": f"guards/{guard_log.name}",
                      "sha256": hashlib.sha256(guard_payload).hexdigest(),
                      "size": len(guard_payload),
                  }
              )

          inventory.sort(key=lambda item: item["path"])
          step_env_prefixes = {
              "commit_reviewed_lane_changes": "COMMIT_REVIEWED_LANE_CHANGES",
              "encode_apply": "ENCODE_APPLY",
              "finalize_signed_reencode_artifact": (
                  "FINALIZE_SIGNED_REENCODE_ARTIFACT"
              ),
              "package_exact_generated_changes": "PACKAGE_EXACT_GENERATED_CHANGES",
              "publish_lane_pull_request": "PUBLISH_LANE_PULL_REQUEST",
              "repair_candidate": "REPAIR_CANDIDATE",
              "upload_signed_reencode_artifact": (
                  "UPLOAD_SIGNED_REENCODE_ARTIFACT"
              ),
              "verify_existing_signed_import_integrity": (
                  "VERIFY_EXISTING_SIGNED_IMPORT_INTEGRITY"
              ),
              "verify_generated_provenance": "VERIFY_GENERATED_PROVENANCE",
          }
          step_outcomes = {}
          for step_id, env_prefix in step_env_prefixes.items():
              outcome = os.environ.get(f"{env_prefix}_OUTCOME") or None
              conclusion = os.environ.get(f"{env_prefix}_CONCLUSION") or None
              if outcome is None and conclusion is None:
                  continue
              step_outcomes[step_id] = {
                  "conclusion": conclusion,
                  "outcome": outcome,
              }
          failed_steps = sorted(
              step_id
              for step_id, payload in step_outcomes.items()
              if "failure" in {payload["outcome"], payload["conclusion"]}
          )
          generated_lanes = sorted(
              {
                  Path(item["path"]).parts[0]
                  for item in inventory
                  if len(Path(item["path"]).parts) > 1
              }
          )
          repair_candidate = None
          if os.environ.get("REPAIR_CANDIDATE_CONCLUSION") == "success":
              consumed_lane = os.environ.get("REPAIR_CANDIDATE_LANE", "")
              consumed_path = os.environ.get("REPAIR_CANDIDATE_PATH", "")
              consumed_runner = os.environ.get("REPAIR_CANDIDATE_RUNNER", "")
              consumed_source_rulespec_ref = os.environ.get(
                  "REPAIR_CANDIDATE_SOURCE_RULESPEC_REF", ""
              )
              consumed_rulespec_sha256 = os.environ.get(
                  "REPAIR_CANDIDATE_RULESPEC_SHA256", ""
              )
              consumed_tests_sha256 = os.environ.get(
                  "REPAIR_CANDIDATE_TESTS_SHA256", ""
              )
              if not re.fullmatch(r"[0-9a-f]{40}", consumed_source_rulespec_ref):
                  raise SystemExit(
                      "repair candidate source RuleSpec ref is malformed"
                  )
              if consumed_lane == "source-only":
                  if any(
                      (
                          consumed_path,
                          consumed_runner,
                          consumed_rulespec_sha256,
                          consumed_tests_sha256,
                      )
                  ):
                      raise SystemExit(
                          "source-only repair candidate evidence is malformed"
                      )
                  repair_candidate = {
                      "lane": consumed_lane,
                      "run_id": os.environ.get("REPAIR_RUN_ID") or None,
                      "source_rulespec_ref": consumed_source_rulespec_ref,
                  }
              else:
                  if consumed_lane not in {"target", "target-preflight", "dependent"}:
                      raise SystemExit("repair candidate evidence lane is malformed")
                  if not consumed_path or not re.fullmatch(
                      r"[a-z0-9][a-z0-9._:/-]*\.yaml", consumed_path
                  ):
                      raise SystemExit("repair candidate evidence path is malformed")
                  if not re.fullmatch(r"[a-z0-9][a-z0-9._-]*", consumed_runner):
                      raise SystemExit("repair candidate evidence runner is malformed")
                  if any(
                      re.fullmatch(r"[0-9a-f]{64}", digest) is None
                      for digest in (
                          consumed_rulespec_sha256,
                          consumed_tests_sha256,
                      )
                  ):
                      raise SystemExit("repair candidate evidence is malformed")
                  repair_candidate = {
                      "lane": consumed_lane,
                      "run_id": os.environ.get("REPAIR_RUN_ID") or None,
                      "path": consumed_path,
                      "runner": consumed_runner,
                      "source_rulespec_ref": consumed_source_rulespec_ref,
                      "rulespec_sha256": consumed_rulespec_sha256,
                      "tests_sha256": consumed_tests_sha256,
                  }
          metadata = {
              "schema": "axiom-encode/failed-reencode-diagnostics/v1",
              "citation": os.environ["CITATION"],
              "corpus_ref": os.environ["CORPUS_REF"],
              "country": os.environ["COUNTRY"],
              "dependent_citation": os.environ.get("DEPENDENT_CITATION") or None,
              "encoder_commit": os.environ["GITHUB_SHA"],
              "existing_signed_imports_input": os.environ.get(
                  "EXISTING_SIGNED_IMPORTS_JSON", "[]"
              ),
              "failed_steps": failed_steps,
              "files": inventory,
              "generated_lanes": generated_lanes,
              "guards": sorted(guard_inventory, key=lambda item: item["path"]),
              "legacy_exact_dependent_rulespec_path": os.environ.get(
                  "LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
              )
              or None,
              "legacy_retained_successor_rulespec_paths_input": os.environ.get(
                  "LEGACY_RETAINED_SUCCESSOR_RULESPEC_PATHS_JSON", "[]"
              ),
              "open_pr": os.environ.get("OPEN_PR") == "true",
              "pr_base_branch": os.environ.get("PR_BASE_BRANCH") or None,
              "queue_dispatcher_run_id": os.environ.get(
                  "QUEUE_DISPATCHER_RUN_ID"
              )
              or None,
              "queue_id": os.environ.get("QUEUE_ID") or None,
              "queue_item_generation_sha256": os.environ.get(
                  "QUEUE_ITEM_GENERATION_SHA256"
              )
              or None,
              "queue_item_id": os.environ.get("QUEUE_ITEM_ID") or None,
              "queue_manifest_sha256": os.environ.get("QUEUE_MANIFEST_SHA256")
              or None,
              "replace_legacy_rulespec_path": os.environ.get(
                  "REPLACE_LEGACY_RULESPEC_PATH"
              )
              or None,
              "replace_rulespec_path": os.environ.get("REPLACE_RULESPEC_PATH")
              or None,
              "repair_candidate": repair_candidate,
              "repair_run_id": os.environ.get("REPAIR_RUN_ID") or None,
              "rules_engine_ref": os.environ["RULES_ENGINE_REF"],
              "rulespec_ref": os.environ["RULESPEC_REF"],
              "second_dependent_citation": os.environ.get(
                  "SECOND_DEPENDENT_CITATION"
              )
              or None,
              "second_legacy_exact_dependent_rulespec_path": os.environ.get(
                  "SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
              )
              or None,
              "atomic_source_input": os.environ.get("ATOMIC_SOURCE_JSON", "[]"),
              "step_outcomes": step_outcomes,
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          (artifact / "metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          tar -cf "$RUNNER_TEMP/targeted-reencode-failure.tar" \
            -C "$artifact" .

      - name: Upload failed re-encode diagnostics
        if: >-
          ${{ failure() && !cancelled()
              && steps.package_failed_reencode_diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: targeted-reencode-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/targeted-reencode-failure.tar
          if-no-files-found: error
          retention-days: 90
