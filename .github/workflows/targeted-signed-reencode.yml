                      "replacement RuleSpec path is not canonical checkout-relative"
                  )
              normalized_replacement_path = candidate.as_posix()
          expected_citations = {os.environ["CITATION"]}
          canonical_refresh_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "canonical-refresh-bundle.json"
          )
          canonical_refresh_items = json.loads(
              canonical_refresh_path.read_text()
          )
          if not isinstance(canonical_refresh_items, list) or not all(
              isinstance(item, dict)
              and set(item)
              == {
                  "citation",
                  "rulespec_path",
                  "rulespec_sha256",
                  "companion_path",
                  "companion_sha256",
                  "manifest_path",
                  "manifest_sha256",
                  "review_finding",
                  "deferred_output_contracts",
                  "required_test_cases",
              }
              and isinstance(item["citation"], str)
              and item["citation"]
              and isinstance(item["rulespec_path"], str)
              and item["rulespec_path"]
              and isinstance(item["companion_path"], str)
              and item["companion_path"]
              and isinstance(item["deferred_output_contracts"], list)
              and len(item["deferred_output_contracts"]) <= 16
              and isinstance(item["required_test_cases"], list)
              and len(item["required_test_cases"]) <= 32
              and all(
                  isinstance(case, dict)
                  and set(case)
                  == {"name", "period", "input", "required_output"}
                  and isinstance(case["name"], str)
                  and case["name"]
                  and isinstance(case["period"], dict)
                  and isinstance(case["input"], dict)
                  and len(case["input"]) <= 64
                  and isinstance(case["required_output"], dict)
                  and case["required_output"]
                  and len(case["required_output"]) <= 64
                  for case in item["required_test_cases"]
              )
              and len({case["name"] for case in item["required_test_cases"]})
              == len(item["required_test_cases"])
              and all(
                  isinstance(contract, dict)
                  and set(contract) == {"output", "reason"}
                  and all(
                      isinstance(contract[field], str)
                      and contract[field]
                      and contract[field] == contract[field].strip()
                      and "\r" not in contract[field]
                      and not any(
                          (ord(char) < 32 and char not in {"\n", "\t"})
                          or ord(char) == 127
                          for char in contract[field]
                      )
                      for field in ("output", "reason")
                  )
                  for contract in item["deferred_output_contracts"]
              )
              and len(
                  {
                      contract["output"]
                      for contract in item["deferred_output_contracts"]
                  }
              )
              == len(item["deferred_output_contracts"])
              and (
                  item["review_finding"] is None
                  or (
                      isinstance(item["review_finding"], str)
                      and item["review_finding"]
                      and item["review_finding"]
                      == item["review_finding"].strip()
                      and "\r" not in item["review_finding"]
                      and not any(
                          (ord(char) < 32 and char not in {"\n", "\t"})
                          or ord(char) == 127
                          for char in item["review_finding"]
                      )
                  )
              )
              and (
                  item["companion_sha256"] is None
                  or (
                      isinstance(item["companion_sha256"], str)
                      and re.fullmatch(
                          r"[0-9a-f]{64}", item["companion_sha256"]
                      )
                      is not None
                  )
              )
              for item in canonical_refresh_items
          ):
              raise SystemExit("normalized canonical refresh bundle is malformed")
          expected_citations.update(
              item["citation"] for item in canonical_refresh_items
          )
          source_bundle_path = Path(os.environ["RUNNER_TEMP"]) / "source-bundle.json"
          source_bundle_citations = json.loads(source_bundle_path.read_text())
          if not isinstance(source_bundle_citations, list) or not all(
              isinstance(item, str) and item for item in source_bundle_citations
          ):
