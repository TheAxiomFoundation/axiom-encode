          expected_citations.update(source_bundle_citations)
          if dependent_citation:
              expected_citations.add(dependent_citation)
          if second_dependent_citation:
              expected_citations.add(second_dependent_citation)

          matches = {}
          for relative_path in sorted(manifest_paths):
              payload = json.loads(
                  read_bounded_regular(
                      os.environ["RULESPEC_CHECKOUT"],
                      relative_path,
                      label="changed apply manifest",
                      max_bytes=1024 * 1024,
                  ).decode("utf-8")
              )
              effective = payload
              if (
                  payload.get("tool")
                  == "axiom-encode encode --apply --replace-legacy-rulespec-path"
              ):
                  effective = payload.get("replacement_manifest")
                  if not isinstance(effective, dict):
                      raise SystemExit(
                          "legacy replacement omits nested model manifest"
                      )
              citation = effective.get("citation")
              if (
                  payload.get("schema_version")
                  == "axiom-encode/applied-rulespec/v5"
                  and citation in expected_citations
              ):
                  matches.setdefault(citation, []).append(
                      (relative_path, payload, effective)
                  )

          if canonical_refresh_items:
              requested_manifest_paths = {
                  Path(item["manifest_path"])
                  for item in canonical_refresh_items
              }
              if (
                  len(requested_manifest_paths) != len(canonical_refresh_items)
                  or requested_manifest_paths != manifest_paths
                  or deleted_manifest_paths
              ):
                  raise SystemExit(
                      "canonical refresh changed manifest inventory differs "
                      "from its exact requested targets"
                  )

          def normalized_review_contract(refresh_item):
              deferred = refresh_item["deferred_output_contracts"]
              required_cases = refresh_item["required_test_cases"]
              if not deferred and not required_cases:
                  return None
              payload = {
                  "schema": (
                      "axiom-encode/review-contract/v2"
                      if required_cases
                      else "axiom-encode/review-contract/v1"
                  ),
                  "citation": refresh_item["citation"],
                  "rulespec_path": refresh_item["rulespec_path"],
                  "required_deferred_outputs": deferred,
              }
              if required_cases:
                  payload["required_test_cases"] = required_cases
              return payload

          expected = []
          if canonical_refresh_items:
              for refresh_index, refresh_item in enumerate(
                  canonical_refresh_items
              ):
                  refresh_lane = (
                      "target"
                      if refresh_index == 0
                      else f"canonical-refresh-{refresh_index:02d}"
                  )
                  expected.append(
                      (
                          refresh_item["citation"],
                          (
                              os.environ["REVIEW_FINDING"] or None
                              if refresh_index == 0
                              else refresh_item["review_finding"]
                          ),
                          (
                              Path(sys.argv[1])
                              if refresh_index == 0
                              else Path(sys.argv[1]).with_name(
                                  f"{refresh_lane}-context-manifest.json"
                              )
                          ),
                          refresh_lane,
                          refresh_item["rulespec_path"],
                          refresh_item["companion_path"],
                          refresh_item["manifest_path"],
                          normalized_review_contract(refresh_item),
                      )
                  )
          else:
              expected.append(
                  (
                      os.environ["CITATION"],
                      os.environ["REVIEW_FINDING"] or None,
                      Path(sys.argv[1]),
                      "target",
                      normalized_replacement_path or None,
                      None,
                      None,
                      None,
                  )
              )
          for source_index, source_citation in enumerate(
              source_bundle_citations, start=1
          ):
              source_lane = f"source-{source_index:02d}"
              expected.append(
                  (
                      source_citation,
                      None,
                      Path(sys.argv[1]).with_name(
                          f"{source_lane}-context-manifest.json"
                      ),
                      source_lane,
                      None,
                      None,
                      None,
                      None,
                  )
              )
          if dependent_citation:
              expected.append(
                  (
                      dependent_citation,
                      os.environ["DEPENDENT_REVIEW_FINDING"] or None,
                      Path(sys.argv[1]).with_name("dependent-context-manifest.json"),
                      "dependent",
                      None,
                      None,
                      None,
                      None,
                  )
              )
          if second_dependent_citation:
              expected.append(
                  (
                      second_dependent_citation,
                      os.environ["SECOND_DEPENDENT_REVIEW_FINDING"] or None,
                      Path(sys.argv[1]).with_name(
                          "dependent-2-context-manifest.json"
                      ),
                      "dependent-2",
                      None,
                      None,
                      None,
                      None,
                  )
              )

          generated_root = (Path(os.environ["RUNNER_TEMP"]) / "generated").resolve()
          applied_inventory = []
          for (
              citation,
              expected_review_finding,
              destination,
              lane,
              expected_primary_path,
              expected_companion_path,
              expected_manifest_path,
              expected_review_contract,
          ) in expected:
              citation_matches = matches.get(citation, [])
              if len(citation_matches) != 1:
                  raise SystemExit(
                      "expected exactly one changed signed apply manifest for "
                      f"{citation}; found {len(citation_matches)}"
                  )
              relative_path, applied_manifest, evidence_manifest = (
                  citation_matches[0]
              )
              manifest_path = Path(os.environ["RULESPEC_CHECKOUT"]) / relative_path
              if canonical_refresh_items:
                  applied_files = applied_manifest.get("applied_files")
                  applied_paths = [
                      item.get("path")
                      for item in applied_files or []
                      if isinstance(item, dict)
                      and isinstance(item.get("path"), str)
                  ]
                  applied_path_set = set(applied_paths)
                  allowed_paths = {
                      expected_primary_path,
                      expected_companion_path,
                  }
                  if (
                      relative_path.as_posix() != expected_manifest_path
                      or applied_manifest.get("tool")
                      != "axiom-encode encode --apply"
                      or not isinstance(applied_files, list)
                      or len(applied_paths) != len(applied_files)
                      or len(applied_path_set) != len(applied_paths)
                      or expected_primary_path not in applied_path_set
                      or not applied_path_set.issubset(allowed_paths)
                  ):
                      raise SystemExit(
