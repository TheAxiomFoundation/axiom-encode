name: Merge reviewed SNAP queue activation
run-name: "Merge SNAP queue=${{ inputs.queue_id }} activation PR #${{ inputs.pull_request_number }}"

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: Durable protected SNAP queue identifier
        required: true
        default: us-snap-or-ut-2026-07
        type: choice
        options:
          - us-snap-or-ut-2026-07
          - us-snap-all-states-2026-07
      pull_request_number:
        description: Reviewed, ready, green SNAP queue activation pull request
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: merge-snap-queue-activation
  cancel-in-progress: false

jobs:
  merge:
    name: Merge reviewed SNAP queue activation
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
        && github.run_attempt == 1
      }}
    runs-on: ubuntu-latest
    # Long enough for the merge queue's CI run (about 20 minutes) behind a
    # few queued pull requests.
    timeout-minutes: 120
    steps:
      - name: Resolve exact reviewed pull request head
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if [[ ! "$PULL_REQUEST_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pull_request_number must be decimal" >&2
            exit 1
          fi
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" \
            > "$RUNNER_TEMP/activation-pr.json"
          jq -e '
            .state == "open"
            and .draft == false
            and .base.ref == "main"
            and .head.repo.full_name == env.GITHUB_REPOSITORY
          ' "$RUNNER_TEMP/activation-pr.json" > /dev/null
          echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/activation-pr.json")" \
            >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.base.sha' "$RUNNER_TEMP/activation-pr.json")" \
            >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r '.head.ref' "$RUNNER_TEMP/activation-pr.json")" \
            >> "$GITHUB_OUTPUT"

      - name: Checkout trusted pull request base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.pull.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate evidence and merge against live RuleSpec tip
        id: merge
        env:
          BASE_SHA: ${{ steps.pull.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pull.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          QUEUE_ID: ${{ inputs.queue_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags origin "$HEAD_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse "${HEAD_SHA}^")" = "$BASE_SHA"
          queue="data/encoding-queues/${QUEUE_ID}.json"
          candidate_queue="$RUNNER_TEMP/candidate-snap-queue.json"
          git show "$HEAD_SHA:$queue" > "$candidate_queue"
          python3 scripts/prepare_signed_queue.py validate "$candidate_queue"
          legacy_queue="data/encoding-queues/us-snap-or-ut-2026-07.json"
          all_state_queue="data/encoding-queues/us-snap-all-states-2026-07.json"
          if [ "$QUEUE_ID" = "us-snap-all-states-2026-07" ]; then
            test "$(git show "$BASE_SHA:$legacy_queue" | jq -r '.state')" != \
              "active"
          elif git cat-file -e "$BASE_SHA:$all_state_queue" 2> /dev/null; then
            echo "legacy SNAP queue is permanently superseded" >&2
            exit 1
          fi
          test "$(jq -r '.state' "$candidate_queue")" = "active"

          run_url="$(jq -r '.activation.finalizer_run_url' "$candidate_queue")"
          run_id="${run_url##*/}"
          test "$run_url" = \
            "https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          api_version="2026-03-10"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > "$RUNNER_TEMP/finalizer-run.json"
          gh api --paginate --slurp \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" \
            > "$RUNNER_TEMP/finalizer-jobs.json"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            > "$RUNNER_TEMP/finalizer-artifacts.json"
          archive_url="$(jq -er \
            --arg name "snap-queue-finalization-$run_id" '
              [
                .artifacts[]
                | select(.name == $name and .expired == false)
                | .archive_download_url
              ]
              | if length == 1 then .[0] else error("activation artifact is unavailable") end
            ' "$RUNNER_TEMP/finalizer-artifacts.json")"
          gh api "$archive_url" > "$RUNNER_TEMP/finalizer-evidence.zip"
          mkdir "$RUNNER_TEMP/finalizer-evidence"
          unzip -q "$RUNNER_TEMP/finalizer-evidence.zip" \
            -d "$RUNNER_TEMP/finalizer-evidence"
          evidence="$RUNNER_TEMP/finalizer-evidence"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | jq -R -s 'split("\n") | map(select(length > 0))' \
            > "$RUNNER_TEMP/current-activation-changed-files.json"
          tree_sha="$(git rev-parse "${HEAD_SHA}^{tree}")"
          python3 scripts/prepare_signed_queue.py verify-activation-commit \
            "$candidate_queue" \
            --provenance "$evidence/activation-commit.json" \
            --pull-request "$RUNNER_TEMP/activation-pr.json" \
            --current-base-sha "$BASE_SHA" \
            --current-head-sha "$HEAD_SHA" \
            --current-tree-sha "$tree_sha" \
            --current-changed-files "$RUNNER_TEMP/current-activation-changed-files.json"
          git show "$BASE_SHA:$queue" > "$RUNNER_TEMP/previous-snap-queue.json"
          python3 scripts/prepare_signed_queue.py verify-activation "$candidate_queue" \
            --previous-queue "$RUNNER_TEMP/previous-snap-queue.json" \
            --expected-base-sha "$BASE_SHA" \
            --finalized-queue "$evidence/finalized-snap-queue.json" \
            --check-runs "$evidence/rulespec-check-runs.json" \
            --pull-requests "$evidence/rulespec-pull-requests.json" \
            --workflow-runs "$evidence/targeted-workflow-runs.json" \
            --finalizer-run "$RUNNER_TEMP/finalizer-run.json" \
            --finalizer-jobs "$RUNNER_TEMP/finalizer-jobs.json" \
            --require-success true

          gh api --paginate --slurp \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
            > "$RUNNER_TEMP/activation-pr-checks.json"
          jq -e '
            [.[].check_runs[]] as $checks
            | ($checks | length) > 0
            and all(
              $checks[];
              .status == "completed"
              and (.conclusion | IN("success", "neutral", "skipped"))
            )
          ' "$RUNNER_TEMP/activation-pr-checks.json" > /dev/null

          rulespec_ref="$(jq -r '.dispatch.rulespec_ref' "$candidate_queue")"
          gh api --paginate --slurp \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/TheAxiomFoundation/rulespec-us/commits/$rulespec_ref/check-runs?per_page=100" \
            > "$RUNNER_TEMP/live-rulespec-check-runs.json"
          jq -e '
            [.[].check_runs[]] as $checks
            | ($checks | length) > 0
            and all(
              $checks[];
              .status == "completed"
              and (.conclusion | IN("success", "neutral", "skipped"))
            )
          ' "$RUNNER_TEMP/live-rulespec-check-runs.json" > /dev/null
          pr_base_branch="$(jq -r '.dispatch.pr_base_branch' "$candidate_queue")"
          test "$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: $api_version" \
            "repos/TheAxiomFoundation/rulespec-us/git/ref/heads/$pr_base_branch" \
            --jq '.object.sha')" = "$rulespec_ref"
          # Retry a read three times, so one API error does not end the wait.
          read_pr() {
            for attempt in 1 2 3; do
              if gh api \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" \
                > "$RUNNER_TEMP/merged-activation-pr.json"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          read_queue_entry() {
            for attempt in 1 2 3; do
              if gh api graphql \
                -F owner="${GITHUB_REPOSITORY%/*}" \
                -F name="${GITHUB_REPOSITORY#*/}" \
                -F number="$PULL_REQUEST_NUMBER" \
                -f query='query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) { mergeQueueEntry { state } }
                  }
                }' > "$RUNNER_TEMP/activation-queue-entry.json"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          # merge_group runs from an earlier enqueue of this pull request do not
          # count; a minute of slack covers clock skew.
          enqueued_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # With a merge queue on main, this adds the pull request to the
          # queue (still bound to HEAD_SHA) and GitHub merges it after the
          # queue's CI passes; without one it merges at once. Either way the
          # merger is recorded as this workflow's token, which the check
          # below and verify-merge-authorization require.
          gh pr merge "$PULL_REQUEST_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --match-head-commit "$HEAD_SHA"
          merged=false
          awaiting_since=""
          ci_started=false
          for _ in $(seq 1 180); do
            read_pr
            if jq -e '.merged_at != null' \
              "$RUNNER_TEMP/merged-activation-pr.json" > /dev/null; then
              merged=true
              break
            fi
            # GitHub sets merged_at when it closes a merged pull request, so a
            # closed pull request without merged_at is final.
            if ! jq -e '.state == "open"' \
              "$RUNNER_TEMP/merged-activation-pr.json" > /dev/null; then
              echo "activation pull request closed without a merge" >&2
              exit 1
            fi
            read_queue_entry
            entry_state="$(jq -r \
              '.data.repository.pullRequest.mergeQueueEntry.state // "NONE"' \
              "$RUNNER_TEMP/activation-queue-entry.json")"
            if [ "$entry_state" = "NONE" ]; then
              # The queue may have merged it just after the read above. A pull
              # request that gh put on auto-merge instead of into the queue
              # also has no entry; that fails here on purpose, and the
              # cleanup step turns auto-merge off.
              sleep 10
              read_pr
              if jq -e '.merged_at != null' \
                "$RUNNER_TEMP/merged-activation-pr.json" > /dev/null; then
                merged=true
                break
              fi
              echo "the merge queue removed the activation pull request" >&2
              exit 1
            fi
            # Events that GITHUB_TOKEN causes usually start no workflow run, and
            # a merge_group run belongs to the account that queued the pull
            # request. So once the queue builds this entry, a merge_group run
            # on its gh-readonly-queue/main/pr-<number>-<sha> branch must start
            # within 5 minutes. If none does, fail; the step after this one
            # takes the entry out, so it does not hold the queue for the
            # rule's 60-minute check timeout.
            if [ "$entry_state" != "AWAITING_CHECKS" ]; then
              # Not (or no longer) built, for example back in QUEUED after a
              # group rebuild: the next build must start its own CI run.
              if [ -n "$awaiting_since" ]; then
                awaiting_since=""
                ci_started=false
                enqueued_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              fi
            elif [ "$ci_started" != "true" ]; then
              awaiting_since="${awaiting_since:-$SECONDS}"
              ci_runs="$(gh api \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&per_page=100" \
                --jq "[.workflow_runs[] | select((.head_branch | startswith(\"gh-readonly-queue/main/pr-$PULL_REQUEST_NUMBER-\")) and (.created_at | fromdateiso8601) >= (\"$enqueued_at\" | fromdateiso8601) - 60)] | length" \
                || echo unknown)"
              if [[ "$ci_runs" =~ ^[1-9][0-9]*$ ]]; then
                ci_started=true
              elif [ "$ci_runs" = "0" ] \
                && [ $((SECONDS - awaiting_since)) -ge 300 ]; then
                echo "the merge queue started no merge_group CI run for pull request $PULL_REQUEST_NUMBER in 5 minutes; a pull request that GITHUB_TOKEN queues may need an App token" >&2
                exit 1
              fi
            fi
            sleep 30
          done
          if [ "$merged" != "true" ]; then
            echo "activation pull request did not merge within 90 minutes" >&2
            exit 1
          fi
          merge_commit="$(jq -er '
            select(
              .state == "closed"
              and .merged_at != null
              and .head.sha == env.HEAD_SHA
              and .merged_by.login == "github-actions[bot]"
            )
            | .merge_commit_sha
          ' "$RUNNER_TEMP/merged-activation-pr.json")"
          if [[ ! "$merge_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "trusted activation merge commit is unavailable" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$merge_commit" refs/remotes/origin/main
          queue_change_sha="$(git log --first-parent -1 --format=%H \
            refs/remotes/origin/main -- "$queue")"
          test "$queue_change_sha" = "$merge_commit"
          queue_sha256="$(python3 scripts/prepare_signed_queue.py sha256 \
            "$candidate_queue")"
          jq -n \
            --arg head_sha "$HEAD_SHA" \
            --arg merge_commit "$merge_commit" \
            --arg queue_path "$queue" \
            --arg queue_sha256 "$queue_sha256" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson pr_number "$PULL_REQUEST_NUMBER" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '{
              schema: "axiom-encode/snap-queue-merge-authorization/v1",
              repository: $repository,
              queue_path: $queue_path,
              queue_sha256: $queue_sha256,
              activation_pr_number: $pr_number,
              activation_pr_head_sha: $head_sha,
              merge_commit: $merge_commit,
              merge_workflow_run_id: $run_id,
              merge_workflow_run_attempt: 1,
              merge_workflow_run_url: $run_url
            }' > "$RUNNER_TEMP/snap-queue-merge-authorization.json"

      - name: Upload trusted queue merge authorization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snap-queue-merge-authorization-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/snap-queue-merge-authorization.json
            ${{ runner.temp }}/merged-activation-pr.json
          if-no-files-found: error
          retention-days: 90

      # If the merge step fails or is cancelled after it queued the pull
      # request, the queue could still merge it later with no merge
      # authorization artifact. So take an unmerged activation pull request out
      # of the queue and turn off any auto-merge. This also removes an entry
      # that a person queued; that is harmless, because verify-merge-authorization
      # rejects any activation merge that this workflow did not make. A LOCKED
      # entry can not be taken out; the queue then merges it with no artifact,
      # and the activation stays unauthorized, not unsafe.
      - name: Take an unmerged activation out of the merge queue
        if: ${{ (failure() || cancelled()) && steps.pull.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          gh api graphql \
            -F owner="${GITHUB_REPOSITORY%/*}" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F number="$PULL_REQUEST_NUMBER" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  id merged mergeQueueEntry { state } autoMergeRequest { enabledAt }
                }
              }
            }' > "$RUNNER_TEMP/activation-cleanup.json"
          pr='.data.repository.pullRequest'
          if jq -e "$pr.merged" "$RUNNER_TEMP/activation-cleanup.json" > /dev/null; then
            exit 0
          fi
          pr_id="$(jq -er "$pr.id" "$RUNNER_TEMP/activation-cleanup.json")"
          if jq -e "$pr.mergeQueueEntry != null" \
            "$RUNNER_TEMP/activation-cleanup.json" > /dev/null; then
            gh api graphql -F id="$pr_id" \
              -f query='mutation($id: ID!) {
                dequeuePullRequest(input: {id: $id}) { clientMutationId }
              }' > /dev/null
            echo "::warning::took activation pull request $PULL_REQUEST_NUMBER out of the merge queue"
          fi
          if jq -e "$pr.autoMergeRequest != null" \
            "$RUNNER_TEMP/activation-cleanup.json" > /dev/null; then
            gh api graphql -F id="$pr_id" \
              -f query='mutation($id: ID!) {
                disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId }
              }' > /dev/null
            echo "::warning::turned off auto-merge on activation pull request $PULL_REQUEST_NUMBER"
          fi

      # gh cannot delete the branch of a queued pull request, so this step
      # deletes it. It deletes the ref by its GraphQL ID, only while the ref
      # still has the activation branch's name and the reviewed head, so a
      # branch name with URL characters (such as "#") can not select another
      # branch. A failed delete leaves a stale branch, not a bad merge.
      - name: Delete merged activation branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pull.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          gh api graphql \
            -F owner="${GITHUB_REPOSITORY%/*}" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F number="$PULL_REQUEST_NUMBER" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  headRef { id name target { oid } }
                }
              }
            }' > "$RUNNER_TEMP/activation-head-ref.json"
          ref_id="$(jq -r '
            .data.repository.pullRequest.headRef
            | select(.name == env.HEAD_REF and .target.oid == env.HEAD_SHA)
            | .id
          ' "$RUNNER_TEMP/activation-head-ref.json")"
          if [ -z "$ref_id" ]; then
            echo "::warning::activation branch is gone or moved; not deleting it"
            exit 0
          fi
          gh api graphql -F id="$ref_id" \
            -f query='mutation($id: ID!) {
              deleteRef(input: {refId: $id}) { clientMutationId }
            }' > /dev/null
