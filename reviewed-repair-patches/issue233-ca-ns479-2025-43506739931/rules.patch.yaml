        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/ns479-credits
          excerpt: 'You can claim these refundable tax credits even if you do not
            have to pay any

            tax. If the total of these credits is more than the amount of taxes you
            have

            to pay, you may get a refund for the difference.'
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/ns479-credits
          excerpt: CRA Form NS479 2025 Nova Scotia Credits
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/ns479-credits
          excerpt: CRA Form NS479 2025 Nova Scotia Credits
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: "if nova_scotia_credits_line_47900 > taxes_to_pay:\n  nova_scotia_credits_line_47900\
      \ - taxes_to_pay\nelse:\n  0"
