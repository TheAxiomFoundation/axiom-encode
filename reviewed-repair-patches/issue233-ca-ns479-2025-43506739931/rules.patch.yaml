- name: conditional_credit_excess_over_taxes
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: NS479 says a refund may result where total credits exceed taxes to pay.
  metadata:
    proof:
      atoms:
