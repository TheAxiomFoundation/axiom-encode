format: rulespec/v1
module:
  summary: 'CRA Schedule 2 calculates 2025 federal amounts transferred from a spouse

    or common-law partner. A breakdown separation of 90 days or more that

    includes December 31, 2025 prevents the transfer.'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
    source_sha256: e27a34b0cc3314a0260cb848cd2caf3fc56772812554db29ae5ddd013e41f845
units:
- name: CAD
  kind: currency
  minor_units: 2
rules:
- name: schedule_2_continuing_claim_no_new_T2201
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: Schedule 2 footnote (1), eligibility in 2024, continuing requirements in
    2025, and exceptions requiring a new T2201.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: 'Before assessing your return, the Canada Revenue Agency (CRA)
            will review your claim to see if your spouse or

            common-law partner is eligible for the disability tax credit. If they
            were eligible for 2024 and still meet the requirements

            in 2025, you do not need to send the CRA a new Form T2201 to claim this
            amount.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: 'However, you must send the CRA

            a new Form T2201 if the previous period of approval ended before 2025
            or if the CRA asks you to.'
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: 'spouse_disability_amount_line_31600 > 0

      and spouse_DTC_eligible_in_fact_year

      and spouse_DTC_eligibility_fact_year == schedule_2_DTC_prior_eligibility_year

      and spouse_DTC_meets_requirements_in_fact_year

      and spouse_DTC_requirements_fact_year == schedule_2_DTC_current_requirements_year

      and not previous_DTC_approval_ended_before_2025

      and not CRA_requested_new_T2201'
- name: schedule_2_attach_completed_certified_T2201
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: Schedule 2 footnote (1) requires a completed and certified T2201 for a new
    disability claim attached to a paper return.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: 'Disability amount:

            Enter the amount from line 31600 of their return. (1)'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: '(1) If this is a new claim for the disability amount, attach a
            completed and certified Form T2201, Disability Tax Credit


            Certificate, to your paper return.'
  versions:
  - effective_from: '2025-01-01'
    formula: spouse_disability_amount_line_31600 > 0 and disability_claim_is_new and
      filing_paper_return
