- name: federal_amounts_transferred_from_spouse_line_32600
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: Schedule 2 line 13, including the relationship and separation restriction.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: 'Line 6 minus line 12 (if negative, enter "0")

            Enter this amount on line 32600 of your return.'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: 'Complete this schedule to claim a transfer of the unused part
            of your spouse''s or common-law partner''s federal amounts below.

            You may be able to claim all or part of certain amounts that your spouse
            or common-law partner qualifies for if they do not need

            to use them to reduce their federal tax to zero.

            Complete the provincial or territorial schedule (S2) to calculate your
            provincial or territorial amounts.

            '
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: 'If your spouse or common-law partner is filing a return, use the
            amounts entered on their return.

            If your spouse or common-law partner is not filing a return, use the amounts
            they would have entered on their return, schedules,

            and worksheets as if they were filing a return, and attach their information
            slips.

            '
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: 'If you were separated because of a breakdown in your relationship
            for a period of 90 days or more including December 31, 2025,

            your spouse or common-law partner cannot transfer any unused amounts to
            you.

            '
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: CRA Schedule 2 2025 Federal Amounts Transferred from your Spouse
            or Common-Law Partner
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/cra/t1-2025/federal-spouse-transfer-amounts
          excerpt: CRA Schedule 2 2025 Federal Amounts Transferred from your Spouse
            or Common-Law Partner
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: "if source_relationship_allows_transfer:\n  max( 0, federal_2025_schedule_2_total_transferable_amounts_line_6\
      \ - federal_2025_schedule_2_spouse_adjusted_taxable_income_line_12 )\nelse:\n\
      \  0"
