format: rulespec/v1
module:
  summary: 'Schedule NB(S12) 2025: line 3 is line 1 minus line 2, to a

    maximum of $10,000; line 5 subtracts line 4; line 7 applies 10%.

    The schedule also gives reporting and medical-separation instructions.'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/cra/t1-2025/nb-s12-seniors-home-renovation-credit
    source_sha256: 379be48dbb691c24d89f966c85bb3facd095ad59850f945bbf71e3dc9a92ffbe
units:
- name: CAD
  kind: currency
  minor_units: 2
inputs:
- name: nb_s12_home_renovation_total_eligible_expenses_line_1
  dtype: Money
  entity: Person
  period: Year
  description: Entered total eligible expenses from the sales slips and contracts in this claimant form;
    no eligibility computation or inferred table aggregation.
  unit: CAD
- name: nb_s12_government_assistance_line_2
  dtype: Money
  entity: Person
  period: Year
  description: Government assistance received or receivable included in this claimant line1 amount.
  unit: CAD
- name: nb_s12_expenses_claimed_by_other_eligible_individuals_line_4
  dtype: Money
  entity: Person
  period: Year
  description: Expenses included in this claimant capped line3 being claimed by other eligible individuals;
    not a household ownership inference.
  unit: CAD
- name: is_completing_home_renovation_schedule
  dtype: Boolean
  entity: Person
  period: Year
  description: This individual is completing this schedule; does not assert eligibility or completion
    compliance.
- name: is_filing_paper_return
  dtype: Boolean
  entity: Person
  period: Year
  description: This individual is filing a paper return.
- name: needs_additional_space
  dtype: Boolean
  entity: Person
  period: Year
  description: The individual completing this form needs more space for its entries.
- name: has_eligible_home_renovation_expenses
  dtype: Boolean
  entity: Person
  period: Year
  description: The individual has eligible home renovation expenses as an externally supplied form premise,
    not derived from positive amount or age.
- name: expenses_relate_to_return_page_one_residence
  dtype: Boolean
  entity: Person
  period: Year
  description: The claimant answers whether expenses on line1 relate to residence address entered on return
    page1; no address equality inferred.
- name: has_spouse_or_common_law_partner_at_reference_date
  dtype: Boolean
  entity: Person
  period: Year
  description: The claimant has the explicitly identified spouse/common-law partner at the medical reference
    date. Reciprocal fixture descriptions identify two distinct claimants; no engine relation is inferred.
- name: occupied_separate_principal_residences_at_reference_date
  dtype: Boolean
  entity: Person
  period: Year
  description: Claimant and identified spouse/common-law partner occupied separate principal residences
    on the explicit reference date.
- name: principal_residence_separation_was_for_medical_reasons
  dtype: Boolean
  entity: Person
  period: Year
  description: The stated separate principal residences at the reference date were for medical reasons.
- name: medical_separation_reference_date
  dtype: Date
  entity: Person
  period: Year
  description: Date at which all three medical-separation premise facts are asserted; not the date of
    this execution.
- name: gst_hst_number_is_applicable
  dtype: Boolean
  entity: SourceEntry
  period: Year
  description: For this explicitly identified sales-slip/contract entry, GST/HST number is applicable;
    no claimant-entry ownership or complete table inferred.
rules:
- name: nb_s12_net_home_renovation_expenses_line_3
  kind: derived
  dtype: Money
  source: 'Line 1: Total amount paid from all sales slips and contracts included in the

    table above Total eligible expenses = ^


    Line 2: Amount of government assistance received or receivable included in

    the amount on line 1 ^


    Line 3: Line 1 minus line 2 (maximum $10,000) = ^'
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: min(nb_s12_2025_home_renovation_expense_cap, entered_total_eligible_home_renovation_expenses
      - entered_home_renovation_assistance)
  entity: Person
  period: Year
  unit: CAD
